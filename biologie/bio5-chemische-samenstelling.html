<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BIO5 Chemische samenstelling · QuizMore</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* Layout: één smalle werkkolom. Overzicht met onderwerpkaarten, daarna een vraag per scherm met directe uitleg. */
:root{
  --bg:#F2F5F7; --surface:#FFFFFF; --surface2:#E7EDF1; --ink:#14232D; --muted:#566873; --line:#D3DDE3;
  --accent:#0B7A75; --accent-ink:#FFFFFF; --accent-soft:#D9EFEC;
  --good:#1B7F47; --good-soft:#DDF1E4; --bad:#BE3326; --bad-soft:#F9E1DE; --warn:#9A6200; --warn-soft:#FBEFD3;
  --font-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --font-body:'IBM Plex Sans','Segoe UI',system-ui,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1A21; --surface:#16252E; --surface2:#1D303B; --ink:#E6EEF2; --muted:#93A7B2; --line:#2A404D;
    --accent:#3CC3BB; --accent-ink:#072320; --accent-soft:#12383A;
    --good:#4CC17F; --good-soft:#12341F; --bad:#F0776A; --bad-soft:#3B1A17; --warn:#E9B04A; --warn-soft:#3A2C0E;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1A21; --surface:#16252E; --surface2:#1D303B; --ink:#E6EEF2; --muted:#93A7B2; --line:#2A404D;
  --accent:#3CC3BB; --accent-ink:#072320; --accent-soft:#12383A;
  --good:#4CC17F; --good-soft:#12341F; --bad:#F0776A; --bad-soft:#3B1A17; --warn:#E9B04A; --warn-soft:#3A2C0E;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.5;
  padding-block:24px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:20px;min-width:0}
h1,h2,h3{font-family:var(--font-display);font-weight:700;line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(28px,5.5vw,40px)}
h2{font-size:clamp(20px,3.6vw,25px)}
h3{font-size:18px}
p{margin:0}
.eyebrow{font-family:var(--font-mono);font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--accent)}
.muted{color:var(--muted)}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.btn{appearance:none;border:1.5px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 16px;font-weight:600;cursor:pointer;min-height:44px;transition:background .15s,border-color .15s}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover:not(:disabled){filter:brightness(1.08)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.small{min-height:36px;padding:6px 12px;font-size:14px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;min-width:0}
.hero{display:flex;flex-direction:column;gap:10px}
.hero p{max-width:62ch;color:var(--muted)}

.mastery{display:flex;flex-direction:column;gap:14px}
.mastery-top{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:baseline;justify-content:space-between}
.big{font-family:var(--font-display);font-weight:700;font-size:34px;font-variant-numeric:tabular-nums;line-height:1}
.big small{font-size:18px;color:var(--muted);font-weight:600}
.bar{height:10px;border-radius:6px;background:var(--surface2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:6px;transition:width .4s}
.bar.thin{height:6px}

.exam{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:12px;align-items:end}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-family:var(--font-mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
select,input[type=text]{background:var(--surface);border:1.5px solid var(--line);border-radius:8px;padding:9px 10px;min-height:44px;width:100%;min-width:0}

.topics{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:14px}
.topic{display:flex;flex-direction:column;gap:12px;justify-content:space-between}
.topic .tag{font-family:var(--font-mono);font-size:12px;color:var(--muted);letter-spacing:.05em}
.topic .count{font-variant-numeric:tabular-nums;font-size:14px;color:var(--muted);display:flex;justify-content:space-between}
.topic.done{border-color:var(--good)}
.topic .actions{display:flex;gap:8px;flex-wrap:wrap}
.topic .actions .btn{flex:1 1 auto}

/* sessie */
.topbar{display:flex;align-items:center;gap:14px}
.topbar .bar{flex:1}
.topbar .n{font-family:var(--font-mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.qcard{display:flex;flex-direction:column;gap:18px}
.meta{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-family:var(--font-mono);font-size:12px;letter-spacing:.04em;padding:3px 9px;border-radius:999px;background:var(--surface2);color:var(--muted)}
.chip.a{background:var(--accent-soft);color:var(--accent)}
.qtext{font-family:var(--font-display);font-weight:600;font-size:clamp(19px,3.4vw,23px);line-height:1.3}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{appearance:none;text-align:left;display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;min-height:48px;width:100%}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .key{flex:none;font-family:var(--font-mono);font-size:12px;width:24px;height:24px;border-radius:6px;background:var(--surface2);color:var(--muted);display:grid;place-items:center;margin-top:1px}
.opt .txt{min-width:0;overflow-wrap:anywhere}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.good{border-color:var(--good);background:var(--good-soft)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.missed{border-color:var(--good);border-style:dashed}
.opt:disabled{cursor:default;color:inherit}
.hintline{font-size:14px;color:var(--muted)}
.fillrow{display:flex;gap:10px;flex-wrap:wrap}
.fillrow input{flex:1 1 220px}
input.good,select.good{border-color:var(--good);background:var(--good-soft)}
input.bad,select.bad{border-color:var(--bad);background:var(--bad-soft)}
.matchrows{display:flex;flex-direction:column;gap:10px}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:10px;align-items:center}
.mrow .l{font-weight:600;overflow-wrap:anywhere}
.mrow .fix{grid-column:1/-1;font-size:14px;color:var(--good)}
@media (max-width:520px){.mrow{grid-template-columns:1fr}}
.fb{border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;border:1.5px solid}
.fb.good{background:var(--good-soft);border-color:var(--good)}
.fb.bad{background:var(--bad-soft);border-color:var(--bad)}
.fb .h{font-weight:700}
.fb.good .h{color:var(--good)} .fb.bad .h{color:var(--bad)}
.fb .ans{overflow-wrap:anywhere}
.fb ul{margin:0;padding-left:18px}
.fb .ex{color:var(--ink)}
.actions-row{display:flex;gap:10px;flex-wrap:wrap}
.why{display:flex;flex-direction:column;gap:4px}
.why ul{margin:0;padding-left:18px}
.fb .yours{color:var(--muted)}

/* theorie en resultaat */
.theory ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px}
.theory li{max-width:68ch}
.theory b{font-weight:600}
.score{display:flex;flex-wrap:wrap;gap:12px 28px;align-items:baseline}
.rev{display:flex;flex-direction:column;gap:10px}
details.r{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:0}
details.r>summary{cursor:pointer;padding:12px 14px;display:flex;gap:10px;align-items:flex-start;list-style:none}
details.r>summary::-webkit-details-marker{display:none}
details.r .mark{flex:none;font-weight:700;width:20px}
details.r.ok .mark{color:var(--good)} details.r.no .mark{color:var(--bad)}
details.r .body{padding:0 14px 14px 44px;display:flex;flex-direction:column;gap:6px;font-size:15px}
details.r .body ul{margin:0;padding-left:18px}
.back{align-self:flex-start;font-size:14px;font-weight:600;color:var(--accent);text-decoration:none}
.back:hover{text-decoration:underline}
.foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
/* ============ VRAGEN ============ */
const TOPICS=[
{id:'el',tag:'§1 en §2',title:'Elementen en moleculen',sum:[
 '<b>Hoofdbestanddelen</b> van organische moleculen: <b>O, C, H, N</b>.',
 'Kleine fracties, wel belangrijk: <b>Ca</b> (beenderen gewervelden, celwand planten, prikkelgeleiding), <b>P</b> (o.a. nucleïnezuren), <b>Fe</b> (hemoglobine, O₂-transport in bloed), <b>Si</b> (bouwsteen collageen in bindweefsel, essentieel voor ontwikkeling).',
 '<b>Anorganisch</b>: H₂O, CO₂, O₂, anorganische zuren, anorganische zouten.',
 '<b>Organisch</b>: sachariden (suikers), lipiden (vetten), proteïnen (eiwitten), nucleïnezuren.',
 'Zo goed als alle functies in de cel worden door die vier groepen organische moleculen uitgevoerd.']},
{id:'wa',tag:'§2.1',title:'Water',sum:[
 '<b>Polair</b>: zuurstof δ⁻, waterstof δ⁺. Tegengestelde deelladingen trekken elkaar aan: sterke interactie tussen watermoleculen, de <b>waterstofbruggen</b>.',
 '<b>Polair oplosmiddel</b>: polaire moleculen, ionen en moleculen met polaire groepen lossen goed op.',
 '<b>Chemische reacties</b>: molecule splitsen met water = <b>hydrolyse</b>. Molecule vormen met afsplitsing van water = <b>condensatiereactie</b>.',
 '<b>Transport</b>: bloed- en lymfevatenstelsel (mens), vaatbundels (planten).',
 '<b>Warmteregulatie</b>: hoge specifieke warmtecapaciteit, behoud lichaamstemperatuur door transpiratie.',
 '<b>Smeermiddel</b>: bestanddeel van slijm (mucus), bescherming interne organen en gewrichtssmeer.']},
{id:'ga',tag:'§2.2 en §2.3',title:'Zuurstofgas en koolstofdioxide',sum:[
 '<b>O₂</b>: apolair, lost slecht op in water, nodig voor cellen. Transport naar cellen via gespecialiseerde moleculen zoals <b>hemoglobine</b>.',
 '<b>CO₂</b>: bijproduct van celademhaling in de mitochondriën, van weefsels naar het bloed.',
 'Het grootste deel CO₂ wordt omgezet naar <b>koolzuur (H₂CO₃)</b>, dat ioniseert tot <b>H⁺ en HCO₃⁻</b>. Dit regelt de <b>pH van het bloed</b>.',
 'Reactie: CO₂ + H₂O ⇌ H₂CO₃ ⇌ H⁺ + HCO₃⁻.',
 'Planten hebben CO₂ nodig voor de <b>fotosynthese</b>.']},
{id:'sa',tag:'§3.1',title:'Sachariden',sum:[
 '<b>Monosachariden</b>: 5 of 6 C-atomen (keten of ring). Glucose (energiebron, bouwsteen polysachariden), fructose (energiebron in vruchten), galactose.',
 '<b>Disachariden</b>: covalente binding tussen 2 monosachariden. Sucrose = glucose + fructose (tafelsuiker, uit suikerbiet of suikerriet). Lactose = galactose + glucose (melksuiker).',
 '<b>Polysachariden</b>: covalente binding tussen meerdere monosachariden, voor structuur en energieopslag.',
 '<b>Glycogeen</b>: vertakt, energieopslag in lever en spieren (dieren), energiebron bij schimmels.',
 '<b>Zetmeel</b>: amylose (lineair) + amylopectine (vertakt), belangrijkste energiereserve van planten.',
 '<b>Chitine</b>: celwand schimmels, exoskelet ongewervelden.',
 '<b>Cellulose</b>: celwand planten en wieren, lange onvertakte glucoseketens, H-bruggen tussen ketens voor stevigheid, onverteerbaar voor de mens en de meeste dieren.']},
{id:'li',tag:'§3.2',title:'Lipiden',sum:[
 'Grotendeels <b>apolair</b>, slecht of niet oplosbaar in water. Drie groepen: <b>triglyceriden, fosfolipiden, steroïden</b>.',
 '<b>Triglyceride</b> = glycerol + 3 vetzuren (condensatiereactie). Glycerol: C₃-molecule met 3 hydroxylgroepen (-OH). Vetzuur: lineair carbonzuur (-COOH).',
 '<b>Verzadigd</b>: alleen enkelvoudige bindingen, vast bij kamertemperatuur, risico op hart- en vaatziekten. <b>Onverzadigd</b>: een of meer dubbele bindingen, vloeibaar, in planten, zaden en vruchten, onderdeel van een gezond dieet.',
 'Functies triglyceriden: <b>energieopslag</b> (vetcellen, zaden), <b>isolatie</b> (slechte warmtegeleiders), <b>waterafstoting</b> (veren, huid, cuticula).',
 '<b>Fosfolipide</b> = glycerol + 2 vetzuren + fosfaatgroep. Belangrijkste bouwsteen van membranen. Dubbelmembraan: apolaire hydrofobe vetzuurstaarten binnenin naar elkaar toe (barrière voor vrije verplaatsing), polaire hydrofiele fosfaatkoppen naar de waterige omgeving.',
 '<b>Steroïden</b>: 4 ringvormige moleculen, geen vetzuren, wel apolair. Cholesterol (onderdeel biomembraan, beïnvloedt soepelheid en stabiliteit), geslachtshormonen, bijnierschorshormonen, vitamine D.']},
{id:'az',tag:'§3.3',title:'Aminozuren en eiwitstructuur',sum:[
 '<b>Aminozuur</b> (monomeer van eiwit): centraal C-atoom, aminogroep (-NH₂), H-atoom, carboxygroep (-COOH) en restgroep (R). De restgroep verschilt per aminozuur: <b>20 verschillende aminozuren</b>.',
 'Aminogroep + carboxygroep: H₂O wordt afgesplitst (condensatiereactie) en er ontstaat een <b>peptidebinding</b>. 2 AZ = dipeptide, meerdere = polypeptide (= eiwit). Een eiwit is een onvertakt polymeer.',
 '<b>Primair</b>: volgorde van aminozuren in de keten (peptidebindingen als ruggengraat).',
 '<b>Secundair</b>: waterstofbruggen tussen O van C=O en H van N-H in de peptidebindingen geven <b>α-helix</b> en <b>β-plaat</b>.',
 '<b>Tertiair</b>: verdere 3D-plooiing door interacties tussen restgroepen: waterstofbruggen, ionbindingen, apolaire interacties, S-S-bindingen.',
 '<b>Quaternair</b>: meerdere polypeptideketens (subeenheden) vormen samen één functioneel eiwit, geassocieerd via interacties tussen restgroepen (bv. hemoglobine: 4 subeenheden).']},
{id:'ei',tag:'§3.3',title:'Eiwitten: denaturatie en functies',sum:[
 '<b>Denaturatie</b> = een eiwit verliest zijn 3D-structuur. Oorzaken: hoge temperatuur, lage pH, hoge zoutconcentraties (interacties verbroken).',
 'Structuur en functie hangen nauw samen: een gedenatureerd eiwit is niet meer functioneel.',
 '<b>Structuur</b>: tubuline (microtubuli), keratine en collageen (haar, nagels, pezen, bindweefsel).',
 '<b>Enzymen</b>: biokatalysatoren. <b>Transport</b>: transmembraaneiwitten, hemoglobine. <b>Communicatie</b>: prikkels opvangen, hormonen zoals insuline (signaalmolecule), werking organen en weefsels regelen.']},
{id:'en',tag:'§3.3',title:'Enzymen',sum:[
 'Reacties in de cel vragen <b>activeringsenergie</b>. Zonder genoeg energie (warmte) zijn reacties te traag. Enzymen zijn <b>biokatalysatoren</b>: ze versnellen de reactie door de activeringsenergie te verlagen. Het enzym zelf blijft onveranderd.',
 '<b>Actief centrum</b> = specifieke bindingsplaats in de 3D-structuur. Het houdt moleculen in een bepaalde positie en vergroot de kans op reactie van het <b>substraat</b>. Binding geeft het <b>enzym-substraatcomplex</b>.',
 '<b>Regulatie</b>: meer enzym aanmaken (meer activiteit) of <b>inhibitoren</b> (remmend). Een inhibitor bindt op het actief centrum (competitie) of elders op het enzym en beïnvloedt de structuur van het actief centrum.',
 '<b>Co-enzym</b> = organische molecule nodig voor de werking (bv. ATP, NADH). <b>Cofactor</b> = ion.',
 '<b>Naamgeving</b>: functie of substraat + <b>-ase</b> (lipase, protease, lactase). Soms minder duidelijk: pepsine (afbraak eiwitten in de spijsvertering), lysozyme (afbraak celwand bacteriën).']},
{id:'nu',tag:'§3.4',title:'Nucleïnezuren',sum:[
 'Polymeren van lineair gebonden <b>nucleotiden</b>: 5 tot miljoenen nucleotiden per polynucleotide. Twee soorten: <b>DNA</b> en <b>RNA</b>.',
 '<b>Nucleotide</b> = fosfaatgroep + monosacharide (ribose in RNA, desoxyribose in DNA) + stikstofhoudende base. Basen: A, C, G, <b>T (enkel DNA)</b>, <b>U (enkel RNA)</b>.',
 '<b>DNA</b>: suiker-fosfaat als ruggengraat (covalent). Uiteinde met sacharide = <b>3\'-einde</b>, uiteinde met fosfaatgroep = <b>5\'-einde</b>.',
 'Dubbelhelix: 2 ketens, N-basen naar elkaar toe met <b>H-bruggen</b>, ketens <b>antiparallel</b> en <b>complementair</b>: A-T en C-G.',
 'DNA draagt de genetische informatie in de <b>volgorde van de basen</b>, die bij eiwitsynthese wordt omgezet in de volgorde van aminozuren.',
 '<b>RNA</b>: enkele streng, ook suiker-fosfaat ruggengraat, verschillende soorten met een specifieke functie in de eiwitsynthese.']},
{id:'mx',tag:'Alles samen',title:'Overkoepelend',sum:[
 'Condensatie (water af) vormt triglyceriden, disachariden, polysachariden en peptiden. Hydrolyse (water erbij) splitst ze weer.',
 'Bouwstenen: sachariden uit monosachariden, eiwitten uit aminozuren, nucleïnezuren uit nucleotiden, triglyceriden uit glycerol en vetzuren.',
 'Let op het verschil tussen vertakt (glycogeen, amylopectine) en onvertakt (cellulose, amylose, eiwitketen).']}
];

const Qs=[];
const mc=(t,q,ans,wrong,ex)=>Qs.push({t,type:'mc',q,opts:[ans,...wrong],ex});
const tf=(t,q,val,ex)=>Qs.push({t,type:'tf',q,val,ex});
const fill=(t,q,acc,ex,show)=>Qs.push({t,type:'fill',q,acc,ex,show:show||acc[0]});
const multi=(t,q,good,bad,ex)=>Qs.push({t,type:'multi',q,good,bad,ex});
const match=(t,q,pairs,ex)=>Qs.push({t,type:'match',q,pairs,ex});

/* --- Elementen en moleculen --- */
mc('el','Welke vier elementen vormen de hoofdbestanddelen van de organische moleculen in cellen?','O, C, H en N',['C, H, Ca en P','O, C, Fe en Si','H, N, P en Ca'],'Zuurstof, koolstof, waterstof en stikstof. Ca, Fe, P en Si komen maar in kleine fracties voor.');
match('el','Koppel elk element aan zijn functie.',[['Calcium (Ca)','Beenderen, celwand planten, prikkelgeleiding'],['IJzer (Fe)','Werking van hemoglobine'],['Fosfor (P)','Element in biomoleculen zoals nucleïnezuren'],['Silicium (Si)','Bouwsteen van collageen']],'Ca: beenderen van gewervelden, celwand van planten en prikkelgeleiding. Fe: hemoglobine (O₂-transport). P: o.a. nucleïnezuren. Si: collageen in bindweefsel.');
fill('el','Welk element is nodig voor de werking van hemoglobine?',['ijzer','fe'],'IJzer (Fe) zit in hemoglobine, dat O₂ in het bloed transporteert.','ijzer (Fe)');
fill('el','Welk element is een belangrijk onderdeel van nucleïnezuren (naast C, H, O, N)?',['fosfor','p'],'Fosfor (P) zit in de fosfaatgroep van elk nucleotide.','fosfor (P)');
multi('el','Welke functies heeft calcium (Ca)? Kies alle juiste antwoorden.',['Opbouw van beenderen bij gewervelden','Opbouw van de celwand bij planten','Prikkelgeleiding'],['O₂-transport in het bloed','Bouwsteen van collageen'],'O₂-transport hoort bij ijzer (hemoglobine). Collageen bevat silicium.');
mc('el','Welk element is een bouwsteen van collageen in bindweefsel?','Silicium (Si)',['Calcium (Ca)','IJzer (Fe)','Fosfor (P)'],'Silicium is een bouwsteen van collageen en essentieel voor de ontwikkeling.');
tf('el','Ca, Fe, P en Si komen maar in kleine fracties voor, dus ze hebben geen belangrijke functies.',false,'Ze komen in kleine fracties voor, maar hebben wel belangrijke functies.');
multi('el','Welke stoffen zijn anorganische moleculen in organismen? Kies alle juiste antwoorden.',['Water','Koolstofdioxide','Zuurstofgas','Anorganische zouten'],['Lipiden','Proteïnen'],'Anorganisch: H₂O, CO₂, O₂, anorganische zuren en zouten. Lipiden en proteïnen zijn organisch.');

function norm(s){return String(s).toLowerCase().replace(/[₀-₉⁻⁺]/g,c=>SUB[c]).normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9αβ]/g,'')}
function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let p=[];for(let j=0;j<=n;j++)p[j]=j;for(let i=1;i<=m;i++){let c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
function stat(ids){let m=0;ids.forEach(id=>{if(P[id]&&P[id].mastered)m++});return {m,n:ids.length}}
const idsOf=t=>Qs.filter(q=>!t||q.t===t).map(q=>q.id);
function weakIds(){return Qs.filter(q=>P[q.id]&&P[q.id].wrong>0&&!P[q.id].mastered).map(q=>q.id)}

function correctHTML(q){
  if(q.type==='mc')return esc(q.opts[0]);
  if(q.type==='tf')return q.val?'Juist':'Onjuist';
  if(q.type==='fill')return esc(q.show);
  if(q.type==='multi')return '<ul>'+q.good.map(g=>'<li>'+esc(g)+'</li>').join('')+'</ul>';
  return '<ul>'+q.pairs.map(p=>'<li>'+esc(p[0])+' → '+esc(p[1])+'</li>').join('')+'</ul>';
}

/* ---- widgets ---- */
function wChoice(q,ctx){
  const opts=q.type==='tf'?[{text:'Juist',ok:q.val===true},{text:'Onjuist',ok:q.val===false}]:shuffle(q.opts.map((t,i)=>({text:t,ok:i===0,i})));
  const root=h('div','opts');let sel=null,locked=false;const btns=[];
  opts.forEach((o,i)=>{
    const b=h('button','opt','<span class="key">'+(i+1)+'</span><span class="txt">'+esc(o.text)+'</span>');b.type='button';
    b.onclick=()=>{if(locked)return;sel=o;btns.forEach(x=>x.classList.remove('sel'));b.classList.add('sel');if(!ctx.exam)ctx.submit(api.getRes());else ctx.changed()};
    btns.push(b);root.appendChild(b)});
  const api={root,confirm:ctx.exam,ready:()=>sel!==null,
    getRes:()=>({ok:sel.ok,user:sel.text,why:sel.ok?[]:[q.type==='tf'?'Je koos "'+sel.text+'", maar de stelling is '+(q.val?'juist':'onjuist')+'.':((WHY[q.id]||[])[sel.i-1]||'Dit antwoord klopt niet.')]}),
    reveal(res){locked=true;btns.forEach((b,i)=>{b.disabled=true;b.classList.remove('sel');if(opts[i].ok)b.classList.add('good');else if(opts[i]===sel)b.classList.add('bad')})},
    key(n){if(btns[n-1])btns[n-1].click()},focus(){}};
  return api;
}
function wMulti(q,ctx){
  const opts=shuffle([...q.good.map(t=>({text:t,ok:true})),...q.bad.map((t,bi)=>({text:t,ok:false,bi}))]);
  const root=h('div','opts');const hint=h('div','hintline','Er zijn '+q.good.length+' juiste antwoorden.');root.appendChild(hint);
  let locked=false;const btns=[];
  opts.forEach((o,i)=>{const b=h('button','opt','<span class="key">'+(i+1)+'</span><span class="txt">'+esc(o.text)+'</span>');b.type='button';o.on=false;
    b.setAttribute('aria-pressed','false');
    b.onclick=()=>{if(locked)return;o.on=!o.on;b.classList.toggle('sel',o.on);b.setAttribute('aria-pressed',o.on);ctx.changed()};
    btns.push(b);root.appendChild(b)});
  return {root,confirm:true,ready:()=>opts.some(o=>o.on),
    getRes:()=>({ok:opts.every(o=>o.on===o.ok),user:opts.filter(o=>o.on).map(o=>o.text).join(', ')||'(niets)',why:[...opts.filter(o=>o.on&&!o.ok).map(o=>'Je koos "'+o.text+'": '+((WHY[q.id]||[])[o.bi]||'dit hoort er niet bij.')),...opts.filter(o=>!o.on&&o.ok).map(o=>'Je miste "'+o.text+'", dat hoort er wel bij.')]}),
    reveal(){locked=true;btns.forEach((b,i)=>{b.disabled=true;b.classList.remove('sel');const o=opts[i];if(o.ok&&o.on)b.classList.add('good');else if(o.ok&&!o.on)b.classList.add('missed');else if(!o.ok&&o.on)b.classList.add('bad')})},
    key(n){if(btns[n-1])btns[n-1].click()},focus(){}};
}
function wFill(q,ctx){
  const root=h('div','fillrow');const inp=h('input');inp.type='text';inp.id='fill-in';inp.autocomplete='off';inp.autocapitalize='off';inp.spellcheck=false;inp.placeholder='Typ je antwoord';
  inp.setAttribute('aria-label','Antwoord');root.appendChild(inp);
  inp.addEventListener('input',()=>ctx.changed());
  inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();ctx.confirmNow()}});
  return {root,confirm:true,ready:()=>inp.value.trim()!=='',
    getRes(){const u=norm(inp.value);let ok=false,note='';
      const acc=q.acc.map(norm);
      if(acc.includes(u))ok=true;
      else if(u.length>=6&&acc.some(a=>a.length>=6&&lev(u,a)<=1)){ok=true;note='Bijna perfect geschreven. Juiste spelling: '+q.show+'.'}
      return {ok,user:inp.value.trim(),note,why:ok?[]:['Je typte "'+inp.value.trim()+'". Dat is niet het gevraagde begrip, of het is te ver van de juiste spelling verwijderd.']}},
    reveal(res){inp.disabled=true;inp.classList.add(res.ok?'good':'bad')},
    key(){},focus(){inp.focus()}};
}
function wMatch(q,ctx){
  const rights=shuffle(q.pairs.map(p=>p[1]));
  const root=h('div','matchrows');const sels=[];
  q.pairs.forEach((p,i)=>{
    const row=h('div','mrow');const l=h('div','l',esc(p[0]));
    const s=h('select');s.id='m-'+i;s.setAttribute('aria-label',p[0]);
    s.innerHTML='<option value="">Kies...</option>'+rights.map(r=>'<option value="'+esc(r)+'">'+esc(r)+'</option>').join('');
    s.onchange=()=>ctx.changed();sels.push(s);row.appendChild(l);row.appendChild(s);root.appendChild(row)});
  return {root,confirm:true,ready:()=>sels.every(s=>s.value!==''),
    getRes:()=>({ok:sels.every((s,i)=>s.value===q.pairs[i][1]),user:q.pairs.map((p,i)=>p[0]+' → '+sels[i].value).join('; '),why:q.pairs.map((p,i)=>sels[i].value!==p[1]?p[0]+' hoort bij "'+p[1]+'", niet bij "'+sels[i].value+'".':null).filter(Boolean)}),
    reveal(){sels.forEach((s,i)=>{s.disabled=true;const good=s.value===q.pairs[i][1];s.classList.add(good?'good':'bad');if(!good){const f=h('div','fix','Juist: '+esc(q.pairs[i][1]));s.parentNode.appendChild(f)}})},
    key(){},focus(){}};
}
function makeWidget(q,ctx){return q.type==='fill'?wFill(q,ctx):q.type==='match'?wMatch(q,ctx):q.type==='multi'?wMulti(q,ctx):wChoice(q,ctx)}

/* ---- sessie ---- */
let S=null,CUR=null;
function startLearn(ids,label){
  const rank=id=>{const p=P[id]||{};return p.mastered?3:(p.wrong>0?0:(p.streak>0?1:2))};
  let pool=shuffle(ids);
  const open=pool.filter(id=>!(P[id]&&P[id].mastered));
  let pick;
  if(open.length){pick=open.sort((a,b)=>rank(a)-rank(b)).slice(0,ROUND)}
  else pick=pool.slice(0,ROUND);
  const items=shuffle(pick).map(id=>{const p=P[id]||{};return {id,need:p.mastered?1:Math.max(1,2-(p.streak||0))}});
  S={mode:'learn',label,scope:ids,queue:items,total:items.length,done:0,first:{},log:[]};
  showQ();
}
function startExam(ids,n,label){
  const pick=shuffle(ids).slice(0,n);
  S={mode:'exam',label,scope:ids,queue:pick.map(id=>({id,need:1})),total:pick.length,done:0,first:{},log:[]};
  showQ();
}
function showQ(){
  if(!S.queue.length){return finish()}
  const item=S.queue[0],q=QB[item.id];window.scrollTo(0,0);
  app.innerHTML='';
  const exam=S.mode==='exam';
  const top=h('div','topbar');
  const stop=h('button','btn small','Stoppen');stop.type='button';stop.onclick=()=>{S.mode==='exam'&&S.log.length?finish(true):home()};
  const bar=h('div','bar','<i style="width:'+Math.round(S.done/S.total*100)+'%"></i>');
  const n=h('div','n',(exam?(S.done+1)+' / '+S.total:S.done+' / '+S.total+' klaar'));
  top.append(stop,bar,n);
  const card=h('div','panel qcard');
  const meta=h('div','meta','<span class="chip a">'+esc(TB[q.t].title)+'</span><span class="chip">'+TYPE[q.type]+'</span>'+(exam?'<span class="chip">Toets</span>':''));
  const qt=h('h2','qtext',esc(q.q));
  const fbBox=h('div');
  const actions=h('div','actions-row');
  let locked=false;
  const ctx={exam,
    changed:()=>{if(conf)conf.disabled=!w.ready()},
    submit:res=>{if(locked)return;locked=true;handle(res)},
    confirmNow:()=>{if(conf&&!conf.disabled)conf.click()}};
  const w=makeWidget(q,ctx);
  let conf=null;
  if(w.confirm){conf=h('button','btn primary',exam?'Bevestig':'Controleer');conf.type='button';conf.disabled=true;
    conf.onclick=()=>{if(locked||!w.ready())return;locked=true;handle(w.getRes())};actions.appendChild(conf)}
  card.append(meta,qt,w.root,fbBox,actions);
  app.append(top,card);
  CUR={w,q,item};
  if(w.focus)w.focus();
  function handle(res){
    if(conf)conf.disabled=true;
    const p=P[item.id]||(P[item.id]={streak:0,mastered:false,wrong:0,seen:0});
    p.seen++;if(S.first[item.id]===undefined)S.first[item.id]=res.ok;
    S.log.push({id:item.id,ok:res.ok,user:res.user,why:res.why||[]});
    if(res.ok){p.streak++;if(p.streak>=2)p.mastered=true;item.need--}
    else{p.streak=0;p.mastered=false;p.wrong++;item.need=2}
    save();
    if(exam){S.queue.shift();S.done++;showQ();return}
    w.reveal(res);
    const fb=h('div','fb '+(res.ok?'good':'bad'));
    fb.innerHTML='<div class="h">'+(res.ok?'Juist.':'Niet juist.')+'</div>'+
      (res.ok&&!res.note?'':'<div class="ans"><b>Juiste antwoord:</b> '+correctHTML(q)+'</div>')+
      (!res.ok&&res.why&&res.why.length?'<div class="why"><b>Waarom je fout zat:</b><ul>'+res.why.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul></div>':'')+
      (res.note?'<div>'+esc(res.note)+'</div>':'')+
      '<div class="ex">'+(res.ok?'':'<b>Uitleg:</b> ')+esc(q.ex)+'</div>'+
      (res.ok&&item.need>0?'<div class="muted">Nog één keer goed (later in deze ronde) om deze vraag te beheersen.</div>':'')+
      (!res.ok?'<div class="muted">Deze vraag komt zo terug.</div>':'')+
      (res.ok&&item.need<=0?'<div class="muted">Beheerst.</div>':'');
    fbBox.appendChild(fb);
    const nx=h('button','btn primary','Volgende');nx.type='button';
    nx.onclick=()=>{S.queue.shift();
      if(res.ok&&item.need<=0)S.done++;
      else{const pos=Math.min(S.queue.length,res.ok?4+Math.floor(Math.random()*3):2+Math.floor(Math.random()*2));S.queue.splice(pos,0,item)}
      showQ()};
    actions.appendChild(nx);nx.focus();
  }
}
document.addEventListener('keydown',e=>{
  if(!S||!CUR||e.ctrlKey||e.metaKey||e.altKey)return;
  const t=e.target;if(t&&(t.tagName==='INPUT'||t.tagName==='SELECT'))return;
  if(/^[1-9]$/.test(e.key)&&CUR.w.key)CUR.w.key(+e.key);
});

function finish(early){
  CUR=null;window.scrollTo(0,0);app.innerHTML='';
  const exam=S.mode==='exam';
  const all=idsOf();const st=stat(all);
  if(exam){
    const log=S.log;const ok=log.filter(l=>l.ok).length,n=log.length;
    const pct=n?Math.round(ok/n*100):0;
    const head=h('div','panel hero');
    head.innerHTML='<div class="eyebrow">Toetsresultaat</div><div class="score"><div class="big">'+ok+' <small>/ '+n+'</small></div><div class="big">'+pct+'<small>%</small></div><div class="big">'+(n?(ok/n*20).toFixed(1).replace('.',','):'0')+'<small> / 20</small></div></div><p>'+(pct>=90?'Sterk. Zorg dat de fouten hieronder de volgende keer wel zitten.':pct>=70?'Goed op weg. Oefen de gemiste vragen en doe de toets opnieuw.':'Er is nog werk. Oefen de gemiste vragen in de oefenmodus en bekijk de theorie van de onderwerpen waar je fouten maakte.')+'</p>';
    const acts=h('div','actions-row');
    const wrong=log.filter(l=>!l.ok).map(l=>l.id);
    if(wrong.length){const b=h('button','btn primary','Fouten oefenen ('+wrong.length+')');b.onclick=()=>startLearn(wrong,'Fouten uit toets');acts.appendChild(b)}
    const again=h('button','btn','Nieuwe toets');again.onclick=()=>startExam(S.scope,S.total,S.label);
    const bk=h('button','btn','Overzicht');bk.onclick=home;
    acts.append(again,bk);head.appendChild(acts);
    app.appendChild(head);
    app.appendChild(h('h3',null,'Antwoorden'));
    const rev=h('div','rev');
    log.slice().sort((a,b)=>a.ok-b.ok).forEach(l=>rev.appendChild(reviewItem(l)));
    app.appendChild(rev);
  }else{
    const total=S.total;const first=Object.values(S.first).filter(Boolean).length;
    const head=h('div','panel hero');
    head.innerHTML='<div class="eyebrow">Ronde klaar</div><div class="score"><div class="big">'+first+' <small>/ '+total+' meteen goed</small></div><div class="big">'+st.m+' <small>/ '+st.n+' beheerst</small></div></div><div class="bar"><i style="width:'+Math.round(st.m/st.n*100)+'%"></i></div>';
    const acts=h('div','actions-row');
    const nextOpen=S.scope.filter(id=>!(P[id]&&P[id].mastered)).length;
    const nb=h('button','btn primary',nextOpen?'Volgende ronde ('+nextOpen+' open)':'Alles hier beheerst. Herhaal');
    nb.onclick=()=>startLearn(S.scope,S.label);
    const bk=h('button','btn','Overzicht');bk.onclick=home;
    acts.append(nb,bk);head.appendChild(acts);app.appendChild(head);
    const missed=[...new Set(S.log.filter(l=>!l.ok).map(l=>l.id))];
    if(missed.length){
      app.appendChild(h('h3',null,'Hier ging het fout'));
      const rev=h('div','rev');
      missed.forEach(id=>rev.appendChild(reviewItem({id,ok:false,user:null})));
      app.appendChild(rev);
    }
  }
}
function reviewItem(l){
  const q=QB[l.id];const d=h('details','r '+(l.ok?'ok':'no'));
  if(!l.ok)d.open=true;
  d.innerHTML='<summary><span class="mark">'+(l.ok?'✓':'✗')+'</span><span>'+esc(q.q)+'</span></summary><div class="body">'+
    (l.user!==null&&!l.ok?'<div><b>Jouw antwoord:</b> '+esc(l.user)+'</div>':'')+
    '<div><b>Juist:</b> '+correctHTML(q)+'</div>'+(!l.ok&&l.why&&l.why.length?'<div class="why"><b>Waarom fout:</b><ul>'+l.why.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul></div>':'')+'<div class="muted">'+esc(q.ex)+'</div></div>';
  return d;
}

/* ---- schermen ---- */
function theory(tid){
  window.scrollTo(0,0);app.innerHTML='';CUR=null;
  const t=TB[tid];
  const top=h('div','topbar');const back=h('button','btn small','Overzicht');back.onclick=home;top.appendChild(back);
  const p=h('div','panel theory');
  p.innerHTML='<div class="eyebrow">'+esc(t.tag)+'</div><h2>'+esc(t.title)+'</h2><ul>'+t.sum.map(s=>'<li>'+s+'</li>').join('')+'</ul>';
  const acts=h('div','actions-row');
  const go=h('button','btn primary','Oefen dit onderwerp ('+cnt[tid]+' vragen)');go.onclick=()=>startLearn(idsOf(tid),t.title);
  acts.appendChild(go);p.appendChild(acts);
  app.append(top,p);
}
function home(){
  S=null;CUR=null;window.scrollTo(0,0);app.innerHTML='';
  const all=idsOf();const st=stat(all);const pct=Math.round(st.m/st.n*100);
  const back=h('a','back','← Alle vakken');back.href='../#biologie';app.appendChild(back);
  const hero=h('div','panel hero');
  hero.innerHTML='<div class="eyebrow">BIO5 · Thema 1 · Hoofdstuk 2</div><h1>Chemische samenstelling van het leven</h1><p>'+all.length+' vragen over alle slides, van elementen tot DNA. Een vraag telt als beheerst na twee keer na elkaar juist. Een fout zet hem terug op nul en hij komt in dezelfde ronde terug.</p>';
  app.appendChild(hero);

  const m=h('div','panel mastery');
  m.innerHTML='<div class="mastery-top"><div class="big">'+st.m+' <small>/ '+st.n+' beheerst</small></div><div class="muted">'+pct+'% van de leerstof</div></div><div class="bar"><i style="width:'+pct+'%"></i></div>';
  const acts=h('div','row');
  const a1=h('button','btn primary',st.m===st.n?'Alles herhalen':'Alles oefenen');a1.onclick=()=>startLearn(all,'Alle onderwerpen');
  const wk=weakIds();
  const a2=h('button','btn','Zwakke punten ('+wk.length+')');a2.disabled=!wk.length;a2.onclick=()=>startLearn(wk,'Zwakke punten');
  const a3=h('button','btn small','Voortgang wissen');let armed=false,tm;
  a3.onclick=()=>{if(!armed){armed=true;a3.textContent='Zeker weten? Klik nogmaals';tm=setTimeout(()=>{armed=false;a3.textContent='Voortgang wissen'},4000)}else{clearTimeout(tm);P={};save();home()}};
  acts.append(a1,a2,a3);m.appendChild(acts);app.appendChild(m);

  const ex=h('div','panel');
  ex.innerHTML='<h3>Toets</h3><p class="muted" style="margin:4px 0 14px">Zonder uitleg tijdens het maken. Resultaat en uitleg achteraf.</p>';
  const grid=h('div','exam');
  const f1=h('div','field','<label for="ex-scope">Onderwerp</label>');
  const s1=h('select');s1.id='ex-scope';s1.innerHTML='<option value="">Alles</option>'+TOPICS.map(t=>'<option value="'+t.id+'">'+esc(t.title)+'</option>').join('');f1.appendChild(s1);
  const f2=h('div','field','<label for="ex-n">Aantal vragen</label>');
  const s2=h('select');s2.id='ex-n';s2.innerHTML='<option value="10">10</option><option value="20" selected>20</option><option value="40">40</option><option value="999">Alle</option>';f2.appendChild(s2);
  const go=h('button','btn primary','Start toets');go.onclick=()=>{const ids=idsOf(s1.value);startExam(ids,Math.min(+s2.value,ids.length),s1.value?TB[s1.value].title:'Alle onderwerpen')};
  grid.append(f1,f2,go);ex.appendChild(grid);app.appendChild(ex);

  app.appendChild(h('h3',null,'Per onderwerp'));
  const tg=h('div','topics');
  TOPICS.forEach(t=>{
    const ids=idsOf(t.id);const s=stat(ids);
    const c=h('div','panel topic'+(s.m===s.n?' done':''));
    c.innerHTML='<div><div class="tag">'+esc(t.tag)+'</div><h3>'+esc(t.title)+'</h3></div><div><div class="count"><span>'+s.m+' / '+s.n+' beheerst</span><span>'+Math.round(s.m/s.n*100)+'%</span></div><div class="bar thin"><i style="width:'+Math.round(s.m/s.n*100)+'%"></i></div></div>';
    const ac=h('div','actions');
    const b1=h('button','btn small','Theorie');b1.onclick=()=>theory(t.id);
    const b2=h('button','btn small primary',s.m===s.n?'Herhalen':'Oefenen');b2.onclick=()=>startLearn(ids,t.title);
    ac.append(b1,b2);c.appendChild(ac);tg.appendChild(c);
  });
  app.appendChild(tg);
}
home();
</script>

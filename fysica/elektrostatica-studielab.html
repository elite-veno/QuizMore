<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Elektrostatica Studielab · QuizMore</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap">
<style>
/* Studiegids: vaste zijbalk met de lessenreeks, rechts het werkblad met uitleg, simulatie en controlevragen.
   Ladingen houden de kleuren van het handboek: rood = positief, blauw = negatief. Groen = resultante. */
:root{
  --bg:#F1F4F9; --surface:#FFFFFF; --sunk:#E7ECF4; --ink:#12203A; --ink2:#4B5A78; --line:#D3DBE8;
  --accent:#5B34B8; --accent-ink:#FFFFFF; --accent-soft:#ECE6FA;
  --pos:#D63A2A; --neg:#2459D6; --res:#0C8A5C; --warn:#9A5B00; --bad:#C0283C; --good:#0C8A5C;
  --pos-soft:#FBE4E0; --neg-soft:#E0E9FB; --res-soft:#DDF3EA; --warn-soft:#FBEFD6; --bad-soft:#FBE1E5;
  --shadow:0 1px 2px rgba(18,32,58,.06),0 8px 24px rgba(18,32,58,.06);
  --font:'Schibsted Grotesk',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D1322; --surface:#151D33; --sunk:#1B2540; --ink:#E7ECF8; --ink2:#9DAAC8; --line:#2A3558;
  --accent:#B39DFF; --accent-ink:#140B33; --accent-soft:#2A2250;
  --pos:#FF6B58; --neg:#6E9DFF; --res:#3DDC9F; --warn:#F0B35A; --bad:#FF7A8C; --good:#3DDC9F;
  --pos-soft:#3A1E24; --neg-soft:#1D2B52; --res-soft:#12362B; --warn-soft:#3A2D14; --bad-soft:#3F1C26;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1322; --surface:#151D33; --sunk:#1B2540; --ink:#E7ECF8; --ink2:#9DAAC8; --line:#2A3558;
  --accent:#B39DFF; --accent-ink:#140B33; --accent-soft:#2A2250;
  --pos:#FF6B58; --neg:#6E9DFF; --res:#3DDC9F; --warn:#F0B35A; --bad:#FF7A8C; --good:#3DDC9F;
  --pos-soft:#3A1E24; --neg-soft:#1D2B52; --res-soft:#12362B; --warn-soft:#3A2D14; --bad-soft:#3F1C26;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3); color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;font-family:var(--font);font-size:16px;line-height:1.6;background:var(--bg);color:var(--ink);-webkit-text-size-adjust:100%}
sup,sub{line-height:0}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}

.app{display:grid;grid-template-columns:288px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:env(safe-area-inset-top,0px);align-self:start;max-height:100vh;overflow-y:auto;
  background:var(--surface);border-right:1px solid var(--line);padding:20px 14px 28px;display:flex;flex-direction:column;gap:18px}
.brand{display:flex;flex-direction:column;gap:2px;padding:0 8px}
.brand b{font-size:1.15rem;font-weight:800;letter-spacing:-.01em}
.brand span{font-size:.8rem;color:var(--ink2)}
.prog{padding:0 8px}
.prog .bar{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.prog .bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .4s}
.prog small{display:block;margin-top:6px;color:var(--ink2);font-size:.78rem}
.navgroup{display:flex;flex-direction:column;gap:2px}
.navgroup h4{margin:0 8px 6px;font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--ink2);font-weight:700}
.navbtn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:9px;cursor:pointer;color:var(--ink);font-size:.93rem;line-height:1.3}
.navbtn:hover{background:var(--sunk)}
.navbtn[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:700}
.navbtn .no{font-family:var(--mono);font-size:.75rem;color:var(--ink2);min-width:2.1em}
.navbtn[aria-current="page"] .no{color:var(--accent)}
.navbtn .tick{margin-left:auto;width:16px;height:16px;border-radius:50%;border:2px solid var(--line);flex:none}
.navbtn.done .tick{background:var(--good);border-color:var(--good);position:relative}
.navbtn.done .tick::after{content:"";position:absolute;left:4px;top:1px;width:4px;height:8px;border:solid var(--surface);border-width:0 2px 2px 0;transform:rotate(45deg)}
.exgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;padding:0 8px}
.exgrid button{border:1.5px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 0;font-family:var(--mono);font-size:.82rem;cursor:pointer}
.exgrid button:hover{border-color:var(--accent)}
.exgrid button[aria-current="page"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:700}
.exgrid button.done{background:var(--good);border-color:var(--good);color:var(--surface)}

.top{display:none}
.scrim{display:none}
.main{min-width:0;padding-block:32px 72px;padding-inline:clamp(16px,4vw,48px)}
.page{max-width:900px;margin-inline:auto;display:flex;flex-direction:column;gap:28px}
.page > *{min-width:0}

h1{font-size:clamp(1.9rem,4.4vw,2.7rem);line-height:1.1;margin:0;font-weight:800;letter-spacing:-.025em;text-wrap:balance}
h2{font-size:1.4rem;line-height:1.25;margin:0;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
h3{font-size:1.05rem;margin:0;font-weight:700}
p{margin:0;max-width:68ch}
.kicker{font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--accent);margin-bottom:8px}
.lead{font-size:1.12rem;color:var(--ink2);max-width:62ch}
.sec{display:flex;flex-direction:column;gap:14px}
.pos{color:var(--pos);font-weight:700}.neg{color:var(--neg);font-weight:700}.res{color:var(--res);font-weight:700}
ul.clean{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px;max-width:68ch}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

.focus{background:var(--res-soft);border:1px solid color-mix(in srgb,var(--res) 35%,transparent);border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.focus>.tag,.note>.tag{align-self:flex-start;font-size:.7rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;background:var(--res);color:var(--surface);padding:2px 9px;border-radius:99px}
.note{background:var(--accent-soft);border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.note>.tag{background:var(--accent);color:var(--accent-ink)}
.warnbox{background:var(--warn-soft);border-radius:12px;padding:14px 18px;color:var(--ink);display:flex;flex-direction:column;gap:6px}
.warnbox>.tag{align-self:flex-start;font-size:.7rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;background:var(--warn);color:var(--surface);padding:2px 9px;border-radius:99px}

.formula{font-family:var(--mono);font-size:1.05rem;text-align:center;line-height:2.1;padding:6px 0;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;text-align:center;line-height:1.25}
.frac>span:first-child{padding:0 .3em .1em;border-bottom:1.5px solid currentColor}
.frac>span:last-child{padding:.1em .3em 0}
.legend{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:.92rem;align-items:baseline}
.legend dt{font-family:var(--mono);font-weight:600}.legend dd{margin:0;color:var(--ink2)}

.sim{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.sim>header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.sim>header b{font-size:.95rem}
.sim>header span{font-size:.82rem;color:var(--ink2)}
.stage{position:relative;width:100%;background:var(--sunk)}
.stage canvas{display:block;touch-action:none;max-width:100%}
.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px 22px;padding:14px 16px;border-top:1px solid var(--line)}
.ctl{display:flex;flex-direction:column;gap:4px;min-width:0}
.ctl label,.ctl .lab{font-size:.82rem;font-weight:600;color:var(--ink2);display:flex;justify-content:space-between;gap:8px}
.ctl output{font-family:var(--mono);color:var(--ink);font-weight:600}
input[type=range]{width:100%;accent-color:var(--accent);height:28px;margin:0}
.btnrow{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:600;font-size:.9rem;min-height:40px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.btn.p{border-color:var(--pos);color:var(--pos)}.btn.p.on{background:var(--pos-soft)}
.btn.n{border-color:var(--neg);color:var(--neg)}.btn.n.on{background:var(--neg-soft)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
select,input[type=text]{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px;min-height:40px;width:100%;min-width:0}
.readout{padding:12px 16px;border-top:1px solid var(--line);font-size:.95rem}
.readout>div+div{margin-top:6px}
.readout .big{font-family:var(--mono);font-size:1.15rem;font-weight:600}
.badge{display:inline-block;padding:2px 10px;border-radius:99px;font-size:.8rem;font-weight:700}
.badge.pos{background:var(--pos-soft);color:var(--pos)}.badge.neg{background:var(--neg-soft);color:var(--neg)}.badge.res{background:var(--res-soft);color:var(--res)}
.badge.zero{background:var(--sunk);color:var(--ink2)}
.tablewrap{overflow-x:auto;max-width:100%}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
td.mono{white-space:nowrap}

.checks{display:flex;flex-direction:column;gap:18px;border-top:2px solid var(--ink);padding-top:16px}
.checks>h2{font-size:1.1rem}
.q{display:flex;flex-direction:column;gap:10px}
.q p.qt{font-weight:600}
.opts{display:flex;flex-direction:column;gap:8px;max-width:640px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;cursor:pointer;line-height:1.4}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt .k{font-family:var(--mono);font-size:.78rem;color:var(--ink2);padding-top:2px}
.opt.ok{border-color:var(--good);background:var(--res-soft)}
.opt.no{border-color:var(--bad);background:var(--bad-soft)}
.why{font-size:.93rem;padding:10px 14px;border-radius:10px;background:var(--sunk);max-width:640px}
.why b.ok{color:var(--good)}.why b.no{color:var(--bad)}
.pager{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:18px}

.tribo{display:grid;grid-template-columns:minmax(150px,200px) minmax(0,1fr);gap:18px;padding:16px}
.ladder{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.ladder .cap{font-size:.72rem;padding:6px 10px;color:var(--ink2);background:var(--sunk);text-align:center;font-weight:600}
.ladder button{border:0;border-top:1px solid var(--line);background:var(--surface);padding:6px 10px;text-align:left;cursor:pointer;font-size:.88rem;display:flex;justify-content:space-between;gap:8px}
.ladder button:hover{background:var(--sunk)}
.ladder button .ab{font-family:var(--mono);font-weight:700;color:var(--accent)}
.ladder button.selA,.ladder button.selB{background:var(--accent-soft);font-weight:700}
.rubarea{display:flex;flex-direction:column;gap:14px;min-width:0}
.blocks{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.blk{border:1.5px solid var(--line);border-radius:14px;padding:14px;min-height:120px;position:relative;background:var(--surface);display:flex;flex-direction:column;gap:8px}
.blk b{font-size:1rem}
.blk .sym{display:flex;flex-wrap:wrap;gap:4px;min-height:26px}
.sym i{font-style:normal;font-family:var(--mono);font-weight:800;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:.95rem;animation:pop .35s}
.sym i.p{background:var(--pos-soft);color:var(--pos)}.sym i.n{background:var(--neg-soft);color:var(--neg)}
@keyframes pop{from{transform:scale(.2);opacity:0}to{transform:scale(1);opacity:1}}

.exhead{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.lvl{font-size:.75rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:3px 10px;border-radius:99px;background:var(--sunk);color:var(--ink2)}
.lvl.m{background:var(--warn-soft);color:var(--warn)}.lvl.h{background:var(--bad-soft);color:var(--bad)}.lvl.b{background:var(--res-soft);color:var(--res)}
.problem{font-size:1.05rem;max-width:68ch;padding:16px 18px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.answers{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.ans{display:flex;flex-direction:column;gap:6px}
.ans .lab{font-size:.85rem;font-weight:600;color:var(--ink2)}
.ans .row{display:flex;gap:8px;align-items:center}
.ans .unit{font-family:var(--mono);color:var(--ink2);white-space:nowrap}
.ans .fb{font-size:.85rem;min-height:1.2em}
.ans.ok input,.ans.ok select{border-color:var(--good)}.ans.ok .fb{color:var(--good)}
.ans.no input,.ans.no select{border-color:var(--bad)}.ans.no .fb{color:var(--bad)}
.step{border-left:3px solid var(--accent);padding:4px 0 4px 16px;display:flex;flex-direction:column;gap:6px;animation:pop .3s}
.step h3{font-size:.98rem}
.step .calc{font-family:var(--mono);font-size:.92rem;background:var(--sunk);padding:8px 12px;border-radius:8px;overflow-x:auto;max-width:100%;font-variant-numeric:tabular-nums}
.step p{font-size:.95rem}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:8px;text-align:left;cursor:pointer;color:inherit}
.card:hover{border-color:var(--accent);box-shadow:var(--shadow)}
.card .n{font-family:var(--mono);font-size:.8rem;color:var(--ink2)}
.card b{font-size:1rem;line-height:1.3}
.card small{color:var(--ink2);font-size:.85rem}
.card.done{border-color:var(--good)}
.score{font-size:2.4rem;font-weight:800;font-family:var(--mono)}
.qprog{height:6px;border-radius:99px;background:var(--sunk);overflow:hidden}.qprog i{display:block;height:100%;background:var(--accent);transition:width .3s}

@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;z-index:30;left:0;top:0;bottom:0;width:min(86vw,320px);max-height:none;transform:translateX(-102%);transition:transform .25s;
    padding-top:calc(20px + env(safe-area-inset-top,0px));box-shadow:var(--shadow)}
  body.menu .side{transform:none}
  .scrim{display:none}
  body.menu .scrim{display:block;position:fixed;inset:0;background:rgba(10,15,30,.5);z-index:20}
  .top{display:flex;align-items:center;gap:12px;position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--surface);border-bottom:1px solid var(--line);padding:10px 16px}
  .top b{font-weight:800}
  .main{padding-block:22px 64px}
  .tribo{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.backlink{font-size:.85rem;font-weight:600;color:var(--accent);text-decoration:none;padding:0 8px}
.backlink:hover{text-decoration:underline}
.top .backlink{margin-left:auto;padding:0}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side" aria-label="Lessen">
    <a class="backlink" href="../#fysica">← Alle vakken</a>
    <div class="brand"><b>Elektrostatica Studielab</b><span>Hoofdstuk 1 Ladingen en hoofdstuk 2 Krachten</span></div>
    <div class="prog"><div class="bar"><i id="progbar"></i></div><small id="progtxt"></small></div>
    <nav id="nav" style="display:flex;flex-direction:column;gap:18px"></nav>
  </aside>
  <div class="scrim" id="scrim"></div>
  <div style="min-width:0">
    <div class="top"><button class="btn" id="menubtn" aria-label="Open menu">Menu</button><b id="topttl">Studielab</b><a class="backlink" href="../#fysica">← Vakken</a></div>
    <main class="main"><div class="page" id="view"></div></main>
  </div>
</div>
<script>
/* ===== Kern ===== */
const K = 8.99e9;
const E_CH = 1.6e-19;
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const view = () => $('#view');

/* getallen in Nederlandse notatie */
function dec(v) { return String(v).replace('.', ',').replace('-', '−'); }
function sci(x, sig = 3) {
  if (x === 0) return '0';
  let e = Math.floor(Math.log10(Math.abs(x)));
  let m = +(x / Math.pow(10, e)).toPrecision(sig);
  if (Math.abs(m) >= 10) { m = +(m / 10).toPrecision(sig); e += 1; }
  return dec(m) + '·10<sup>' + String(e).replace('-', '−') + '</sup>';
}
function fmt(x, sig = 3) {
  if (x === 0) return '0';
  const a = Math.abs(x);
  if (a < 1e-2 || a >= 1e5) return sci(x, sig);
  return dec(+x.toPrecision(sig));
}
function plain(x, sig = 3) { return fmt(x, sig).replace(/<[^>]+>/g, ''); }
function deg(x, d = 1) { return dec((+x).toFixed(d)) + '°'; }
function sgn(x, sig = 2) { return (x > 0 ? '+' : '') + dec(+x.toPrecision(sig)); }
const SUB = ['₀', '₁', '₂', '₃', '₄', '₅', '₆', '₇', '₈', '₉'];
const sub = n => String(n).split('').map(c => SUB[+c]).join('');
function frac(n, d) { return '<span class="frac"><span>' + n + '</span><span>' + d + '</span></span>'; }
function parseNum(s) {
  if (s == null) return NaN;
  s = String(s).trim().replace(/\s+/g, '').replace(/−/g, '-').replace(',', '.');
  let m = s.match(/^(-?[\d.]+)(?:[*x·×]10\^?\(?(-?\d+)\)?)$/i);
  if (m) return parseFloat(m[1]) * Math.pow(10, parseInt(m[2], 10));
  m = s.match(/^(-?[\d.]+)e(-?\d+)$/i);
  if (m) return parseFloat(m[1]) * Math.pow(10, parseInt(m[2], 10));
  return /^-?[\d.]+$/.test(s) ? parseFloat(s) : NaN;
}

/* opslag (veilig) */
const store = {
  mem: {},
  get(k) { try { const v = localStorage.getItem('estat-' + k); return v ? JSON.parse(v) : (this.mem[k] || null); } catch (e) { return this.mem[k] || null; } },
  set(k, v) { this.mem[k] = v; try { localStorage.setItem('estat-' + k, JSON.stringify(v)); } catch (e) { } }
};
let progress = store.get('progress') || {};
function markDone(id) {
  if (progress[id]) return;
  progress[id] = 1; store.set('progress', progress); updateNav();
}

/* thema-kleuren voor canvas */
const redraws = new Set();
function colors() {
  const s = getComputedStyle(document.documentElement);
  const g = n => s.getPropertyValue(n).trim();
  return { pos: g('--pos'), neg: g('--neg'), res: g('--res'), ink: g('--ink'), ink2: g('--ink2'), line: g('--line'), sunk: g('--sunk'),
    surface: g('--surface'), accent: g('--accent'), warn: g('--warn'), bad: g('--bad'), posSoft: g('--pos-soft'), negSoft: g('--neg-soft'), font: g('--font'), mono: g('--mono') };
}
try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => redraws.forEach(f => f())); } catch (e) { }
new MutationObserver(() => redraws.forEach(f => f())).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

let cleanups = [];
const onCleanup = fn => cleanups.push(fn);
function runCleanups() { cleanups.forEach(f => { try { f(); } catch (e) { } }); cleanups = []; }

function setupCanvas(wrap, o) {
  const cv = document.createElement('canvas');
  wrap.appendChild(cv);
  const api = { cv, w: 0, h: 0, dpr: 1, ctx: cv.getContext('2d') };
  function redraw() {
    const c = api.ctx;
    c.setTransform(api.dpr, 0, 0, api.dpr, 0, 0);
    c.clearRect(0, 0, api.w, api.h);
    o.draw(c, api.w, api.h, colors(), api);
  }
  function resize() {
    const w = Math.max(200, wrap.clientWidth);
    const h = Math.max(o.minH || 200, Math.round(w * (o.aspect || .5)));
    api.dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.round(w * api.dpr); cv.height = Math.round(h * api.dpr);
    cv.style.width = w + 'px'; cv.style.height = h + 'px';
    api.w = w; api.h = h; redraw();
  }
  api.redraw = redraw;
  const ro = new ResizeObserver(() => { if (Math.abs(wrap.clientWidth - api.w) > 1) resize(); });
  ro.observe(wrap);
  redraws.add(redraw);
  onCleanup(() => { ro.disconnect(); redraws.delete(redraw); });
  resize();
  return api;
}
function pointer(cv, e) {
  const r = cv.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}
function animate(fn) {
  let id = 0, last = performance.now(), on = true;
  const loop = t => { if (!on) return; const dt = Math.min(.05, (t - last) / 1000); last = t; fn(dt, t / 1000); id = requestAnimationFrame(loop); };
  id = requestAnimationFrame(loop);
  onCleanup(() => { on = false; cancelAnimationFrame(id); });
}

/* tekenhulp */
function arrow(c, x0, y0, x1, y1, col, lw = 3, head = 10) {
  const dx = x1 - x0, dy = y1 - y0, L = Math.hypot(dx, dy);
  if (L < 2) return;
  const ux = dx / L, uy = dy / L, hh = Math.min(head, L * .6);
  c.strokeStyle = col; c.fillStyle = col; c.lineWidth = lw; c.lineCap = 'round';
  c.beginPath(); c.moveTo(x0, y0); c.lineTo(x1 - ux * hh * .7, y1 - uy * hh * .7); c.stroke();
  c.beginPath(); c.moveTo(x1, y1);
  c.lineTo(x1 - ux * hh + uy * hh * .5, y1 - uy * hh - ux * hh * .5);
  c.lineTo(x1 - ux * hh - uy * hh * .5, y1 - uy * hh + ux * hh * .5);
  c.closePath(); c.fill();
}
function charge(c, x, y, r, q, C, label) {
  const col = q > 0 ? C.pos : q < 0 ? C.neg : C.ink2;
  c.beginPath(); c.arc(x, y, r, 0, 7); c.fillStyle = col; c.fill();
  c.strokeStyle = C.surface; c.lineWidth = 2; c.stroke();
  c.fillStyle = '#fff'; c.font = '800 ' + Math.round(r * 1.2) + 'px ' + C.mono; c.textAlign = 'center'; c.textBaseline = 'middle';
  c.fillText(q > 0 ? '+' : q < 0 ? '−' : '0', x, y + 1);
  if (label) { c.fillStyle = C.ink; c.font = '600 13px ' + C.font; c.fillText(label, x, y - r - 11); }
}
function txt(c, s, x, y, col, size = 13, align = 'center', weight = 600, mono = false) {
  c.fillStyle = col; c.font = weight + ' ' + size + 'px ' + (mono ? colors().mono : colors().font);
  c.textAlign = align; c.textBaseline = 'middle'; c.fillText(s, x, y);
}

/* controlevragen */
function checksHTML(id, list, title = 'Controleer jezelf') {
  return '<section class="checks" data-checks="' + id + '"><h2>' + title + '</h2>' + list.map((q, i) =>
    '<div class="q" data-i="' + i + '"><p class="qt">' + q.q + '</p><div class="opts">' + q.o.map((o, j) =>
      '<button class="opt" data-j="' + j + '"><span class="k">' + 'ABCD'[j] + '</span><span>' + o + '</span></button>').join('') +
    '</div><div class="why" hidden></div></div>').join('') + '</section>';
}
function bindChecks(root, id, list) {
  const sec = $('[data-checks="' + id + '"]', root);
  if (!sec) return;
  const ok = new Set();
  $$('.q', sec).forEach(qe => {
    const i = +qe.dataset.i, q = list[i], why = $('.why', qe);
    $$('.opt', qe).forEach(b => b.addEventListener('click', () => {
      if (qe.classList.contains('solved')) return;

  });
}

function exPage(ex) {
  return { id: 'ex' + ex.id, group: 'ex', no: String(ex.id), title: ex.title, render(root) {
    let p = JSON.parse(JSON.stringify(ex.def)), M, lab, shown = 0, solved = false;
    const lv = { b: ['Basis', 'b'], m: ['Middel', 'm'], h: ['Moeilijk', 'h'] }[ex.lvl];
    function build() {
      M = ex.make(p); window.__lastM = M; shown = 0; solved = false;
      root.innerHTML = head('Oefening ' + ex.id + ' van 12', ex.title, null) + '<div class="exhead"><span class="lvl ' + lv[1] + '">' + lv[0] + '</span><button class="btn" id="newn">Nieuwe getallen</button><button class="btn" id="orig">Getallen uit de opgave</button></div>' +
        '<div class="problem">' + M.text + '</div><div id="fig"></div>' +
        '<section class="sec"><h2>Jouw antwoord</h2><div class="answers" id="ans"></div><div class="btnrow"><button class="btn primary" id="chk">Controleer</button><button class="btn" id="hint">Hint</button><button class="btn" id="nxt">Volgende stap</button><button class="btn" id="all">Toon volledige oplossing</button></div><div id="hnt" class="mono" style="color:var(--ink2);font-size:.9rem"></div><div id="res" style="font-weight:700"></div></section>' +
        '<section class="sec" id="stp"></section>';
      $('#ans').innerHTML = M.answers.map(a => '<div class="ans" data-id="' + a.id + '"><span class="lab">' + a.label + '</span><div class="row">' + (a.kind === 'num' ? '<input type="text" inputmode="decimal" id="in-' + a.id + '" placeholder="getal" autocomplete="off"><span class="unit">' + a.unit + '</span>' : '<select id="in-' + a.id + '"><option value="">kies...</option>' + a.options.map((o, i) => '<option value="' + i + '">' + o + '</option>').join('') + '</select>') + '</div><div class="fb"></div></div>').join('');
      const chs = M.ch.map(c => ({ ...c }));
      if (M.dl === 1) chs[2].hidden = true;
      lab = ForceLab($('#fig'), { title: M.title || 'Figuur', hint: 'Afstanden in cm. Ladingen in µC.', charges: chs, target: M.target, editable: false, fixedTarget: true, hideReadout: true, noControls: true, showVectors: false,
        distLabel: M.hideDist ? () => 'r = ?' : M.dl === 'x' ? (i, j) => (i === 1 && j === 2) ? 'x = ?' : null : null });
      $('#newn').onclick = () => { p = ex.gen(); build(); }; $('#orig').onclick = () => { p = JSON.parse(JSON.stringify(ex.def)); build(); };
      $('#chk').onclick = check; $('#nxt').onclick = next; $('#all').onclick = () => { while (shown < M.steps.length) next(true); reveal(); };
      $('#hint').onclick = () => { $('#hnt').textContent = shown < M.steps.length ? 'Hint: volgende stap is “' + M.steps[shown].t + '”.' : 'Alle stappen zijn getoond.'; };
    }
    function next(quiet) { if (shown >= M.steps.length) return; const s = M.steps[shown]; $('#stp').insertAdjacentHTML('beforeend', '<div class="step"><h3>Stap ' + (shown + 1) + ': ' + s.t + '</h3>' + s.body + '</div>'); shown++; $('#hnt').textContent = ''; }
    function reveal() {
      if (M.after) { lab.setCharges(M.after); lab.setTitle('Na het contact'); }
      if (M.dl === 1) { const c = lab.charges.map(x => ({ ...x })); c[2].hidden = false; lab.setCharges(c); lab.setDistLabel(null); lab.setTarget(M.target); }
      lab.setDistLabel(null); lab.setComps(!!M.comps); lab.setVectors(true);
      const ans = M.answers.map(a => a.kind === 'num' ? a.label + ': <b>' + fmt(a.val) + ' ' + a.unit + '</b>' : a.label + ': <b>' + a.options[a.correct] + '</b>').join('<br>');
      if (!$('#sol')) $('#stp').insertAdjacentHTML('beforeend', '<div class="focus" id="sol"><span class="tag">Antwoord</span><p>' + ans + '</p></div>');
    }
    function check() {
      let all = true;
      M.answers.forEach(a => {
        const el = $('.ans[data-id="' + a.id + '"]'), inp = $('#in-' + a.id), fb = $('.fb', el); let ok;
        if (a.kind === 'num') {
          const v = parseNum(inp.value); if (isNaN(v)) { ok = false; fb.textContent = 'Vul een getal in.'; el.className = 'ans no'; all = false; return; }
          const cands = [a.val, ...(a.accept || [])]; ok = cands.some(c => a.tolAbs != null ? Math.abs(v - c) <= a.tolAbs : Math.abs(v - c) <= Math.abs(c) * (a.tolRel || .03));
          fb.textContent = ok ? 'Juist.' : (Math.abs(Math.log10(Math.abs(v / a.val) || 1)) > .9 ? 'Grootteorde klopt niet: controleer je eenheden (µC, cm).' : (Math.sign(v) !== Math.sign(a.val) ? 'Controleer het teken.' : 'Nog niet juist. Controleer je tussenstappen.'));
        } else { ok = inp.value !== '' && +inp.value === a.correct; fb.textContent = ok ? 'Juist.' : (inp.value === '' ? 'Kies een antwoord.' : 'Nog niet juist.'); }
        el.className = 'ans ' + (ok ? 'ok' : 'no'); if (!ok) all = false;
      });
      $('#res').innerHTML = all ? '<span style="color:var(--good)">Alles juist. Goed gedaan.</span>' : '<span style="color:var(--bad)">Nog niet helemaal. Gebruik een hint of de volgende stap.</span>';
      if (all) { if (!solved) { solved = true; markDone('ex' + ex.id); } while (shown < M.steps.length) next(true); reveal(); }
    }
    build();
  } };
}

 ['Q₂ staat tussen Q₁ en Q₃. Hoe bereken je de kracht van Q₁ op Q₃?', ['Met de afstand Q₁Q₃, Q₂ schermt niets af', 'Met de afstand Q₁Q₂', 'Die kracht is 0'], 0, 'Elke lading oefent haar eigen kracht uit, zonder afscherming.']
];
addPage({ id: 'quiz', group: 'ex', no: '', title: 'Theorietoets', render(root) {
  let order, i, score, wrong, mode = 'all';
  const start = (m, from) => { mode = m; order = (from || QUIZ.map((_, k) => k)).slice().sort(() => Math.random() - .5); if (!from) order = order.slice(0, 12); i = 0; score = 0; wrong = []; show(); };
  function show() {
    if (i >= order.length) {
      root.innerHTML = head('Theorietoets', 'Resultaat', null) + '<div class="problem"><div class="score">' + score + ' / ' + order.length + '</div><p>' + (score === order.length ? 'Perfect. Je beheerst de theorie.' : score >= order.length * .75 ? 'Sterk. Bekijk de fouten nog even.' : 'Herhaal de lessen waar je fouten maakte en probeer opnieuw.') + '</p></div><div class="btnrow"><button class="btn primary" id="again">Nieuwe toets (12 vragen)</button>' + (wrong.length ? '<button class="btn" id="redo">Alleen de foute vragen herhalen</button>' : '') + '</div>';
      if (score === order.length && mode === 'all') markDone('quiz');
      $('#again').onclick = () => start('all'); if ($('#redo')) $('#redo').onclick = () => start('wrong', wrong); return;
    }
    const q = QUIZ[order[i]];
    root.innerHTML = head('Theorietoets · vraag ' + (i + 1) + ' van ' + order.length, 'Test je kennis', null) + '<div class="qprog"><i style="width:' + (i / order.length * 100) + '%"></i></div><div class="q"><p class="qt" style="font-size:1.1rem">' + q[0] + '</p><div class="opts">' + q[1].map((o, j) => '<button class="opt" data-j="' + j + '"><span class="k">' + 'ABC'[j] + '</span><span>' + o + '</span></button>').join('') + '</div><div class="why" hidden></div><div class="btnrow"><button class="btn primary" id="nq" hidden>Volgende</button></div></div>';
    $$('.opt', root).forEach(b => b.onclick = () => {
      const j = +b.dataset.j; $$('.opt', root).forEach(x => x.disabled = true);
      $$('.opt', root)[q[2]].classList.add('ok'); if (j === q[2]) score++; else { b.classList.add('no'); wrong.push(order[i]); }
      const w = $('.why', root); w.hidden = false; w.innerHTML = '<b class="' + (j === q[2] ? 'ok">Juist.' : 'no">Niet juist.') + '</b> ' + q[3]; $('#nq').hidden = false;
    });
    $('#nq').onclick = () => { i++; show(); };
  }
  root.innerHTML = head('Toets jezelf', 'Theorietoets', 'Willekeurige vragen uit beide hoofdstukken. Haal alle 12 juist om het vinkje te krijgen.') + '<div class="btnrow"><button class="btn primary" id="go">Start (12 vragen)</button><button class="btn" id="goall">Alle ' + QUIZ.length + ' vragen</button></div>';
  $('#go').onclick = () => start('all'); $('#goall').onclick = () => { mode = 'full'; order = QUIZ.map((_, k) => k).sort(() => Math.random() - .5); i = 0; score = 0; wrong = []; show(); };
} });

addPage({ id: 'cheat', group: 'x', no: '', title: 'Spiekbrief', render(root) {
  root.innerHTML = head('Samenvatting', 'Spiekbrief', 'Alles wat je moet kennen op één pagina.') + `
  <section class="sec"><h2>Hoofdstuk 1: Ladingen</h2><div class="tablewrap"><table><tbody>
    <tr><td><b>Lading</b></td><td>Neutraal: p = e. Negatief: meer elektronen. Positief: minder elektronen. e = 1,6·10<sup>−19</sup> C. Q = N·e. Alleen elektronen verhuizen.</td></tr>
    <tr><td><b>Krachten</b></td><td>Gelijk stoot af, ongelijk trekt aan.</td></tr>
    <tr><td><b>Geleider / isolator</b></td><td>Geleider: vrije elektronen, lading verspreidt zich. Isolator: geen vrije elektronen, lading blijft. Halfgeleider: beperkte geleiding.</td></tr>
    <tr><td><b>Aarding</b></td><td>Negatief: elektronen voorwerp → aarde. Positief: aarde → voorwerp. Isolator: geen stroom.</td></tr>
    <tr><td><b>Wrijving</b></td><td>Tribo-reeks: hoger geeft elektronen af (+), lager neemt op (−). Alleen bij isolatoren.</td></tr>
    <tr><td><b>Elektroscoop</b></td><td>Contact: zelfde teken als de staaf. Ontladen: aarding. Bladen wijken uit bij gelijke lading.</td></tr>
    <tr><td><b>Influentie</b></td><td>Staaf nabij, aarden, aarding weg, staaf weg: tegengesteld teken. Eerst aarding weg, dan staaf.</td></tr>
    <tr><td><b>Polarisatie</b></td><td>Isolator: elektronenwolken vervormen, dipolen, netto aantrekking.</td></tr></tbody></table></div></section>
  <section class="sec"><h2>Hoofdstuk 2: Wet van Coulomb</h2>
    <div class="focus"><div class="formula">F<sub>c</sub> = k · ${frac('|Q<sub>1</sub>| · |Q<sub>2</sub>|', 'r<sup>2</sup>')} &nbsp; k = 8,99·10<sup>9</sup> N·m²/C²</div></div>
    <ul class="clean"><li>µC = 10<sup>−6</sup> C, nC = 10<sup>−9</sup> C, cm = 10<sup>−2</sup> m, mm = 10<sup>−3</sup> m.</li>
    <li>r ×2 → F ÷4. Q ×2 → F ×2. Water: F is 80 keer kleiner.</li>
    <li>F₁₂ = F₂₁ in grootte (derde wet van Newton). Fᵢⱼ = kracht van Qᵢ op Qⱼ.</li>
    <li><b>Op een rechte:</b> kies een positieve zin, bereken elke kracht apart, tel op met tekens.</li>
    <li><b>In een vlak:</b> ontbind Fₓ = F·cos α en Fᵧ = F·sin α, tel componenten op, F = √(Fₓ² + Fᵧ²), tan α = |Fᵧ|/|Fₓ|.</li>
    <li><b>Niet loodrecht:</b> F² = F₁² + F₂² + 2F₁F₂ cos φ, met φ de hoek tussen de krachtvectoren.</li>
    <li><b>Nulpunt:</b> zelfde teken: tussen, bij de kleinste. Tegengesteld: buiten, bij de kleinste. Gelijke groottes opstellen: √|Q₁|/d₁ = √|Q₂|/d₂.</li>
    <li><b>Bollen in contact (identiek, geleidend):</b> elk (Q₁ + Q₂)/2.</li></ul></section>`;
} });

addPage({ id: 'home', group: 'x', no: '', title: 'Start', render(root) {
  const lessons = PAGES.filter(p => p.group === 'h1' || p.group === 'h2');
  root.innerHTML = head('Elektrostatica', 'Alles over ladingen en krachten, om te snappen en te oefenen', 'Twee hoofdstukken uit je cursus als interactieve lessen. Elke les heeft een korte uitleg, een simulatie om mee te spelen en controlevragen. Daarna kun je 12 oefeningen maken, met stap-voor-stap uitwerking en nieuwe getallen zo vaak je wilt.') + `
  <section class="sec"><h2>Aanpak</h2>
    <div class="step"><h3>Lees de uitleg, speel met de simulatie</h3><p>Verander dingen en kijk wat er gebeurt. Zo onthoud je het beter dan door te lezen.</p></div>
    <div class="step"><h3>Beantwoord de controlevragen</h3><p>Een les krijgt een vinkje als je alle vragen juist hebt.</p></div>
    <div class="step"><h3>Maak de oefeningen</h3><p>Probeer eerst zelf. Gebruik daarna hint, stap voor stap of de volledige oplossing. Klik op “Nieuwe getallen” om te blijven oefenen.</p></div></section>
  <section class="sec"><h2>Lessen</h2><div class="cards" id="hc"></div></section>
  <section class="sec"><h2>Oefenen en herhalen</h2><div class="cards" id="hx"></div></section>
  <div class="warnbox"><span class="tag">Twee afwijkingen in je materiaal</span><p><b>1.</b> Op dia 3 van hoofdstuk 2 staat 3,6·10<sup>−3</sup> N, maar met r = 5,0 mm is het juiste antwoord 3,6·10<sup>3</sup> N.<br><b>2.</b> In oefening 8 van de extra oefeningen is er geen oplossing: beide krachten op Q₂ wijzen naar rechts. Waarschijnlijk moet Q₃ positief zijn. Vraag het aan je leerkracht.</p></div>`;
  $('#hc').innerHTML = lessons.map(l => '<button class="card' + (progress[l.id] ? ' done' : '') + '" data-go="' + l.id + '"><span class="n">' + l.no + '</span><b>' + l.title + '</b></button>').join('');
  $('#hx').innerHTML = '<button class="card' + (EX.every(e => progress['ex' + e.id]) ? ' done' : '') + '" data-go="ex1"><span class="n">12 oefeningen</span><b>Extra oefeningen Wet van Coulomb</b><small>' + EX.filter(e => progress['ex' + e.id]).length + ' van 12 gemaakt</small></button><button class="card' + (progress.quiz ? ' done' : '') + '" data-go="quiz"><span class="n">' + QUIZ.length + ' vragen</span><b>Theorietoets</b></button><button class="card" data-go="cheat"><span class="n">1 pagina</span><b>Spiekbrief</b></button>';
} });

/* ----- navigatie ----- */
const ORDER = () => ['home', ...PAGES.filter(p => p.group === 'h1').map(p => p.id), ...PAGES.filter(p => p.group === 'h2').map(p => p.id), ...EX.map(e => 'ex' + e.id), 'quiz', 'cheat'];
let cur = 'home';
function buildNav() {
  const btn = p => '<button class="navbtn" data-go="' + p.id + '" data-id="' + p.id + '"><span class="no">' + (p.no || '') + '</span><span>' + p.title + '</span><span class="tick"></span></button>';
  $('#nav').innerHTML =
    '<div class="navgroup"><button class="navbtn" data-go="home" data-id="home"><span class="no"></span><span>Start</span></button></div>' +
    '<div class="navgroup"><h4>Hoofdstuk 1 · Ladingen</h4>' + PAGES.filter(p => p.group === 'h1').map(btn).join('') + '</div>' +
    '<div class="navgroup"><h4>Hoofdstuk 2 · Krachten</h4>' + PAGES.filter(p => p.group === 'h2').map(btn).join('') + '</div>' +
    '<div class="navgroup"><h4>Oefeningen</h4><div class="exgrid">' + EX.map(e => '<button data-go="ex' + e.id + '" data-id="ex' + e.id + '" title="' + e.title + '">' + e.id + '</button>').join('') + '</div><button class="navbtn" data-go="quiz" data-id="quiz" style="margin-top:6px"><span class="no"></span><span>Theorietoets</span><span class="tick"></span></button></div>' +
    '<div class="navgroup"><button class="navbtn" data-go="cheat" data-id="cheat"><span class="no"></span><span>Spiekbrief</span></button></div>';
}
function updateNav() {
  $$('#nav [data-id]').forEach(b => { const id = b.dataset.id; b.classList.toggle('done', !!progress[id]); if (id === cur) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
  const tot = PAGES.filter(p => p.group === 'h1' || p.group === 'h2').length + EX.length + 1, d = Object.keys(progress).length;
  $('#progbar').style.width = Math.min(100, d / tot * 100) + '%'; $('#progtxt').textContent = d + ' van ' + tot + ' onderdelen afgerond';
}
function go(id, noHash) {
  const page = PAGES.find(p => p.id === id) || PAGES.find(p => p.id === 'home');
  runCleanups(); cur = page.id;
  const root = view(); root.innerHTML = ''; root.scrollTop = 0;
  try { page.render(root); } catch (e) { root.innerHTML = '<div class="warnbox"><span class="tag">Fout</span><p>Deze pagina kon niet laden: ' + String(e && e.message) + '</p></div>'; console.error(e); }
  const o = ORDER(), k = o.indexOf(cur), titleOf = i => { const q = PAGES.find(p => p.id === i); return (q.no ? q.no + ' ' : '') + q.title; };
  if (cur !== 'home') root.insertAdjacentHTML('beforeend', '<div class="pager"><span>' + (k > 0 ? '<button class="btn" data-go="' + o[k - 1] + '">← ' + titleOf(o[k - 1]) + '</button>' : '') + '</span><span>' + (k < o.length - 1 ? '<button class="btn primary" data-go="' + o[k + 1] + '">' + titleOf(o[k + 1]) + ' →</button>' : '') + '</span></div>');
  $('#topttl').textContent = (page.no ? page.no + ' ' : '') + page.title;
  document.body.classList.remove('menu'); updateNav();
  window.scrollTo(0, 0);
  if (!noHash) { try { history.replaceState(null, '', '#' + cur); } catch (e) { } }
}
document.addEventListener('click', e => { const b = e.target.closest('[data-go]'); if (b) go(b.dataset.go); });
$('#menubtn').onclick = () => document.body.classList.toggle('menu'); $('#scrim').onclick = () => document.body.classList.remove('menu');
buildNav();
const startId = (location.hash || '').replace('#', '');
go(PAGES.some(p => p.id === startId) ? startId : 'home', true);
</script>
</body>
</html>

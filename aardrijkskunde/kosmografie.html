mc('pb','Wat is de breedtegraad van een plaats?','Hoek tussen evenaarsvlak en de normaal ter plaatse',['Hoek tussen nulmeridiaan en plaatselijke meridiaan','Hoek tussen eclipticavlak en evenaarsvlak','Hoek tussen de horizon en de zon om 12 uur'],'Breedte: 0° aan de evenaar, 90° aan de polen (N of Z), gemeten in het meridiaanvlak.',['Dat is de lengtegraad.','Dat is de helling van de aardas (ca. 23,5°).','Die hoek verandert met de seizoenen; de breedtegraad niet.']);
mc('pb','Wat is de lengtegraad van een plaats?','De hoek tussen het vlak van de nulmeridiaan en de plaatselijke meridiaan',['De hoek tussen het evenaarsvlak en de normaal in die plaats','De hoek tussen de horizon en de Poolster','De afstand tot de evenaar'],'Lengte: van 0° (Greenwich) tot 180° oost of west.',['Dat is de breedtegraad.','Dat geeft je de breedtegraad.','Het is een hoek, geen afstand.']);
mc('pb','Een zeeman meet dat de Poolster 51° boven de horizon staat. Wat weet hij nu?','Hij is op ca. 51° noorderbreedte',['Hij is op ca. 51° oosterlengte','Hij is op ca. 39° noorderbreedte','Het is 51 minuten na middernacht'],'De hoogte van de Poolster boven de horizon = je breedtegraad. 51° NB is ongeveer België.',['De Poolster geeft je breedte, niet je lengte.','90° − 51° = 39° is fout: de hoogte zelf is de breedtegraad.','De Poolster staat de hele nacht op dezelfde hoogte, dus geeft geen tijd.']);
open('pb','Waarom is de hoogte van de Poolster boven de horizon gelijk aan je breedtegraad? Gebruik de noordpool en de evenaar als voorbeelden.','De Poolster staat (bijna) in het verlengde van de aardas. Op de noordpool (90° NB) wijst de as recht omhoog, dus staat de Poolster in het zenit (90°). Op de evenaar (0°) staat de as evenwijdig met de horizon, dus staat de Poolster op de horizon (0°). Daartussen neemt de hoogte evenredig toe met je breedte.',['Poolster ligt in het verlengde van de aardas','Noordpool 90° NB → Poolster in het zenit (90°)','Evenaar 0° → Poolster op de horizon (0°)'],'Daarom kun je op het zuidelijk halfrond de Poolster niet zien.');
fill('pb','Met welk instrument nam men vroeger "poolshoogte" op zee?',['sextant','desextant','eensextant'],'Een sextant meet de hoek tussen de horizon en een hemellichaam.','sextant');
match('pb','Koppel het GNSS-systeem aan het land of de regio.',[['GPS','Verenigde Staten'],['Galileo','Europese Unie'],['GLONASS','Rusland'],['Beidou','China']],'GNSS = Global Navigation Satellite Systems. Moderne ontvangers gebruiken vaak meerdere systemen.');
mc('pb','Wat zendt een GNSS-satelliet uit?','Zijn positie, baan en exact verzendtijdstip',['De afstand tot jouw ontvanger in km','Zijn positie en jouw ontvangsttijdstip','Een echo van het signaal van je gsm'],'De ontvanger vergelijkt het verzendtijdstip met het ontvangsttijdstip.',['De satelliet kent jouw afstand niet; de ontvanger berekent die.','Het ontvangsttijdstip meet de ontvanger zelf.','GNSS is eenrichtingsverkeer: je ontvanger zendt niets uit.']);
mc('pb','Hoe bepaalt de ontvanger de afstand tot een GNSS-satelliet?','Tijdsverschil × lichtsnelheid',['Signaalsterkte: zwakker = verder','Hoek van het signaal met de horizon','Tijdsverschil × geluidssnelheid'],'Afstand = lichtsnelheid × tijdsverschil. Daarom zijn heel nauwkeurige klokken nodig (atoomklok in de satelliet).',['Signaalsterkte is veel te onnauwkeurig.','Een hoek alleen geeft geen afstand.','Radiosignalen gaan met de lichtsnelheid, niet met de geluidssnelheid.']);
open('pb','Je hebt in theorie maar 3 satellieten nodig om een positie te bepalen. Waarom heb je er in de praktijk minstens 4 nodig?','Elke satelliet heeft een zeer nauwkeurige atoomklok, maar de ontvanger (bv. je gsm) heeft maar een kwartsklok, die een klein beetje fout loopt. Omdat licht zo snel gaat, geeft een kleine tijdsfout al een grote afstandsfout. Met een 4e satelliet kan de ontvanger zijn eigen klokfout berekenen en wegwerken. Dus 3 + 1.',['3 satellieten voor de positie (driedimensionaal)','Ontvanger heeft een minder nauwkeurige kwartsklok','De 4e satelliet corrigeert die klokfout'],'Een tijdsfout van 1 microseconde geeft al 300 m afstandsfout.');
mc('pb','In welk type klok werkt een GNSS-satelliet?','Een atoomklok',['Een kwartsklok','Een zonnewijzer','Een slingeruurwerk'],'Atoomklokken zijn uiterst nauwkeurig. De ontvanger heeft meestal een kwartsklok.',['De kwartsklok zit in de ontvanger.','Werkt niet in de ruimte.','Werkt niet in gewichtloosheid.']);
match('pb','Koppel de horizontale coördinaat aan de betekenis.',[['Azimut','De richting langs de horizon (bv. gemeten vanaf het noorden)'],['Hoogte','De hoek tussen de horizon en het hemellichaam']],'Samen geven ze aan waar je moet kijken om een hemellichaam te zien.');
mc('pb','Wat is het nadeel van horizontale coördinaten (azimut en hoogte)?','Ze hangen af van plaats en tijd',['Ze werken alleen voor de zon','Ze geven geen hoogte boven de horizon','Je hebt er een GPS-ontvanger voor nodig'],'Door de aardrotatie veranderen ze voortdurend, en iemand anders op aarde meet andere waarden.',['Ze werken voor elk hemellichaam.','De hoogte is net een van de twee coördinaten.','Een kompas en een hoekmeter volstaan.']);

/* --- 6.5 Straling --- */
mc('sr','Waarom kijken astronomen met telescopen in verschillende spectraalbanden (radio, infrarood, zichtbaar, röntgen…)?','Elke soort straling geeft andere informatie',['Zichtbaar licht raakt niet door de ruimte','Andere straling is altijd helderder','Elke telescoop ziet maar één ster'],'Bv. infrarood ziet door stofwolken heen, röntgen toont zeer hete gebieden.',['Zichtbaar licht reist prima door de ruimte.','Dat klopt niet; het gaat om andere informatie.','Dat is niet de reden.']);
mc('sr','Waarom ziet de aarde er vanuit de ruimte vooral blauw uit?','Water (70%) weerkaatst vooral blauw licht',['De aarde zendt zelf blauw licht uit','Het ijs aan de polen kleurt blauw','De aarde is heet, dus blauw'],'Welke golflengten een object weerkaatst, zegt iets over zijn samenstelling.',['De aarde weerkaatst zonlicht; ze is te koel om zelf zichtbaar licht uit te stralen.','IJs is wit en bedekt maar een klein deel.','Blauw door temperatuur geldt voor sterren die zelf licht uitstralen.']);
mc('sr','Wat zijn Fraunhoferlijnen?','Absorptielijnen die de elementen verraden',['Lichte lijnen van de aardse dampkring','Lijnen die enkel de snelheid tonen','Grenzen tussen de spectraalklassen'],'Elk element absorbeert zijn eigen golflengten. Zo kennen we de samenstelling van sterren zonder er naartoe te gaan.',['Het zijn donkere absorptielijnen van elementen in de ster.','De verschuiving van de lijnen toont de snelheid; het patroon toont de elementen.','Spectraalklassen gaan over kleur en temperatuur.']);
open('sr','Hoe kunnen we weten dat er ijzer en calcium in de zon zitten, zonder er ooit geweest te zijn?','Door het spectrum van het zonlicht te bekijken. Daarin zitten donkere lijnen (Fraunhoferlijnen) op vaste golflengten. Elk element absorbeert zijn eigen specifieke golflengten, een soort vingerafdruk. Als we het patroon van ijzer en calcium terugvinden in het zonnespectrum, weten we dat die elementen in de zon aanwezig zijn.',['Spectrum van het zonlicht','Donkere absorptielijnen (Fraunhoferlijnen)','Elk element heeft zijn eigen patroon (vingerafdruk)'],'Zo werd helium zelfs eerst in de zon ontdekt (helios = zon) voor men het op aarde vond.');
mc('sr','Wat vertelt de kleur van een ster over de ster?','Temperatuur: blauw is heet',['Temperatuur: rood is heet','Afstand: blauw is dichtbij','Leeftijd: blauw is oud'],'Hoe heter een object, hoe korter de golflengte waarbij het het meest straalt.',['Omgekeerd: rood is koel, blauw is heet.','Kleur zegt niets rechtstreeks over afstand.','Er is geen direct verband met de leeftijd.']);

mc('sr','Wat is het dopplereffect bij licht?','Golflengteverschuiving door beweging',['Golflengteverschuiving door temperatuur','Buiging van licht rond een zwart gat','Absorptie van licht door elementen'],'Hetzelfde effect hoor je bij een sirene die voorbijrijdt (hoger als ze nadert, lager als ze weggaat).',['Temperatuur bepaalt de kleur, maar dat is geen dopplereffect.','Dat is zwaartekrachtlenzing.','Dat geeft Fraunhoferlijnen, geen verschuiving.']);

open('sr','Hoe wordt van straling die we niet kunnen zien (bv. radiostraling) toch een kleurenbeeld gemaakt?','Een detector met een CCD-chip, opgebouwd uit pixels, meet per pixel hoeveel straling er binnenkomt. Dat geeft een grijswaarde, die omgezet wordt in een getal. Die getallen worden dan met een kleurcode omgezet naar kleuren, zodat er een (valse) kleurenafbeelding ontstaat.',['CCD-chip met pixels meet de straling','Grijswaarden → getallen','Getallen → kleuren via een kleurcode (valse kleuren)'],'De kleuren op zo\'n beeld zijn dus gekozen, niet "echt".');

/* Kernwoordcontrole: woordbegin, "=woord" = heel woord; woorden uit de vraag tellen niet. */
function kwHit(text,kws,qtext){

  if(!ks.length)ks=kws;
  return ks.some(k=>T.includes(pat(k)));
}

/* ============ SESSIE ============ */
let S=null,CUR=null;
function pickRound(ids,mode){
  const D=today();const seen=id=>P[id]&&P[id].seen;
  const due=shuffle(ids.filter(isDue)).sort((a,b)=>(P[b].cwFlag?1:0)-(P[a].cwFlag?1:0)||P[a].lvl-P[b].lvl||P[a].due-P[b].due);
  const fresh=shuffle(ids.filter(id=>!seen(id)));
  const rest=shuffle(ids.filter(id=>seen(id)&&!isDue(id))).sort((a,b)=>P[a].lvl-P[b].lvl||P[a].due-P[b].due);
  let pick=due.slice(0,ROUND);
  if(mode!=='review'){if(pick.length<ROUND)pick=pick.concat(fresh.slice(0,ROUND-pick.length));if(pick.length<ROUND)pick=pick.concat(rest.slice(0,ROUND-pick.length))}
  /* hoogstens 3 open vragen per ronde, anders duurt een ronde te lang */
  let o=0;pick=pick.filter(id=>QB[id].type!=='open'||++o<=3||ids.every(i=>QB[i].type==='open'));
  const spare=[...due,...fresh,...rest].filter(id=>!pick.includes(id));
  return {pick:shuffle(pick),spare};
}
function startLearn(ids,label,mode){
  if(!ids.length)return;
  const r=pickRound(ids,mode);if(!r.pick.length){home();return}
  S={mode:'learn',label,scope:ids,smode:mode,queue:r.pick.map(id=>({id})),spare:r.spare,total:r.pick.length,done:0,first:{},log:[],conf:{}};
  showQ();
}
function startExam(ids,n,label){
  const pick=shuffle(ids).slice(0,n);
  S={mode:'exam',label,scope:ids,queue:pick.map(id=>({id})),total:pick.length,done:0,first:{},log:[],conf:{},t0:Date.now()};
  showQ();
}
function startSim(){
  /* examensimulatie: vaste mix van vraagsoorten, gespreid over de onderwerpen */
  const Q={open:5,num:4,order:2,cloze:2,fill:2,match:1,mc:3,tf:1};const pick=[];const usedT={};
  Object.keys(Q).forEach(ty=>{const pool=shuffle(Qs.filter(q=>q.type===ty&&!q.svg)).sort((a,b)=>(usedT[a.t]||0)-(usedT[b.t]||0));
    pool.slice(0,Q[ty]).forEach(q=>{pick.push(q.id);usedT[q.t]=(usedT[q.t]||0)+1})});
  S={mode:'exam',sim:true,label:'Examensimulatie',scope:idsOf(),queue:shuffle(pick).map(id=>({id})),total:pick.length,done:0,first:{},log:[],conf:{},t0:Date.now()};
  showQ();

function requeue(item){
  /* minstens GAP andere vragen ertussen; vul aan met reservevragen als de ronde bijna op is */
  while(S.queue.length<GAP&&S.spare&&S.spare.length){const id=S.spare.shift();S.queue.push({id,filler:true});S.total++}
  const pos=Math.min(S.queue.length,GAP+Math.floor(Math.random()*2));
  S.queue.splice(pos,0,item);
}
function showQ(){
  if(!S.queue.length){return finish()}
  const item=S.queue[0],q=QB[item.id];window.scrollTo(0,0);
  if(S.first[item.id]===undefined)prep(q);
  app.innerHTML='';

  stop.onclick=()=>{if(exam&&!armed){armed=true;stop.textContent='Toets echt stoppen?';setTimeout(()=>{armed=false;stop.textContent='Stoppen'},4000);return}
    S.log.length?finish(true):home()};
  const left=S.queue.length;
  const bar=h('div','bar','<i style="width:'+Math.round(S.done/(S.done+left)*100)+'%"></i>');
  const n=h('div','n',(exam?(S.done+1)+' / '+S.total:S.done+' klaar · nog '+left));
  top.append(stop,bar,n);
  const card=h('div','panel qcard');
  const p=P[item.id];
  const meta=h('div','meta','<span class="chip a">'+esc(TB[q.t].title)+'</span><span class="chip">'+TYPE[q.type]+'</span>'+(exam?'<span class="chip">'+(S.sim?'Examen':'Toets')+'</span>':(p&&p.seen?'<span class="chip">'+LV[p.lvl]+'</span>':'<span class="chip">Nieuw</span>')));
  const qt=h('h2','qtext',esc(q.q));qt.tabIndex=-1;
  const fbBox=h('div');fbBox.setAttribute('role','status');
  const actions=h('div','actions-row');
  let locked=false,conf=null,confRow=null;
  const ctx={exam,
    changed:()=>{if(conf)conf.disabled=!w.ready();if(confRow){confRow.querySelectorAll('button').forEach(b=>b.disabled=!w.ready());confRow.querySelector('.confhint').textContent=w.ready()?'':'Kies eerst een antwoord.'}},
    submit:res=>{if(locked)return;locked=true;handle(res)},
    confirmNow:()=>{if(conf&&!conf.disabled)conf.click()}};
  const w=makeWidget(q,ctx);
  if(CONF.includes(q.type)){
    confRow=h('div','confrow');confRow.appendChild(h('div','conflabel',(exam?'Bevestig':'Controleer')+': hoe zeker ben je?'));
    const g=h('div','confbtns');
    [['gok','Gok'],['twijfel','Twijfel'],['zeker','Zeker']].forEach(([k,l])=>{const b=h('button','btn',l);b.type='button';b.disabled=true;
      b.onclick=()=>{if(locked||!w.ready())return;locked=true;const r=w.getRes();r.conf=k;handle(r)};g.appendChild(b)});
    confRow.append(g,h('div','confhint hintline','Kies eerst een antwoord.'));
    actions.appendChild(confRow);
  }else{
    conf=h('button','btn primary',w.label||(exam?'Bevestig':'Controleer'));conf.type='button';conf.disabled=!w.ready();
    conf.onclick=()=>{if(locked||!w.ready())return;if(w.step){conf.remove();conf=null;w.step();return}locked=true;handle(w.getRes())};
    actions.appendChild(conf);
  }
  card.append(meta,qt,w.root,fbBox,actions);
  app.append(top,card);
  CUR={w,q,item};
  if(w.focus)w.focus();
  if(!card.contains(document.activeElement))qt.focus({preventScroll:true});
  function handle(res){
    if(conf){conf.remove();conf=null}if(confRow)confRow.remove();
    const D=today();
    const p=P[item.id]||(P[item.id]={lvl:0,due:D,seen:0,wrong:0,okDay:-1});
    const first=S.first[item.id]===undefined;
    p.seen++;
    let lvlMsg='';
    if(first){
      S.first[item.id]=res.ok;
      if(res.conf){const c=CAL[res.conf]||(CAL[res.conf]=[0,0]);c[1]++;if(res.ok)c[0]++;const s=S.conf[res.conf]||(S.conf[res.conf]=[0,0]);s[1]++;if(res.ok)s[0]++}
      if(res.ok&&!res.hint){
        if(p.okDay!==D){const was=p.lvl;if(was<3)S.up=(S.up||0)+1;p.lvl=Math.min(3,p.lvl+1);p.okDay=D;const gap=was===3?INT[4]:INT[p.lvl];p.due=D+gap;
          lvlMsg=(p.lvl===3?'Beheerst.':'Niveau: '+LV[p.lvl].toLowerCase()+'.')+' Deze vraag komt over '+gap+' dag'+(gap>1?'en':'')+' terug'+(p.lvl<3?'; dan meteen juist en hij gaat een niveau hoger.':'.')}
        else lvlMsg='Vandaag al eens juist: pas op een volgende dag gaat hij een niveau hoger.';
        p.cwFlag=false;
      }else if(res.ok){p.due=D+1;lvlMsg='Juist met hint: telt nog niet voor een hoger niveau.'}
      else{if(p.lvl>0)S.down=(S.down||0)+1;p.lvl=Math.max(0,p.lvl-1);p.due=D;p.wrong++;if(res.conf==='zeker')p.cwFlag=true}
    }
    S.log.push({id:item.id,ok:res.ok,score:res.score,user:res.user,why:res.why||[],conf:res.conf});
    save();
    if(exam){S.queue.shift();S.done++;showQ();return}
    w.reveal(res);
    const cw=!res.ok&&res.conf==='zeker';
    const part=!res.ok&&res.score>0;
    /* rangschikken, koppelen en invulteksten tonen de verbetering al in de vraag zelf; niet herhalen */
    const inWidget=['order','match','cloze','open'].includes(q.type);
    const showWhy=!res.ok&&res.why&&res.why.length&&(q.type==='mc'||q.type==='multi'||q.type==='fill'||q.type==='num');
    const fb=h('div','fb '+(res.ok?'good':part?'part':'bad'));
    fb.innerHTML='<div class="h">'+mark(res.ok)+' '+(res.ok?'Juist.':part?'Gedeeltelijk juist.':'Niet juist.')+'</div>'+
      (cw?'<div class="cw">Je was zeker, maar dit was fout: deze vraag krijgt voorrang.</div>':'')+
      ((res.ok&&!res.note)||inWidget||q.type==='multi'?'':'<div class="ans"><b>Juiste antwoord:</b> '+correctHTML(q)+'</div>')+
      (showWhy?'<div class="why"><b>Waarom je fout zat:</b><ul>'+res.why.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul></div>':'')+
      (res.note?'<div>'+esc(res.note)+'</div>':'')+
      '<div class="ex">'+(res.ok?'':'<b>Uitleg:</b> ')+esc(q.ex)+'</div>'+
      (!res.ok?'<details class="lees"><summary>Lees na: '+esc(TB[q.t].title)+'</summary><ul>'+TB[q.t].sum.map(s=>'<li>'+s+'</li>').join('')+'</ul></details>':'')+
      (!res.ok&&q.type!=='open'?'<div class="muted">Deze vraag komt later in deze ronde terug.</div>':'')+
      (!res.ok&&q.type==='open'?'<div class="muted">Deze vraag komt in een volgende ronde terug.</div>':'')+
      (lvlMsg?'<div class="muted">'+esc(lvlMsg)+'</div>':'');
    fbBox.appendChild(fb);
    const nx=h('button','btn primary','Volgende');nx.type='button';
    nx.onclick=()=>{S.queue.shift();
      if(res.ok||q.type==='open')S.done++;
      else requeue(item);
      showQ()};
    actions.appendChild(nx);nx.focus({preventScroll:true});
    /* het antwoord met de kleuren bovenaan in beeld; de knop Volgende kleeft onderaan op een gsm */
    const tgt=q.type==='open'?fbBox:w.root;const r=tgt.getBoundingClientRect();
    if(r.top<0||r.top>window.innerHeight*0.5)window.scrollBy({top:r.top-12,behavior:'smooth'});
  }
}

function calLine(c){const ks=[['zeker','Zeker'],['twijfel','Twijfel'],['gok','Gok']].filter(([k])=>c[k]&&c[k][1]);
  if(!ks.length)return '';
  return '<div class="cal"><span class="muted">Juist als je zei:</span>'+ks.map(([k,l])=>'<span class="calstat"><b>'+Math.round(c[k][0]/c[k][1]*100)+'%</b> '+l+' <span class="muted">('+c[k][1]+')</span></span>').join('')+
    (c.zeker&&c.zeker[1]>=5&&c.zeker[0]/c.zeker[1]<.85?'<span class="muted">Je bent soms te zeker: lees ook "makkelijke" vragen goed.</span>':'')+'</div>'}
function dueOn(d,ids){return (ids||idsOf()).filter(id=>P[id]&&P[id].seen&&P[id].due<=d).length}
function nextLine(){const D=today();const t=dueOn(D+1)-dueOn(D),w=dueOn(D+3);
  return t||w?'Morgen '+(t?'staan er '+t+' nieuwe herhalingen klaar':'is er niets nieuws te herhalen')+(w>t?' · binnen 3 dagen '+w:'')+'.':''}

  const msgl=h('span','muted small');fi.onchange=()=>{if(fi.files[0])importP(fi.files[0],msgl)};
  const a3=h('button','btn small','Voortgang wissen');let armed=false,tm;
  a3.onclick=()=>{if(!armed){armed=true;a3.textContent='Zeker weten? Klik nogmaals';tm=setTimeout(()=>{armed=false;a3.textContent='Voortgang wissen'},4000)}else{clearTimeout(tm);P={};CAL={};save();home()}};
  row.append(e1,e2,fi,a3,msgl);tools.appendChild(row);
  const tcount={};Qs.forEach(q=>{const k=q.type==='tf'?'mc':q.type;tcount[k]=(tcount[k]||0)+1});
  const TNAME={open:'open',num:'rekenen',cloze:'invulteksten',fill:'invullen',order:'rangschikken',match:'koppelen en schema\'s',multi:'meerdere juist',mc:'meerkeuze en juist/onjuist'};
  const types=h('details','panel tools','<summary>Welke soorten vragen zitten erin?</summary><div class="types">'+Object.keys(TNAME).filter(k=>tcount[k]).map(k=>'<span class="chip">'+tcount[k]+' '+TNAME[k]+'</span>').join('')+'</div><p class="muted small">Heel specifieke getallen staan in de vraag zelf; de rest moet je kennen. Rekenvragen krijgen telkens andere getallen.</p>');
  app.append(types,tools);
  const lr=document.getElementById('live')||h('div','sr-only');lr.id='live';lr.setAttribute('aria-live','polite');document.body.appendChild(lr);
}
home();
</script>

<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kosmografie · QuizMore</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* Layout: één smalle werkkolom. Overzicht met onderwerpkaarten, daarna een vraag per scherm met directe uitleg. */
:root{
  --bg:#F2F5F7; --surface:#FFFFFF; --surface2:#E7EDF1; --ink:#14232D; --muted:#566873; --line:#D3DDE3;
  --accent:#0B7A75; --accent-ink:#FFFFFF; --accent-soft:#D9EFEC;
  --good:#1B7F47; --good-soft:#DDF1E4; --bad:#BE3326; --bad-soft:#F9E1DE; --warn:#9A6200; --warn-soft:#FBEFD3;
  --font-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --font-body:'IBM Plex Sans','Segoe UI',system-ui,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1A21; --surface:#16252E; --surface2:#1D303B; --ink:#E6EEF2; --muted:#93A7B2; --line:#2A404D;
    --accent:#3CC3BB; --accent-ink:#072320; --accent-soft:#12383A;
    --good:#4CC17F; --good-soft:#12341F; --bad:#F0776A; --bad-soft:#3B1A17; --warn:#E9B04A; --warn-soft:#3A2C0E;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1A21; --surface:#16252E; --surface2:#1D303B; --ink:#E6EEF2; --muted:#93A7B2; --line:#2A404D;
  --accent:#3CC3BB; --accent-ink:#072320; --accent-soft:#12383A;
  --good:#4CC17F; --good-soft:#12341F; --bad:#F0776A; --bad-soft:#3B1A17; --warn:#E9B04A; --warn-soft:#3A2C0E;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.5;
  padding-block:24px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:20px;min-width:0}
h1,h2,h3{font-family:var(--font-display);font-weight:700;line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(28px,5.5vw,40px)}
h2{font-size:clamp(20px,3.6vw,25px)}
h3{font-size:18px}
p{margin:0}
.eyebrow{font-family:var(--font-mono);font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--accent)}
.muted{color:var(--muted)}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.btn{appearance:none;border:1.5px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 16px;font-weight:600;cursor:pointer;min-height:44px;transition:background .15s,border-color .15s}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover:not(:disabled){filter:brightness(1.08)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.small{min-height:36px;padding:6px 12px;font-size:14px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;min-width:0}
.hero{display:flex;flex-direction:column;gap:10px}
.hero p{max-width:62ch;color:var(--muted)}

.mastery{display:flex;flex-direction:column;gap:14px}
.mastery-top{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:baseline;justify-content:space-between}
.big{font-family:var(--font-display);font-weight:700;font-size:34px;font-variant-numeric:tabular-nums;line-height:1}
.big small{font-size:18px;color:var(--muted);font-weight:600}
.bar{height:10px;border-radius:6px;background:var(--surface2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:6px;transition:width .4s}
.bar.thin{height:6px}

.exam{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:12px;align-items:end}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-family:var(--font-mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
select,input[type=text]{background:var(--surface);border:1.5px solid var(--line);border-radius:8px;padding:9px 10px;min-height:44px;width:100%;min-width:0}

.topics{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:14px}
.topic{display:flex;flex-direction:column;gap:12px;justify-content:space-between}
.topic .tag{font-family:var(--font-mono);font-size:12px;color:var(--muted);letter-spacing:.05em}
.topic .count{font-variant-numeric:tabular-nums;font-size:14px;color:var(--muted);display:flex;justify-content:space-between}
.topic.done{border-color:var(--good)}
.topic .actions{display:flex;gap:8px;flex-wrap:wrap}
.topic .actions .btn{flex:1 1 auto}

/* sessie */
.topbar{display:flex;align-items:center;gap:14px}
.topbar .bar{flex:1}
.topbar .n{font-family:var(--font-mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.qcard{display:flex;flex-direction:column;gap:18px}
.meta{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-family:var(--font-mono);font-size:12px;letter-spacing:.04em;padding:3px 9px;border-radius:999px;background:var(--surface2);color:var(--muted)}
.chip.a{background:var(--accent-soft);color:var(--accent)}
.qtext{font-family:var(--font-display);font-weight:600;font-size:clamp(19px,3.4vw,23px);line-height:1.3}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{appearance:none;text-align:left;display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;min-height:48px;width:100%}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .key{flex:none;font-family:var(--font-mono);font-size:12px;width:24px;height:24px;border-radius:6px;background:var(--surface2);color:var(--muted);display:grid;place-items:center;margin-top:1px}
.opt .txt{min-width:0;overflow-wrap:anywhere}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.good{border-color:var(--good);background:var(--good-soft)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.missed{border-color:var(--good);border-style:dashed}
.opt:disabled{cursor:default;color:inherit}
.hintline{font-size:14px;color:var(--muted)}
.fillrow{display:flex;gap:10px;flex-wrap:wrap}
.fillrow input{flex:1 1 220px}
input.good,select.good{border-color:var(--good);background:var(--good-soft)}
input.bad,select.bad{border-color:var(--bad);background:var(--bad-soft)}
.matchrows{display:flex;flex-direction:column;gap:10px}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:10px;align-items:center}
.mrow .l{font-weight:600;overflow-wrap:anywhere}
.mrow .fix{grid-column:1/-1;font-size:14px;color:var(--good)}
@media (max-width:520px){.mrow{grid-template-columns:1fr}}
.fb{border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;border:1.5px solid}
.fb.good{background:var(--good-soft);border-color:var(--good)}
.fb.bad{background:var(--bad-soft);border-color:var(--bad)}
.fb .h{font-weight:700}
.fb.good .h{color:var(--good)} .fb.bad .h{color:var(--bad)}
.fb .ans{overflow-wrap:anywhere}
.fb ul{margin:0;padding-left:18px}
.fb .ex{color:var(--ink)}
.actions-row{display:flex;gap:10px;flex-wrap:wrap}
.why{display:flex;flex-direction:column;gap:4px}
.why ul{margin:0;padding-left:18px}
.fb .yours{color:var(--muted)}

/* theorie en resultaat */
.theory ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px}
.theory li{max-width:68ch}
.theory b{font-weight:600}
.score{display:flex;flex-wrap:wrap;gap:12px 28px;align-items:baseline}
.rev{display:flex;flex-direction:column;gap:10px}
details.r{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:0}
details.r>summary{cursor:pointer;padding:12px 14px;display:flex;gap:10px;align-items:flex-start;list-style:none}
details.r>summary::-webkit-details-marker{display:none}
details.r .mark{flex:none;font-weight:700;width:20px}
details.r.ok .mark{color:var(--good)} details.r.no .mark{color:var(--bad)}
details.r .body{padding:0 14px 14px 44px;display:flex;flex-direction:column;gap:6px;font-size:15px}
details.r .body ul{margin:0;padding-left:18px}
.back{align-self:flex-start;font-size:14px;font-weight:600;color:var(--accent);text-decoration:none}
.back:hover{text-decoration:underline}
.foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:14px;color:var(--muted)}

/* extra vraagsoorten: open, rangschikken, rekenen, invultekst, schema */
textarea{font:inherit;color:inherit;background:var(--surface);border:1.5px solid var(--line);border-radius:8px;padding:10px 12px;width:100%;min-height:120px;resize:vertical}
textarea:disabled{opacity:.85}
.openq{display:flex;flex-direction:column;gap:14px}
.fb.neutral{background:var(--surface2);border-color:var(--line)}
.fb.neutral .h{color:var(--ink)}
ul.kp{list-style:none;padding-left:0;margin:6px 0 0;display:flex;flex-direction:column;gap:4px}
ul.kp li{display:flex;gap:8px}
ul.kp li span{flex:none;font-weight:700}
ul.kp li.hit span{color:var(--good)}
ul.kp li.miss span{color:var(--bad)}
.olist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.oitem{display:flex;gap:8px;align-items:center;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;min-height:52px}
.oitem .key{flex:none;font-family:var(--font-mono);font-size:12px;width:24px;height:24px;border-radius:6px;background:var(--surface2);color:var(--muted);display:grid;place-items:center}
.oitem .txt{flex:1;min-width:0;overflow-wrap:anywhere;display:flex;flex-direction:column;gap:2px}
.oitem .mv{flex:none;min-width:40px;min-height:40px;padding:4px 0;font-size:16px}
.oitem.good{border-color:var(--good);background:var(--good-soft)}
.oitem.bad{border-color:var(--bad);background:var(--bad-soft)}
.fixpos{font-size:13px;font-weight:600;color:var(--bad)}
.numrow{align-items:center}
.numrow input{flex:0 1 200px}
.unit{font-weight:600;color:var(--muted)}
.cloze{line-height:2.5;font-size:17px;max-width:68ch}
.cloze input{background:var(--surface);border:1.5px solid var(--line);border-radius:6px;padding:3px 8px;min-height:36px;margin:0 3px;max-width:100%}
.diagq{display:flex;flex-direction:column;gap:16px}
.diagbox{background:var(--surface2);border-radius:10px;padding:12px}
.diag{width:100%;max-width:360px;height:auto;display:block;margin:0 auto}
.d-c1{fill:#F7E3B5;stroke:#C9A04A}.d-c2{fill:#F4A97A;stroke:#C46B38}.d-c3{fill:#FFE27A;stroke:#C9A400}
.d-c4{fill:#F59A3C;stroke:#B9651A}.d-c5{fill:#F2C14E;stroke:#B98A15}.d-c6{fill:#FFF6D6;stroke:#C9A400}
.d-dot{fill:var(--surface);stroke:var(--ink);stroke-width:1.5}
.d-num{font-family:var(--font-mono);font-size:11px;font-weight:500;fill:var(--ink);text-anchor:middle}
.d-lbl{font-size:12px;fill:var(--muted);text-anchor:middle}
.d-orbit{fill:none;stroke:var(--muted);stroke-width:1.5;stroke-dasharray:5 4}
.d-sun{fill:#F2B01E}.d-earth{fill:#2E7DD7}
.d-ax{stroke:var(--ink);stroke-width:1.5}
.d-band{fill:none;stroke:var(--accent);stroke-width:16;stroke-linecap:round;opacity:.35}
.d-zone{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1}
.types{display:flex;flex-wrap:wrap;gap:6px}
/* niveaus, zekerheid, zelfbeoordeling, hints, examensimulatie */
.lbar{display:flex;height:10px;border-radius:6px;background:var(--surface2);overflow:hidden}
.lbar i{display:block;height:100%}
.l3{background:var(--accent)}.l2{background:color-mix(in srgb,var(--accent) 62%,var(--surface2))}.l1{background:color-mix(in srgb,var(--accent) 30%,var(--surface2))}.l0{background:var(--surface2);outline:1px solid var(--line)}
.topic .lbar{height:6px}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px}
.confrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.conflabel{font-weight:600;margin-right:4px}
.cw{font-weight:600;color:var(--warn)}
.warnline{border-radius:8px;padding:10px 12px;background:var(--warn-soft);color:var(--ink);border:1.5px solid var(--warn)}
ul.kp.self li{align-items:flex-start;flex-wrap:wrap}
ul.kp.self input{width:20px;height:20px;margin:2px 0 0;flex:none;accent-color:var(--accent)}
ul.kp.self label{flex:1;min-width:0;cursor:pointer}
ul.kp.self .det{flex-basis:100%;padding-left:28px;font-size:13px;color:var(--warn)}
ul.kp.self li.hit label{color:var(--good)}
ul.kp.self li.miss label{color:var(--muted)}
details.lees{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 12px}
details.lees summary{cursor:pointer;font-weight:600;color:var(--accent)}
details.lees ul{margin:8px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:15px}
.hints{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.hintlist{margin:0;padding-left:20px;color:var(--ink)}
.fixin{font-size:13px;font-weight:600;color:var(--good);margin-right:4px}
.simrow{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;background:var(--accent-soft);border-radius:10px;padding:14px 16px;margin-bottom:16px}
.simrow>div{flex:1 1 260px;min-width:0}
.pertopic table{border-collapse:collapse;width:100%;font-size:15px}
.pertopic th,.pertopic td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
.pertopic td:last-child,.pertopic th:last-child{text-align:right;font-variant-numeric:tabular-nums}
.tools{margin-top:4px}
.small{font-size:13px}
/* UI-review: contrast, gsm-ergonomie, toegankelijkheid */
:root{--warn:#7A4E00;--good:#176B3C;--field:#8A9AA5;--chip-ink:#075E5A}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--warn:#E9B04A;--good:#4CC17F;--field:#4F6877;--chip-ink:var(--accent)}}
:root[data-theme="dark"]{--warn:#E9B04A;--good:#4CC17F;--field:#4F6877;--chip-ink:var(--accent)}
.opt,input[type=text],select,textarea,.oitem{border-color:var(--field)}
.chip.a{color:var(--chip-ink)}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.qtext:focus{outline:none}
.cloze input.good{border-color:var(--good);background:var(--good-soft)}
.cloze input.bad{border-color:var(--bad);background:var(--bad-soft)}
.fb.part{background:var(--warn-soft);border-color:var(--warn)}
.fb.part .h{color:var(--warn)}
.fb .h span{margin-right:2px}
.opt.good .key,.opt.bad .key,.opt.missed .key{font-size:14px;font-weight:700}
.opt.good .key{background:var(--good);color:#fff}.opt.bad .key{background:var(--bad);color:#fff}.opt.missed .key{background:var(--surface2);color:var(--good)}
.missedtag{display:block;font-size:13px;font-weight:600;color:var(--good)}
.lbar i+i{border-left:2px solid var(--surface)}
.l2{background:color-mix(in srgb,var(--accent) 55%,var(--surface))}.l1{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--accent) 35%,var(--surface)) 0 4px,var(--surface2) 4px 7px)}
/* zekerheid */
.confrow{display:flex;flex-direction:column;gap:8px;align-items:stretch;width:100%}
.confbtns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:420px}
.confhint:empty{display:none}
/* knoppen onderaan vast op een gsm */
@media (max-width:600px){
  .qcard>.actions-row{position:sticky;bottom:0;z-index:3;background:var(--surface);margin:0 -20px -20px;padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);border-radius:0 0 12px 12px}
  .confbtns{max-width:none}
  .diagbox{position:sticky;top:0;z-index:2}
  .diag{max-height:38vh}
}
.svgm .mrow{grid-template-columns:auto minmax(0,1fr)}
@media (max-width:520px){.svgm .mrow{grid-template-columns:auto minmax(0,1fr)}}
.svgm .mrow .l{min-width:2.2em;font-family:var(--font-mono)}
.d-num{font-size:14px}
/* rangschikken: tikken om te plaatsen */
.oitem{padding:6px 8px}
.oitem .txt{appearance:none;background:none;border:0;text-align:left;font:inherit;color:inherit;padding:8px 4px;cursor:pointer;border-radius:6px}
.oitem.picked{border-color:var(--accent);background:var(--accent-soft);border-width:2px}
.pickhint{font-size:13px;color:var(--chip-ink);font-weight:600}
.mvs{display:flex;gap:4px;flex:none}
.oitem .mv{min-width:44px;min-height:44px}
/* theorie */
.panel.theory{display:flex;flex-direction:column;gap:12px}
.topbar .btn.primary{margin-left:auto}
/* startscherm */
.hero h1{font-size:clamp(28px,6vw,42px)}
.now{display:flex;flex-direction:column;gap:12px;border:2px solid var(--accent)}
.nowmsg{font-size:17px}
.big-btn{min-height:52px;font-size:17px;align-self:flex-start;padding:12px 22px}
.linkish{border:0;background:none;color:var(--chip-ink);text-decoration:underline;align-self:flex-start;min-height:36px;padding:4px 0}
.ways{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.waylabel{font-family:var(--font-mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
details.tools{padding:14px 20px}
details.tools>summary{cursor:pointer;font-weight:600}
details.tools[open]{display:flex;flex-direction:column;gap:10px}
.cal{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:baseline;font-size:14px}
.calstat b{font-variant-numeric:tabular-nums}
@media (max-width:600px){.big-btn{align-self:stretch}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

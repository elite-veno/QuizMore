<script>
/* ============ VRAGEN ============ */
/* Heel specifieke getallen (exacte afstanden, temperaturen, limieten) staan in de vraag zelf. De kern moet je kennen. */
const TOPICS=[
{id:'pl',tag:'H1',title:'De aarde in het heelal',sum:[
 '<b>Aardrevolutie</b>: de aarde draait in 1 jaar rond de zon, in een <b>ellips</b> met de zon in één <b>brandpunt</b>. Het vlak van die baan is het <b>eclipticavlak</b>; de schijnbare baan van de zon tussen de sterren heet de <b>ecliptica</b>.',
 '<b>Perihelium</b>: punt van de baan het dichtst bij de zon (begin januari). <b>Aphelium</b>: het verst van de zon (begin juli). Bij het perihelium gaat de aarde sneller, daardoor zijn de seizoenen niet even lang: op het noordelijk halfrond duren lente en zomer samen enkele dagen langer dan herfst en winter.',
 '<b>Aardrotatie</b>: de aarde draait in 1 dag om haar <b>rotatie-as</b>, van <b>west naar oost</b> (tegenwijzerzin gezien boven de noordpool). De as helt ca. <b>23,5°</b> (inclinatie) t.o.v. de loodlijn op het eclipticavlak: de oorzaak van de seizoenen.',
 '<b>Precessie</b>: de rotatie-as beschrijft een <b>tolbeweging</b> rond de loodlijn op het eclipticavlak, met een periode van ca. <b>26 000 jaar</b>. Gevolg: de hemelpool en dus de poolster verandert, en de sterrenbeelden verschuiven t.o.v. de seizoenen.',
 '<b>Afstandseenheden</b>: binnen het zonnestelsel km en de <b>astronomische eenheid</b> (1 AE ≈ 150 miljoen km = gemiddelde afstand aarde-zon). Buiten het zonnestelsel het <b>lichtjaar</b>: de afstand die licht aflegt in 1 jaar (ca. 9,46 × 10¹² km, c ≈ 300 000 km/s). Ook lichtminuten (zon: 8,3) en lichtseconden (maan: 1,28).',
 '<b>Structuur</b> van klein naar groot: <b>planetenstelsel</b> (planeten rond 1 centrale ster, bv. het zonnestelsel) → <b>sterrenstelsel</b> (sterren, planeten, gas en stof, wellicht donkere materie, bijeengehouden door onderlinge zwaartekracht, bv. de Melkweg) → <b>cluster</b> (30 tot 1000 sterrenstelsels, bv. de Lokale Groep) → nog grotere gehelen.']},
{id:'st',tag:'H2',title:'Sterren',sum:[
 '<b>Schijnbare magnitude</b> (m): hoe helder een ster <i>lijkt</i>. Hipparchus (200 v.C.) deelde sterren in van 1 (helderst) tot 6 (zwakst). Hoe <b>lager</b> het getal, hoe <b>helderder</b>; heel heldere objecten krijgen negatieve waarden (zon: −26,7). Het is een <b>logaritmische schaal</b>: 1 magnitude verschil = factor 2,512; 5 magnitudes = factor 100.',
 '"Schijnbaar" omdat de waargenomen helderheid afhangt van <b>afstand</b> én van de <b>uitgestraalde energie</b>. <b>Wet van de kwadratische afname</b>: ontvangen straling is omgekeerd evenredig met het kwadraat van de afstand (2× zo ver = 4× zo zwak).',
 '<b>Absolute magnitude</b> (M): de magnitude die een ster zou hebben op <b>10 parsec</b> (32,6 lj). Ze vergelijkt dus de echte lichtkracht. Formule: m − M = 5·log(d) − 5. Is m = M, dan staat de ster op 10 pc; is m &gt; M, dan staat ze verder.',
 '<b>Spectraalklasse</b>: indeling volgens kleur en spectrum. <b>Rood</b> = koud oppervlak; <b>blauw</b> = heet oppervlak. <b>Op de hoofdreeks</b> geldt ook: rood = lage massa, blauw = hoge massa (een rode superreus zoals Betelgeuze is wel koel maar zeer zwaar). In het <b>Hertzsprung-Russelldiagram</b> (spectraalklasse/temperatuur tegen absolute magnitude) ligt ca. <b>90%</b> van de sterren op de <b>hoofdreeks</b>.',
 '<b>Protoster</b>: in een <b>moleculaire wolk</b> (vooral H) trekken dichte knopen samen door zwaartekracht; compressie verhoogt de temperatuur in de kern en de materie wordt plasma. Genoeg massa → <b>kernfusie</b> van waterstof tot helium = <b>ster</b> (jetfase blaast omliggend gas en stof weg). Te weinig massa → geen fusie → <b>bruine dwerg</b>.',
 'De grootte van een ster is een <b>evenwicht</b> tussen de uitwaartse kracht van de kernfusie en de inwaartse zwaartekracht.',
 '<b>0,6 tot 8 M☉</b>: H op → ster krimpt, T stijgt → fusie He → C in de kern, H → He verhuist naar de schil → ster zwelt op, oppervlak koelt af → <b>rode reus</b>. He op → te weinig massa voor nieuwe fusie → buitenste lagen worden een <b>planetaire nevel</b>, de kern wordt een <b>witte dwerg</b> → na afkoeling <b>zwarte dwerg</b>.',
 '<b>Meer dan 8 M☉</b>: opeenvolgende fusies (C, Ne, O, Si tot Fe) → <b>superreus</b>. Fusie voorbij <b>ijzer</b> levert geen energie → kern implodeert → schokgolf → <b>supernova</b>, die elementen verspreidt en nieuwe stervorming kan uitlokken. Restant: <b>neutronenster</b> (8–20 M☉) of <b>zwart gat</b> (&gt; 20 M☉).',
 '<b>Witte dwerg</b>: zo groot als de aarde, max. 1,4 M☉ (Chandrasekhar-limiet), elektronen houden het instorten tegen. <b>Neutronenster</b>: ca. 10 km, elektronen en protonen versmelten tot neutronen, extreem dicht. <b>Zwart gat</b>: alle massa in een <b>singulariteit</b>; licht kan niet ontsnappen binnen de <b>waarnemingshorizon</b>.']},
{id:'oz',tag:'H3 · §3.1',title:'Ontstaan van het zonnestelsel',sum:[
 'Startpunt: een <b>moleculaire wolk</b> (vooral H₂), asymmetrisch en onstabiel. Een externe trigger laat ze plaatselijk samentrekken tot een <b>protostellaire wolk</b>.',
 'Ca. <b>4,6 miljard jaar</b> geleden: een <b>supernova</b> van een nabije ster. De schokgolf doet de wolk samentrekken en voegt <b>zwaardere elementen</b> toe. De wolk roteert, vormt een vortex en plat af tot een <b>accretieschijf</b>.',
 'Bijna alle massa (99,9%) gaat naar het centrum. Door compressiewarmte stijgt de temperatuur tot miljoenen kelvin → kernfusie → <b>geboorte van de zon</b>. De rest vormt de <b>protoplanetaire schijf</b>.',
 'Dicht bij de zon is het heet: enkel <b>silicaten en metalen</b> zijn vast, vluchtige gassen worden weggeblazen door zonneactiviteit → weinig massa. Voorbij de <b>frost line</b> (voorbij Mars) condenseren vluchtige stoffen (H₂O, H₂, He…), voorbij Saturnus ook CH₄ en NH₃ → veel meer massa.',
 'Stofdeeltjes klitten samen tot keien en stenen; na ca. 1 miljoen jaar objecten &gt; 1 km: <b>planetesimalen</b>. Door botsingen groeien ze; wie groot genoeg wordt om tot een bol samen te trekken is een <b>protoplaneet</b>, die zijn baan vrijmaakt (ringen in de schijf). Wat niet verder groeide, bleef over als <b>kometen en planetoïden</b>.',
 'Vóór de frost line: kleine <b>terrestrische (rotsachtige) planeten</b>: Mercurius, Venus, Aarde, Mars. Voorbij de frost line: grote <b>gas- en ijsreuzen</b>.']},
{id:'sz',tag:'H3 · §3.2',title:'Structuur van het zonnestelsel',sum:[
 'Van binnen naar buiten: <b>binnenzonnestelsel</b> → <b>buitenzonnestelsel</b> → <b>Kuipergordel</b> → <b>Oortwolk</b>.',
 '<b>Binnenzonnestelsel</b>: zon tot en met de planetoïdengordel (ca. 3,3 AE). Rotsachtige planeten en planetoïden, vooral lege ruimte. De <b>planetoïdengordel</b> (miljoenen planetoïden) kon nooit tot een planeet samentrekken door de nabijheid van <b>Jupiter</b>; samen veel minder massa dan de aarde en ver uit elkaar.',
 '<b>Buitenzonnestelsel</b>: van Jupiter (ca. 5 AE) tot Neptunus (ca. 30 AE). Voorbij de frost line → <b>gas- en ijsreuzen</b>.',
 '<b>Kuipergordel</b>: ca. 30 tot 50 AE, <b>donutvorm</b>, veel vluchtige stoffen. Bevat <b>dwergplaneten</b> (Pluto, Eris, Makemake…), honderdduizenden planetoïden en miljarden kometen.',
 '<b>Oortwolk</b>: <b>theoretische</b> zone (niet waargenomen) die verklaart waarom er nog altijd kometen zijn. Binnenste deel donutvormig, buitenste deel <b>bolvormig</b>, tot ca. 100 000 AE. Gevuld met restanten van de schijf die door <b>Jupiter en Saturnus</b> naar buiten geslingerd zijn en gevangen objecten van andere sterren.']},
{id:'zo',tag:'H3 · §3.2',title:'De zon',sum:[
 'Samenstelling: vooral <b>waterstof</b> (ca. 73% van de massa, 92% van de atomen) en <b>helium</b> (ca. 25% van de massa).',
 'Cijfers: 1 AE ver (8,3 lichtminuten); diameter ca. <b>109×</b> die van de aarde; massa ca. 333 000× de aarde; oppervlak ca. <b>5 800 K</b>, kern ca. <b>15 miljoen K</b>. Gemiddelde dichtheid kleiner dan die van de aarde.',
 '<b>Differentiële rotatie</b>: evenaar ca. 25 dagen, polen ca. 35 dagen. Daardoor raken magnetische veldlijnen verstrengeld → zonnevlekken en solar flares.',
 '<b>Opbouw</b> (schillen, van binnen naar buiten): <b>kern</b> (kernfusie) → <b>stralingszone</b> (energie als gammastraling, ca. 171 000 jaar onderweg) → <b>convectiezone</b> (koeler, energie via convectie) → <b>fotosfeer</b> (zichtbare, dunne laag, granulatie) → <b>chromosfeer</b> (ijl, vooral rood licht, spiculen) → <b>corona</b> (zeer ijl, miljoenen km dik, tot ca. 3 miljoen K, enkel zichtbaar bij een zonsverduistering).',
 '<b>Zonnevlekken</b>: koelere (dus donkere) plekken in de fotosfeer door een sterk magnetisch veld. <b>Solar flares</b>: explosies van elektromagnetische straling bij verstrengelde veldlijnen. <b>Protuberansen</b>: lussen van plasma die magnetische veldlijnen volgen.',
 '<b>Zonnewind</b>: continue stroom geladen deeltjes uit de corona (hoge T dus hoge kinetische energie, zwakkere aantrekking ver van de kern). <b>CME</b>: grote bellen plasma die uit de corona worden weggeslingerd.',
 '<b>Zonnecyclus</b>: elke <b>11 jaar</b> polt de zon om. Na ca. 5,5 jaar zonnemaximum (veel vlekken, flares, CME\'s).',
 '<b>Poollicht</b> (aurora borealis/australis): geladen deeltjes worden door het magnetisch veld van de aarde naar de <b>polen</b> geleid, exciteren atmosferische deeltjes die licht uitzenden bij het terugvallen. <b>Zuurstof</b>: groen of rood, <b>stikstof</b>: blauw.']},
{id:'mw',tag:'H4',title:'Het Melkwegstelsel',sum:[
 '<b>Sterrenstelsel</b>: tot miljarden sterren bijeengehouden door zwaartekracht, met een <b>centraal zwart gat</b>, nevels en stof, en donkere materie.',
 '<b>Classificatie van Hubble</b>: <b>elliptisch</b> (E, cijfer = mate van afplatting), <b>spiraalstelsel</b> (S, bolvormige kern, letter = hoe ver de armen van de kern staan), <b>balkspiraalstelsel</b> (SB, kern is een balk) en <b>onregelmatig</b> (chaotisch).',
 'Vorm van de Melkweg: we zitten erin, dus moeilijk. Maar de <b>band</b> aan de hemel toont een <b>platte</b> structuur (geen ellipsoïde) en de <b>snelheden en bewegingsrichtingen</b> van sterren tonen een spiraalbeweging → <b>balkspiraalstelsel</b> met 4 armen.',
 'Cijfers: ca. <b>13,5 miljard jaar</b> oud, diameter ca. <b>100 000 lj</b>, dikte van ca. 1 000 lj (armen) tot 10 000 lj (kern). De zon ligt in de <b>Orionarm</b>, ca. 27 000 lj van de kern, en doet ca. 225 miljoen jaar over één omloop (<b>differentiële rotatie</b>).',
 '<b>Bolvormige sterrenhopen</b> rond de schijf: tienduizenden tot miljoenen <b>oude</b> sterren; vormen met losse sterren de <b>galactische halo</b>. <b>Open sterrenhopen</b> in de schijf: <b>jonge</b> sterren die samen ontstaan zijn en nog uit elkaar bewegen.',
 '<b>Satellietsterrenstelsels</b> draaien rond de Melkweg, bv. de <b>Magelhaense Wolken</b>.',
 '<b>Donkere materie</b>: theoretisch concept, <b>geen interactie met elektromagnetische straling</b> (onzichtbaar), nodig om de <b>zwaartekrachtseffecten</b> te verklaren, diffuus verspreid, ca. <b>85%</b> van alle materie.']},
{id:'ok',tag:'H5',title:'De oerknal',sum:[
 '<b>Roodverschuiving</b>: het spectrum van verre sterrenstelsels is naar rood verschoven → ze bewegen <b>van ons weg</b>.',
 '<b>Georges Lemaître</b>: als stelsels uit elkaar gaan, wordt het heelal groter, dus was het vroeger kleiner → in het begin één punt, het <b>oeratoom</b>, dat "ontplofte".',
 '<b>Bewijs 1 – Edwin Hubble</b>: hoe verder een stelsel, hoe sneller het weg beweegt: een <b>lineair verband</b> tussen afstand en snelheid. Tijd terugdraaien brengt alles terug tot één punt.',
 '<b>Bewijs 2 – nucleosynthese</b>: het oerknalmodel voorspelt een bepaalde verhouding van lichte kernen (²H, ³He, ⁴He, ⁷Li). Die verhouding zien we ook in verre (oude) stelsels en in stelsels met weinig latere kernfusie.',
 '<b>Bewijs 3 – kosmische achtergrondstraling (CMB)</b>: de eerste <b>380 000 jaar</b> waren protonen, neutronen en elektronen los → straling kon niet ontsnappen (ondoorzichtig heelal). Toen <b>atomen</b> ontstonden, kon straling ontsnappen. Die "echo" is door de uitdijing uitgerekt tot <b>microgolven</b> (ca. 3 K) en werd in <b>1965</b> waargenomen → oerknal algemeen aanvaard.']},
{id:'wn',tag:'H6 · §6.1',title:'Waarnemingen van op aarde',sum:[
 'Voor een waarnemer lijkt de aarde een platte schijf: het <b>horizonvlak</b>, omgeven door een <b>hemelkoepel</b>. Recht boven je: <b>zenit</b>, recht onder je: <b>nadir</b>. Daarnaast de windrichtingen.',
 'Overdag beschrijft de zon een <b>dagboog</b> (op in het oosten, onder in het westen). Het hoogste punt is de <b>culminatie</b>; bij ons (noordelijk halfrond) staat de zon dan in het <b>zuiden</b>. In de zomer is de dagboog hoger en langer.',
 '<b>Sterren</b> hebben een "vaste" plaats aan de hemelkoepel op een tijdschaal van jaren, maar niet over millennia (o.a. door precessie). Sterren vormen samen <b>sterrenbeelden</b>.',
 '<b>Planeten</b> verplaatsen zich t.o.v. de sterren en blijven dicht bij de <b>ecliptica</b>. <b>Natuurlijke satellieten</b>: manen, bv. de 4 grote manen van Jupiter (Io, Europa, Ganymedes, Callisto). <b>Kunstmatige satellieten</b>: bv. Starlink.',
 'Kleinere objecten: <b>meteoor</b> (lichtspoor van een brokje dat verbrandt in de atmosfeer), <b>komeet</b> (ijs en stof met staart), <b>planetoïde</b>. <b>Deepsky-objecten</b> (codes uit de Messiercatalogus): M31 = Andromedastelsel, M1 = Krabnevel (supernovarest), M42 = Orionnevel (gebied waar sterren geboren worden).',
 'In het <b>noorden</b>: <b>Kleine Beer</b> met de <b>Poolster (Polaris)</b> en de <b>Grote Beer</b>. Alle sterren lijken in <b>tegenwijzerzin</b> rond Polaris te draaien (door de aardrotatie). In het <b>zuiden</b>: planeten, de maan en de sterrenbeelden van de <b>zodiak</b> (langs de ecliptica). Op het zuidelijk halfrond: het <b>Zuiderkruis</b>.',
 '<b>Astrologie</b> (bijgeloof op basis van de zodiak) is <b>niet</b> hetzelfde als <b>astronomie</b> (de wetenschap).']},
{id:'pb',tag:'H6 · §6.2',title:'Plaatsbepaling',sum:[
 '<b>Geografische coördinaten</b>: <b>breedtegraad</b> = hoek tussen het evenaarsvlak en de normaal in het plaatselijke punt (noord/zuid, 0°–90°). <b>Lengtegraad</b> = hoek tussen het vlak van de <b>nulmeridiaan</b> en de plaatselijke meridiaan (oost/west, 0°–180°).',
 'Met de Poolster: de <b>hoogte van de Poolster boven de horizon = je breedtegraad</b>. Vroeger gemeten met een <b>sextant</b> ("poolshoogte nemen").',
 '<b>GNSS</b> (Global Navigation Satellite Systems): <b>GPS</b> (VS), <b>Galileo</b> (EU), <b>GLONASS</b> (Rusland), <b>Beidou</b> (China). Ontvangers werken vaak met meerdere systemen.',
 'Werking: de satelliet zendt zijn status, positie en baan en het <b>exacte tijdstip</b> (atoomklok) uit. De ontvanger meet het tijdstip van ontvangst (kwartsklok); uit het <b>tijdsverschil</b> volgt de afstand. Je hebt minstens <b>4 satellieten</b> nodig: 3 voor de positie + 1 om de klokfout van de ontvanger weg te werken.',
 '<b>Horizontale coördinaten</b> van een hemellichaam: <b>azimut</b> (richting langs de horizon) en <b>hoogte</b> (hoek boven de horizon). Nadeel: ze hangen af van <b>plaats en tijd</b> van de waarnemer.']},
{id:'sr',tag:'H6 · §6.5',title:'Straling als informatiedrager',sum:[
 'Hemellichamen zenden straling uit in verschillende <b>spectraalbanden</b> van het elektromagnetisch spectrum; elke soort straling geeft andere informatie.',
 '<b>Reflectie</b>: welke golflengten een object weerkaatst zegt iets over zijn samenstelling. De aarde (70% water) weerkaatst vooral blauw licht.',
 '<b>Fraunhoferlijnen</b>: donkere absorptielijnen in een spectrum. Elk element (H, He, Ca, Fe…) heeft zijn eigen lijnenpatroon → zo bepalen we de <b>chemische samenstelling</b>.',
 '<b>Kleur → oppervlaktetemperatuur</b>: blauw = heet, rood = koel.',
 '<b>Dopplereffect</b>: beweegt een object van ons weg, dan schuiven de lijnen naar rood (<b>roodverschuiving</b>); komt het naar ons toe, dan naar blauw (<b>blauwverschuiving</b>). De grootte van de verschuiving is een maat voor de <b>snelheid</b>.',
 'Beelden van niet-zichtbare straling: een <b>CCD-chip</b> met pixels meet per pixel een grijswaarde → omgezet in getallen → met een <b>kleurcode</b> omgezet in een kleurenbeeld (valse kleuren).']}
];

const Qs=[];
const mc=(t,q,ans,wrong,ex,why)=>Qs.push({t,type:'mc',q,opts:[ans,...wrong],ex,why});
const tf=(t,q,val,ex)=>Qs.push({t,type:'tf',q,val,ex});
const fill=(t,q,acc,ex,show)=>Qs.push({t,type:'fill',q,acc,ex,show:show||acc[0]});
const multi=(t,q,good,bad,ex,why)=>Qs.push({t,type:'multi',q,good,bad,ex,why});
const match=(t,q,pairs,ex)=>Qs.push({t,type:'match',q,pairs,ex});
const open=(t,q,model,points,ex)=>Qs.push({t,type:'open',q,model,points,ex});

/* --- H1 De aarde in het heelal --- */
mc('pl','Welke vorm heeft de baan van de aarde rond de zon?','Een ellips met de zon in één brandpunt',['Een perfecte cirkel met de zon in het midden','Een ellips met de zon precies in het midden','Een spiraal die langzaam naar de zon toe gaat'],'Kepler: planeetbanen zijn ellipsen met de zon in één van de twee brandpunten. Daardoor verandert de afstand aarde-zon in de loop van het jaar.',['Dan zou de afstand tot de zon het hele jaar gelijk zijn; er is wel een perihelium en aphelium.','Het midden van een ellips is geen brandpunt; de zon staat uit het midden.','De baan is stabiel; de aarde valt niet naar de zon.']);
match('pl','Koppel elke beweging van de aarde aan de juiste beschrijving.',[['Aardrevolutie','Omloop rond de zon in 1 jaar'],['Aardrotatie','Draaiing om de eigen as in 1 dag'],['Precessie','Tolbeweging van de as in ca. 26 000 jaar']],'Revolutie = rond de zon (jaar), rotatie = om de as (dag), precessie = de as zelf beschrijft een kegel (tolbeweging).');
fill('pl','Hoe heet het punt in de aardbaan waar de aarde het dichtst bij de zon staat?',['perihelium','perihelion'],'Peri = dichtbij, helios = zon. Het verste punt is het aphelium.','perihelium');
fill('pl','Hoe heet het punt in de aardbaan waar de aarde het verst van de zon staat?',['aphelium','aphelion'],'Ap(o) = weg van, helios = zon. De aarde staat daar begin juli.','aphelium');
tf('pl','Het is zomer op het noordelijk halfrond omdat de aarde dan het dichtst bij de zon staat.',false,'Fout: begin juli staat de aarde juist het <i>verst</i> van de zon (aphelium). De seizoenen komen door de <b>helling van de aardas</b> (ca. 23,5°): in juni helt het noordelijk halfrond naar de zon toe, dus de zon staat hoger en de dagen zijn langer.'.replace(/<[^>]+>/g,''));
open('pl','De seizoenen zijn niet even lang: lente + zomer duren op het noordelijk halfrond enkele dagen langer dan herfst + winter. Verklaar dit.','De aardbaan is een ellips. In juli (zomer bij ons) staat de aarde bij het aphelium, het verst van de zon, en beweegt ze trager in haar baan. Daardoor duurt dat stuk van de baan langer. In januari (perihelium) beweegt ze sneller, dus herfst en winter zijn korter.',['Baan is een ellips (perihelium/aphelium)','Bij het aphelium (juli) beweegt de aarde trager','Trager = langer over dat deel van de baan = langere zomer'],'Hoe dichter bij de zon, hoe sneller een planeet beweegt (2e wet van Kepler).');
mc('pl','Hoe groot is ongeveer de helling (inclinatie) van de aardas?','Ca. 23,5°',['Ca. 0°','Ca. 45°','Ca. 90°'],'De as helt ca. 23,5° t.o.v. de loodlijn op het eclipticavlak. Dat is de oorzaak van de seizoenen.',['Bij 0° zouden er geen seizoenen zijn.','45° is veel te veel; de keerkringen liggen op 23,5°.','Bij 90° zou de aarde "op haar zij" liggen, zoals Uranus.']);
mc('pl','In welke richting draait de aarde om haar as?','Van west naar oost',['Van oost naar west','Van noord naar zuid','Afwisselend, afhankelijk van het seizoen'],'De aarde draait van west naar oost (tegenwijzerzin gezien boven de noordpool). Daarom zien we de zon en sterren juist in het oosten opkomen en in het westen ondergaan.',['Dat is de schijnbare beweging van de zon aan de hemel, niet de draairichting van de aarde.','De aarde draait rond een as door de polen, dus niet in noord-zuidrichting.','De draairichting is altijd hetzelfde.']);
mc('pl','Wat is precessie?','Een tolbeweging van de aardas',['Een schommeling van de afstand aarde-zon','Een wiebeling van de baan van de maan','Een verandering van de ashelling naar 45°'],'De as beschrijft langzaam een kegel rond de loodlijn op het eclipticavlak, zoals een tol die wiebelt, in ca. 26 000 jaar.',['Dat komt door de elliptische baan.','Dat gaat over de maan, niet over de aardas.','De helling blijft ca. 23,5°; de richting van de as verandert.']);
fill('pl','Hoe lang duurt één volledige precessiebeweging van de aardas ongeveer? (in jaar)',['26000','ca26000','25800','25772','26000jaar'],'Ongeveer 26 000 jaar.','ca. 26 000 jaar');
open('pl','Noem een gevolg van de precessie dat we aan de hemel kunnen zien en leg uit waarom.','Omdat de aardas langzaam van richting verandert, wijst ze over millennia naar een ander punt aan de hemel. Daardoor is Polaris niet altijd de poolster (over ca. 12 000 jaar is dat Vega). Ook verschuiven de sterrenbeelden van de zodiak t.o.v. de seizoenen; sterren staan dus niet "vast" op een tijdschaal van millennia.',['De richting van de aardas verandert langzaam','Een zichtbaar gevolg: de poolster verandert, óf de sterrenbeelden verschuiven t.o.v. de seizoenen','Dat gaat over duizenden jaren (periode ca. 26 000 jaar)'],'Precessie verandert de richting van de as, niet de helling.');
mc('pl','Wat is een astronomische eenheid (AE)?','De gemiddelde afstand tussen de aarde en de zon',['De afstand die licht in één jaar aflegt','De afstand tussen de aarde en de maan','De diameter van het zonnestelsel'],'1 AE ≈ 150 miljoen km (precies 149 597 871 km). Handig binnen het zonnestelsel.',['Dat is een lichtjaar.','Dat is ca. 384 400 km, veel minder dan 1 AE.','Het zonnestelsel is vele tientallen tot duizenden AE groot.']);
fill('pl','1 AE is precies 149 597 871 km. Afgerond hoeveel miljoen km is dat?',['150','150miljoen','150000000','150miljoenkm'],'Afgerond 150 miljoen km.','150 miljoen km');
mc('pl','Wat is een lichtjaar?','Een afstand: hoe ver licht in één jaar reist',['Een tijdseenheid: de tijd die licht nodig heeft om de zon te bereiken','De helderheid van een ster na één jaar','De tijd die de aarde nodig heeft om rond de zon te gaan'],'Ondanks het woord "jaar" is een lichtjaar een afstand: ca. 9,46 × 10¹² km. Gebruikt buiten het zonnestelsel.',['Het is geen tijdseenheid, en zonlicht doet er maar 8,3 minuten over.','Een lichtjaar zegt niets over helderheid.','Dat is gewoon een jaar.']);
open('pl','De lichtsnelheid is 299 792 458 m/s. Leg uit hoe je daarmee de lengte van 1 lichtjaar in km berekent (je hoeft het niet exact uit te rekenen).','Afstand = snelheid × tijd. Je zet de lichtsnelheid om naar km/s (ca. 300 000 km/s) en vermenigvuldigt met het aantal seconden in een jaar (365,25 × 24 × 60 × 60 ≈ 31,6 miljoen s). Dat geeft ca. 9,46 × 10¹² km.',['Afstand = snelheid × tijd','De tijd is 1 jaar, omgezet naar seconden','De snelheid in km/s (ca. 300 000 km/s)'],'Zo werken ook lichtminuten en lichtseconden: zon 8,3 lichtminuten, maan 1,28 lichtseconden.');
mc('pl','De zon staat op ongeveer 8,3 lichtminuten. Wat betekent dat?','Zonlicht doet ca. 8 minuten over de reis',['De zon draait in 8,3 minuten om haar as','De zon staat 8,3 miljoen km ver','Licht legt 8,3 km per minuut af'],'Een lichtminuut is de afstand die licht in 1 minuut aflegt. We zien de zon dus zoals ze ca. 8 minuten geleden was.',['Een lichtminuut is een afstand, geen draaitijd.','8,3 lichtminuten is ca. 150 miljoen km.','Licht gaat ca. 300 000 km per seconde.']);
multi('pl','Welke eenheden gebruik je voor afstanden <i>binnen</i> het zonnestelsel? Kies alle juiste.'.replace(/<[^>]+>/g,''),['Kilometer','Astronomische eenheid (AE)','Lichtminuten of lichtseconden'],['Parsec','Megalichtjaar'],'Binnen het zonnestelsel: km, AE en eventueel lichtminuten/-seconden. Parsec en lichtjaar zijn voor afstanden tussen sterren.',['Een parsec (3,26 lj) is veel te groot voor het zonnestelsel.','Een megalichtjaar gebruik je voor afstanden tussen sterrenstelsels.']);
mc('pl','Proxima Centauri, de dichtstbijzijnde ster na de zon, staat op ca. 40 biljoen km. Welke eenheid gebruik je hiervoor best?','Lichtjaar (ca. 4,2 lj)',['AE (ca. 270 000 AE)','Kilometer (nauwkeurigst)','Lichtminuut (ca. 2,2 miljoen)'],'Buiten het zonnestelsel gebruik je het lichtjaar. Proxima staat op 4,246 lj.',['In AE wordt het getal onhandig groot. AE gebruik je binnen het zonnestelsel.','Met km krijg je getallen van 14 cijfers; nauwkeurigheid is niet het probleem.','Lichtminuten gebruik je binnen het zonnestelsel.']);
mc('pl','Hoe kun je de afstand tot een nabije ster bepalen?','Parallax: verschuiving t.o.v. verre sterren',['Radar: wachten op de echo van de ster','Helderheid: hoe zwakker, hoe verder','Kleur: hoe roder, hoe verder'],'Kijk je vanuit twee punten (een half jaar uit elkaar, 2 AE), dan verschuift een nabije ster t.o.v. verre achtergrondsterren. Uit die hoek volgt met driehoeksmeting de afstand: hoe kleiner de hoek, hoe verder.',['Een echo zou jaren duren en veel te zwak zijn.','Helderheid hangt ook af van hoeveel energie de ster uitstraalt.','Kleur geeft de temperatuur, niet de afstand.']);
match('pl','Koppel elk niveau van de structuur van het heelal aan een voorbeeld.',[['Planetenstelsel','Het zonnestelsel'],['Sterrenstelsel','De Melkweg'],['Cluster','De Lokale Groep']],'Van klein naar groot: planetenstelsel → sterrenstelsel → cluster → nog grotere gehelen.');
mc('pl','Wat is een planetenstelsel?','Planeten rond één centrale ster',['Sterren rond één centraal zwart gat','Alle planeten van de Melkweg samen','Een planeet met al haar manen'],'Een planetenstelsel is de kleinste groep hemellichamen: 2 of meer planeten bijeengehouden door de zwaartekracht van één ster, bv. ons zonnestelsel.',['Dat beschrijft een sterrenstelsel.','Dat is geen begrip uit de cursus.','Een planeet met manen is geen planetenstelsel; er moet een ster in het centrum.']);
mc('pl','Wat is een cluster (van sterrenstelsels)?','Een groep van 30 tot 1000 sterrenstelsels',['Een groep van miljarden sterren','Een groep planeten rond één ster','Een paar botsende sterrenstelsels'],'Sterrenstelsels trekken elkaar aan via de zwaartekracht. Onze cluster heet de Lokale Groep.',['Dat is een sterrenstelsel.','Dat is een planetenstelsel.','Een cluster telt 30 tot 1000 stelsels, en ze botsen niet noodzakelijk.']);
tf('pl','Een sterrenstelsel bevat naast sterren ook planeten, gas- en stofwolken en wellicht donkere materie.',true,'Juist. De onderdelen worden bijeengehouden door hun onderlinge zwaartekracht.');

/* --- H2 Sterren --- */
mc('st','Hipparchus deelde sterren in volgens schijnbare magnitude op een schaal van 1 tot 6. Welke sterren kregen magnitude 1?','De helderste sterren',['De zwakste sterren','De dichtstbijzijnde sterren','De grootste sterren'],'Hoe lager de magnitude, hoe helderder. Magnitude 6 was net zichtbaar met het blote oog.',['Die kregen magnitude 6.','Hipparchus kon geen afstanden meten; hij keek naar de helderheid.','Hij kon de grootte niet meten; hij keek naar de helderheid.']);
tf('st','Een ster met magnitude 2 lijkt helderder dan een ster met magnitude 5.',true,'Juist: lager getal = helderder.');
mc('st','Waarom kan een magnitude ook negatief zijn?','De schaal loopt door voorbij 0 voor felle objecten',['Het object staat dan onder de horizon','Het object weerkaatst enkel zonlicht','Het object staat dichter dan 10 parsec'],'Moderne metingen verfijnden de schaal van Hipparchus. Heel heldere objecten krijgen negatieve waarden: zon −26,7, Sirius −1,44.',['De positie aan de hemel bepaalt het teken niet.','Ook de maan en planeten weerkaatsen licht; het teken hangt af van de helderheid.','Dan is m kleiner dan M, maar daarom nog niet negatief.']);
mc('st','Een magnitudeverschil van 1 komt overeen met een helderheidsverschil van factor 2,512. Hoeveel keer helderder is een ster van magnitude 1 dan een van magnitude 6?','100 keer',['5 keer','12,5 keer','2,512 keer'],'Het is een logaritmische schaal: 2,512⁵ ≈ 100. Vijf magnitudes verschil = factor 100.',['Je moet vermenigvuldigen, niet optellen: 2,512 × 2,512 × … (5 keer).','5 × 2,512 = 12,5 is fout: de factoren worden vermenigvuldigd, niet opgeteld.','Dat is het verschil voor 1 magnitude, niet voor 5.']);
mc('st','Waarom heet het "schijnbare" magnitude?','Ze hangt ook af van de afstand',['Ze is gemeten op 10 parsec','Ze wordt enkel met het oog gemeten','Ze verandert met het seizoen'],'Een zwakke ster dichtbij kan even helder lijken als een felle ster ver weg.',['Dat is de absolute magnitude.','Moderne metingen gebruiken instrumenten.','Sterren zijn het hele jaar even helder.']);
mc('st','De James Webb-telescoop ziet objecten tot magnitude 34 (in infrarood). Wat betekent dat?','Ze ziet extreem zwakke objecten',['Ze ziet enkel extreem heldere objecten','Ze ziet objecten tot 34 lichtjaar ver','Ze ziet sterren tot 34 keer de zon'],'Hoog getal = zwak. Magnitude 34 is miljarden keren zwakker dan wat je met het blote oog ziet (ca. 6).',['Hoe hoger de magnitude, hoe zwakker. Felle objecten hebben lage of negatieve waarden.','Magnitude is een helderheid, geen afstand.','Magnitude zegt niets rechtstreeks over de grootte.']);
mc('st','Volgens de wet van de kwadratische afname: als je een ster op 2 keer zo grote afstand zet, hoeveel licht ontvang je dan nog?','Een vierde (¼)',['De helft (½)','Evenveel','Een achtste (⅛)'],'Ontvangen straling is omgekeerd evenredig met het kwadraat van de afstand: 1/2² = 1/4. Het licht verspreidt zich over een 4× zo groot oppervlak.',['Dat zou een gewoon omgekeerd evenredig verband zijn, maar het is kwadratisch.','Hoe verder, hoe zwakker.','Dat zou kubisch zijn (1/2³).']);
open('st','Waarom heb je de absolute magnitude nodig als je wil weten welke ster echt het meeste licht uitstraalt?','De schijnbare magnitude hangt af van twee dingen: de afstand en de hoeveelheid energie die de ster uitstraalt. Een ster kan helder lijken omdat ze gewoon dichtbij staat. De absolute magnitude zet alle sterren (denkbeeldig) op dezelfde afstand van 10 parsec, zodat je enkel de echte lichtkracht vergelijkt.',['Schijnbare magnitude hangt ook af van de afstand','Absolute magnitude = magnitude op een vaste afstand (10 pc)','Zo vergelijk je de echte uitgestraalde energie'],'Zonder vaste afstand vergelijk je appels met peren.');
mc('st','Wat is de absolute magnitude van een ster?','Haar magnitude op 10 parsec afstand',['Haar magnitude gezien vanaf de aarde','Haar magnitude op 1 AE afstand','Haar magnitude op 1 lichtjaar afstand'],'10 pc = 32,6 lichtjaar. Zo kun je de echte lichtkracht vergelijken.',['Dat is de schijnbare magnitude.','De referentieafstand is 10 parsec.','De referentieafstand is 10 parsec (32,6 lj).']);
fill('st','Hoeveel parsec is de referentieafstand voor de absolute magnitude?',['10','10pc','10parsec','tien'],'10 parsec, of 32,6 lichtjaar.','10 parsec');
mc('st','Gegeven: Zon m = −26,9 en M = 4,8; Sirius m = −1,44 en M = 1,41; Betelgeuze m = 0,45 en M = −5,14; GJ 75 m = 5,63 en M = 5,63. Welke ster zendt het meeste licht uit?','Betelgeuze',['De zon','Sirius','GJ 75'],'Kijk naar de absolute magnitude: de laagste M (−5,14) is de grootste echte lichtkracht. De zon lijkt alleen zo fel omdat ze zo dichtbij is.',['De zon heeft de laagste schijnbare magnitude, maar dat komt door haar kleine afstand. Haar M (4,8) is niet de laagste.','Sirius lijkt helder, maar M = 1,41 is hoger dan die van Betelgeuze.','GJ 75 heeft de hoogste M en is dus de zwakste ster.']);
mc('st','Gegeven: GJ 75 heeft schijnbare magnitude m = 5,63 en absolute magnitude M = 5,63. Wat besluit je?','GJ 75 staat op precies 10 parsec',['GJ 75 staat dichter dan 10 parsec','GJ 75 staat verder dan 10 parsec','GJ 75 is even lichtsterk als de zon'],'Als m = M lijkt de ster even helder als op 10 pc, dus staat ze op 10 pc. (m − M = 0 = 5·log(d) − 5 → d = 10.)',['Dan zou de ster helderder lijken dan op 10 pc (m < M).','Dan zou de ster zwakker lijken dan op 10 pc (m > M).','De zon heeft M = 4,8, dus GJ 75 (M = 5,63) is iets zwakker.']);
mc('st','Gegeven: Betelgeuze heeft m = 0,45 en M = −5,14. Wat zegt dat over haar afstand?','Ze staat verder dan 10 parsec',['Ze staat dichter dan 10 parsec','Ze staat precies op 10 parsec','Daar kun je niets over zeggen'],'m > M: ze lijkt zwakker dan ze op 10 pc zou zijn, dus staat ze verder weg. Met m − M = 5,59 vind je ca. 130 pc.',['Dan zou ze helderder lijken dan haar absolute magnitude (m < M), zoals de zon.','Dan zouden m en M gelijk zijn.','Het verschil m − M zegt juist iets over de afstand.']);
mc('st','Waarop is de spectraalklasse van een ster gebaseerd?','Op de kleur en het spectrum van haar straling',['Op haar afstand en schijnbare magnitude','Op haar massa en leeftijd','Op het aantal planeten rond haar'],'Kleur en spectrum hangen samen met de oppervlaktetemperatuur.',['Afstand speelt mee bij de magnitude, niet bij de spectraalklasse.','Die lees je niet rechtstreeks uit het spectrum af.','Planeten hebben niets met de spectraalklasse te maken.']);
match('st','Koppel de kleur van een ster op de hoofdreeks aan haar eigenschappen.',[['Rode hoofdreeksster','Koud oppervlak, lage massa'],['Blauwe hoofdreeksster','Heet oppervlak, hoge massa'],['Gele hoofdreeksster (zoals de zon)','Middelmatige temperatuur en massa']],'Hoe heter, hoe blauwer. Op de hoofdreeks geldt ook: hoe massiever, hoe heter en blauwer. Let op: een rode superreus (Betelgeuze) is koel maar wel zwaar.');
tf('st','Een rode ster heeft een warmer oppervlak dan een blauwe ster.',false,'Omgekeerd: rood = koeler, blauw = heter. Denk aan een gasvlam of een gloeiend stuk ijzer.');
mc('st','Wat zet het Hertzsprung-Russelldiagram tegen elkaar uit?','Temperatuur tegen absolute magnitude',['Temperatuur tegen schijnbare magnitude','Massa tegen leeftijd','Afstand tegen absolute magnitude'],'Het HR-diagram toont temperatuur (spectraalklasse) tegen echte lichtkracht (absolute magnitude). 90% van de sterren ligt op de hoofdreeks.',['Schijnbare magnitude hangt van de afstand af en zegt dus te weinig over de ster.','Dat zijn niet de assen van het diagram.','De afstand staat niet in het HR-diagram.']);
fill('st','Op welke diagonale band in het HR-diagram ligt ongeveer 90% van de sterren?',['hoofdreeks','dehoofdreeks'],'De hoofdreeks: sterren die waterstof tot helium fuseren in hun kern, zoals de zon.');
mc('st','Waar ontstaan sterren?','In moleculaire wolken (vooral H)',['In planetaire nevels van dode sterren','In de Kuipergordel, voorbij Neptunus','In de corona van rode reuzen'],'Dichte knopen in de wolk trekken door zwaartekracht samen tot een bol: een protoster.',['Een planetaire nevel is wat een stervende ster afstoot, geen kraamkamer.','Daar is veel te weinig materie.','De corona is een laag van een ster, geen kraamkamer.']);
open('st','Beschrijf hoe een protoster ontstaat, vanaf de moleculaire wolk.','In een moleculaire wolk (vooral H) trekken dichte knopen samen door de zwaartekracht. Er is genoeg gravitatie om tot een bol samen te trekken. Door de compressie stijgt de temperatuur in de kern (tot tienduizenden kelvin) en valt de materie uiteen in plasma. Zo ontstaat een protoster.',['Moleculaire wolk (vooral H)','Samentrekken door zwaartekracht tot een bol','Compressie → temperatuur stijgt → plasma'],'Een protoster is nog geen echte ster: er is nog geen kernfusie.');
mc('st','Wanneer wordt een protoster een echte ster?','Als kernfusie van H tot He start',['Als ze tot een bol samengetrokken is','Als de jetfase het stof wegblaast','Als ze 50 000 K in de kern haalt'],'Meer massa → meer compressie → hogere temperatuur → deeltjes botsen hard genoeg voor kernfusie. Zonder genoeg massa wordt het een bruine dwerg.',['Ook een protoster is al een bol. Dat maakt er nog geen ster van.','De jetfase komt pas nadat de ster al energie produceert.','Die temperatuur haalt de protoster al; dat volstaat nog niet voor fusie.']);
fill('st','Hoe heet een protoster die te weinig massa heeft om kernfusie te starten?',['bruinedwerg','bruinedwergen','eenbruinedwerg'],'Een bruine dwerg: geen kernfusie, ze trekt gewoon samen en koelt af.','bruine dwerg');
open('st','Waarom stort een ster niet in elkaar door haar eigen zwaartekracht, en waarom zwelt ze ook niet eindeloos op?','De grootte van een ster is een evenwicht tussen twee krachten: de uitwaartse kracht (stralingsdruk) van de kernfusie en de inwaartse zwaartekracht van de massa van de ster. Zolang die in evenwicht zijn, blijft de ster stabiel.',['Uitwaartse kracht door kernfusie','Inwaartse zwaartekracht (gravitatie)','Evenwicht tussen beide bepaalt de grootte'],'Raakt de brandstof op, dan wint de zwaartekracht en krimpt de ster: dat start de volgende fase.');
tf('st','In de jetfase wordt het stof en gas rond een jonge ster weggeblazen in de vorm van een schijf.',true,'Juist. Zodra de ster energie produceert, blaast ze omliggend materiaal weg.');
mc('st','Wat gebeurt er bij een ster van 0,6 tot 8 zonsmassa\'s als de waterstof in de kern op is?','Ze krimpt, He → C start in de kern: rode reus',['Ze ontploft meteen als een supernova','Ze wordt meteen een witte dwerg','Ze start ijzerfusie en wordt superreus'],'Zonder fusie wint de zwaartekracht → krimp → compressiewarmte → nieuwe fusie in de kern, waterstoffusie verhuist naar de schil → ster wordt groter, oppervlak koelt af en kleurt rood.',['Een supernova is voor sterren zwaarder dan 8 M☉.','Eerst komt de rodereusfase; de witte dwerg komt pas als ook He op is.','Superreuzen en ijzerfusie horen bij sterren zwaarder dan 8 M☉.']);
open('st','Een rode reus is enorm groot, maar haar oppervlak is koeler dan dat van de zon. Leg uit hoe dat kan.','De fusie van waterstof tot helium verhuist naar de lagen rond de kern. Door die fusiekracht zwelt de ster op en liggen de buitenste lagen veel verder van de kern. Daardoor koelt het oppervlak af en schuift de kleur op naar rood.',['H → He fusie verhuist naar de buitenlagen','De ster zwelt op: buitenlagen ver van de kern','Oppervlak koelt af → rood'],'Groot en helder (veel oppervlak), maar per m² koeler.');
mc('st','Wat gebeurt er met een ster zoals de zon (tussen 0,6 en 8 M☉) als ook het helium op is?','Planetaire nevel, de kern wordt een witte dwerg',['Supernova, de kern wordt een neutronenster','Ze wordt opnieuw een rode reus met C-fusie','Ze koelt af tot een bruine dwerg'],'Er is te weinig massa om heet genoeg te worden voor een volgende fusie. De witte dwerg koelt daarna af tot een zwarte dwerg.',['Een supernova en neutronenster horen bij sterren van meer dan 8 M☉.','Na helium is er te weinig massa voor een nieuwe fusie.','Een bruine dwerg is een protoster die nooit kernfusie startte.']);
fill('st','Hoe heet een witte dwerg nadat hij volledig is afgekoeld?',['zwartedwerg','eenzwartedwerg'],'Een zwarte dwerg: hij straalt geen licht meer uit.','zwarte dwerg');
mc('st','Waardoor wordt een ster van meer dan 8 M☉ een superreus?','Ze fuseert na elkaar steeds zwaardere elementen, tot ijzer',['Ze slorpt gas op uit een naburige moleculaire wolk','Ze stopt met kernfusie en zwelt op door afkoeling','Ze fuseert enkel helium tot koolstof in een schil'],'Door haar grote massa wordt het telkens heet genoeg voor een volgende fusie.',['Een superreus groeit door haar eigen fusies, niet door gas op te slorpen.','Zonder fusie wint de zwaartekracht en krimpt de ster juist.','Dat lijkt op de rodereusfase van lichtere sterren. Zware sterren gaan door tot ijzer.']);
mc('st','Waarom eindigt de reeks kernfusies in een zware ster bij ijzer (Fe)?','Fusie voorbij ijzer levert geen energie meer op',['Er is dan geen helium meer om te fuseren','IJzer is het zwaarste element dat bestaat','IJzer kan alleen in planeten ontstaan'],'Zonder energie uit fusie houdt niets de zwaartekracht nog tegen: de kern implodeert.',['Helium was al veel eerder op.','Er bestaan zwaardere elementen (goud, uranium…).','IJzer ontstaat juist in zware sterren.']);
open('st','Beschrijf hoe een supernova ontstaat bij een ster zwaarder dan 8 M☉.','Na de fusiereeks tot ijzer zijn geen fusies meer mogelijk. De kern is instabiel en implodeert door de zwaartekracht. De schokgolven van die implosie leiden tot een enorme explosie: de supernova.',['Geen fusie meer voorbij ijzer','Kern implodeert door de zwaartekracht','Schokgolf → explosie = supernova'],'Eerst naar binnen (implosie), dan naar buiten (explosie).');
multi('st','Wat zijn gevolgen van een supernova? Kies alle juiste.',['Gevormde elementen worden in het heelal verspreid','Nieuwe stervorming in nabije nevels kan getriggerd worden','Er blijft een neutronenster of zwart gat over'],['Er ontstaat een witte dwerg','De ster wordt een rode reus'],'Zware elementen in jouw lichaam en in de aarde komen uit vroegere supernova\'s. Ook ons zonnestelsel ontstond na een supernova.',['Een witte dwerg is de eindfase van lichtere sterren zonder supernova.','De rodereus- of superreusfase komt vóór de supernova.']);
match('st','Koppel de beginmassa van een ster aan haar eindstadium.',[['Te weinig voor kernfusie','Bruine dwerg'],['0,6 tot 8 M☉','Witte dwerg (later zwarte dwerg)'],['8 tot 20 M☉','Neutronenster'],['Meer dan 20 M☉','Zwart gat']],'Hoe zwaarder de ster, hoe compacter het restant.');
mc('st','Een witte dwerg kan maximaal 1,4 M☉ zwaar zijn (Chandrasekhar-limiet). Hoe groot is een witte dwerg ongeveer?','Ongeveer zo groot als de aarde',['Zo groot als de zon','Ca. 10 km','Zo groot als een rode reus'],'Bijna een zonsmassa samengeperst tot de grootte van de aarde: extreem dicht.',['Hij is veel kleiner dan de zon.','Ca. 10 km is een neutronenster.','Een rode reus is enorm groot.']);
mc('st','Wat houdt een witte dwerg tegen om verder in te storten?','De beweging (kinetische energie) van elektronen',['Kernfusie van helium tot koolstof in de kern','De kracht binnen de neutronen in de kern','De snelle rotatie rond haar eigen as'],'Bij een neutronenster is dat niet meer genoeg: daar houdt de kracht binnen de neutronen het tegen.',['Een witte dwerg heeft geen kernfusie meer.','Dat is bij een neutronenster.','Rotatie is niet de reden.']);
mc('st','Hoe ontstaat een neutronenster?','Elektronen en protonen versmelten tot neutronen',['Neutronen uit de nevel worden aangetrokken','Waterstof fuseert rechtstreeks tot neutronen','Een witte dwerg verliest al zijn protonen'],'Zo ontstaat een bol van neutronen met een extreem hoge dichtheid, slechts ca. 10 km groot (1,4 tot 2,1 M☉).',['De neutronen ontstaan in de ster zelf.','Fusie levert helium en zwaardere elementen.','Een witte dwerg blijft een witte dwerg als hij onder 1,4 M☉ blijft.']);
fill('st','Hoe heet het punt (oneindig klein) waarin alle massa van een zwart gat samengetrokken is?',['singulariteit','desingulariteit','singulariteiten'],'De singulariteit.','singulariteit');
mc('st','Wat is de waarnemingshorizon van een zwart gat?','De grens waarbinnen zelfs licht niet meer kan ontsnappen',['De plaats waar het zwart gat het helderst is','De ring van sterren rond het zwart gat','De afstand waarop je het zwart gat met een telescoop ziet'],'Wat binnen die grens zit, kunnen we niet waarnemen: er komt geen licht meer uit.',['Een zwart gat zelf zendt geen licht uit.','Het is een denkbeeldige grens, geen ring sterren.','Het gaat om ontsnappen van licht, niet om telescopen.']);
tf('st','Bij een zwart gat is de zwaartekracht zelfs te sterk voor de kracht binnen de neutronen.',true,'Juist. Daardoor stort alles in tot een singulariteit.');

/* --- 3.1 Ontstaan zonnestelsel --- */
mc('oz','Waaruit ontstond ons zonnestelsel?','Een moleculaire wolk, vooral H₂',['Een afgebroken stuk van de Melkweg','Het restant van een witte dwerg','Een gaswolk van vooral helium'],'De wolk was asymmetrisch en onstabiel, waardoor er interne bewegingen mogelijk waren.',['Het zonnestelsel ontstond uit gas en stof, niet uit een afgebroken stuk.','Een witte dwerg is een dode ster, geen gaswolk.','De wolk bestond vooral uit waterstof.']);
mc('oz','Wat zette ca. 4,6 miljard jaar geleden het samentrekken van de wolk in gang?','De schokgolf van een nabije supernova',['De zwaartekracht van een zwart gat','De zonnewind van de jonge zon','Een botsing met de Andromedanevel'],'De schokgolf deed de protostellaire wolk samentrekken en voegde ook zwaardere elementen van de oude ster toe.',['Er was geen zwart gat bij betrokken.','De zon bestond toen nog niet.','Andromeda botst pas over miljarden jaren met de Melkweg.']);
fill('oz','Hoeveel miljard jaar geleden ontstond het zonnestelsel ongeveer?',['46','4,6','4.6','46miljard','4,6miljard'],'Ca. 4,6 miljard jaar geleden.','4,6 miljard jaar');
open('oz','Waarom bevat ons zonnestelsel ook zware elementen (zoals ijzer en zuurstof), terwijl de oorspronkelijke wolk vooral waterstof was?','De supernova die het samentrekken triggerde, voegde zwaardere elementen toe aan de wolk. Die elementen waren gevormd door kernfusie in de oude ster en bij de supernova verspreid.',['Een supernova van een nabije ster','Die ster had zware elementen gemaakt door kernfusie','Ze kwamen bij de explosie in de wolk terecht'],'Je bestaat letterlijk uit sterrenstof.');
mc('oz','Hoe ontstaat de accretieschijf?','De draaiende wolk trekt samen en wordt plat',['De zonnewind blaast het gas tot een schijf','Jupiter trekt het stof in één vlak','De supernova blaast het gas tot een ring'],'Een draaiende wolk die samentrekt, draait sneller en wordt plat, zoals pizzadeeg dat je ronddraait.',['De zon (en dus de zonnewind) bestond toen nog niet.','Jupiter bestond toen nog niet.','De supernova was enkel de trigger; de schijf komt door de rotatie.']);
mc('oz','Hoe werd de zon "geboren"?','Het centrum werd door compressie heet genoeg voor fusie',['Een tweede supernova stak het centrum in brand','Botsende planetesimalen verhitten het centrum','Het centrum ving warmte van naburige sterren'],'Ca. 99,9% van de massa trok naar het centrum. Bij ca. 15 miljoen K konden atoomkernen fuseren.',['De warmte komt van compressie, niet van een explosie.','Planetesimalen ontstonden later, in de schijf rond de zon.','Straling van buiten levert nooit zo\'n hoge temperatuur; compressie wel.']);
open('oz','Waarom zijn de planeten dicht bij de zon klein en rotsachtig?','Dicht bij de zon was het heet. Alleen silicaten en metalen konden er vast zijn, en die vormden maar een kleine fractie van de schijf. Vluchtige stoffen werden door de zonneactiviteit naar buiten geblazen. Er was dus weinig materiaal om planeten uit te bouwen.',['Hoge temperatuur dicht bij de zon','Alleen silicaten en metalen vast (kleine fractie)','Gassen weggeblazen → weinig massa'],'Daarom ontstonden daar Mercurius, Venus, Aarde en Mars.');
mc('oz','Wat is de frost line?','Grens waarachter vluchtige stoffen condenseren',['Grens waarachter geen zonnewind meer komt','Grens tussen Kuipergordel en Oortwolk','Grens waarbinnen geen metaal vast kan zijn'],'De frost line ligt voorbij Mars. Daarachter was er veel meer vast materiaal (ijs), dus veel meer massa voor planeten.',['De zonnewind reikt veel verder dan de frost line.','De frost line ligt veel dichter bij de zon: voorbij Mars.','Metalen en silicaten waren juist dicht bij de zon al vast.']);
multi('oz','Welke stoffen konden pas voorbij de frost line vast worden (condenseren of bevriezen)? Kies alle juiste.',['Water (H₂O)','Methaan (CH₄)','Ammoniak (NH₃)'],['IJzer','Silicaten'],'Vluchtige stoffen zoals water bevriezen pas voorbij de frost line (voorbij Mars); methaan en ammoniak zelfs pas voorbij Saturnus.',['IJzer was ook dicht bij de zon al vast.','Silicaten waren ook dicht bij de zon al vast.']);
mc('oz','Wat zijn planetesimalen?','Samengeklitte brokken groter dan 1 km',['Kleine maantjes rond gasreuzen','Brokstukken van een ontplofte planeet','Jonge planeten die al bolvormig zijn'],'Eerst klitten stofdeeltjes samen tot keien en stenen; na ca. 1 miljoen jaar waren er objecten van meer dan 1 km.',['Manen zijn iets anders.','Er is geen planeet ontploft.','Bolvormig zijn pas de protoplaneten.']);
mc('oz','Wanneer noem je een planetesimaal een protoplaneet?','Als hij door zijn zwaartekracht bolvormig wordt',['Zodra hij groter is dan ongeveer 1 km','Als hij een eigen maan heeft gevangen','Als hij voorbij de frost line ligt'],'Een protoplaneet maakt daarna zijn baan rond de zon vrij van puin en stof en snijdt zo ringen uit in de schijf.',['Vanaf ca. 1 km spreek je nog maar van een planetesimaal.','Manen zijn geen criterium.','Ook binnen de frost line ontstonden protoplaneten (Mercurius tot Mars).']);
multi('oz','Wat bleef er over van planetesimalen die niet verder groeiden? Kies alle juiste.',['Kometen','Planetoïden'],['Protoplaneten','Terrestrische planeten','Bruine dwergen'],'Planetesimalen die niet uitgroeiden tot planeten bleven over als kometen en planetoïden.',['Protoplaneten zijn net planetesimalen die wél verder groeiden.','Die zijn uitgegroeid tot planeten.','Bruine dwergen zijn mislukte sterren, geen planetesimalen.']);
multi('oz','Welke planeten zijn terrestrische (rotsachtige) planeten? Kies alle juiste.',['Mercurius','Venus','Aarde','Mars'],['Jupiter','Neptunus'],'Deze vier liggen vóór de frost line en bestaan vooral uit metalen en silicaten.',['Jupiter is een gasreus.','Neptunus is een ijsreus.']);
mc('oz','Waarom konden voorbij de frost line grote gas- en ijsreuzen ontstaan?','Er was veel meer vast (bevroren) materiaal',['Het was er warmer dan dicht bij de zon','Er waren minder botsingen tussen brokken','Die planeten ontstonden nog vóór de zon'],'Meer bouwmateriaal (ook ijs) en minder invloed van zonneactiviteit → grote kernen, die met hun zwaartekracht ook veel gas vasthielden.',['Het was er juist kouder: daardoor konden vluchtige stoffen bevriezen.','Botsingen waren juist nodig om te groeien.','De zon ontstond eerst; de planeten uit de schijf eromheen.']);

/* --- 3.2 Structuur zonnestelsel --- */
mc('sz','Wat is de juiste volgorde, van binnen naar buiten?','Binnenzonnestelsel – buitenzonnestelsel – Kuipergordel – Oortwolk',['Binnenzonnestelsel – Kuipergordel – buitenzonnestelsel – Oortwolk','Binnenzonnestelsel – Oortwolk – buitenzonnestelsel – Kuipergordel','Oortwolk – binnenzonnestelsel – Kuipergordel – buitenzonnestelsel'],'De Kuipergordel ligt net voorbij Neptunus; de Oortwolk is het buitenste deel.',['De Kuipergordel ligt voorbij het buitenzonnestelsel (voorbij Neptunus).','De Oortwolk is het buitenste deel.','De Oortwolk ligt helemaal buiten.']);
mc('sz','Tot waar loopt het binnenzonnestelsel?','Tot en met de planetoïdengordel',['Tot en met de aarde en de maan','Tot en met Jupiter en zijn manen','Tot en met Neptunus (ca. 30 AE)'],'Van de zon tot ca. 3,3 AE: de rotsachtige planeten en de planetoïdengordel.',['Mars en de planetoïdengordel horen er ook bij.','Jupiter is het begin van het buitenzonnestelsel.','Neptunus is de grens van het buitenzonnestelsel.']);
open('sz','Waarom is de planetoïdengordel nooit tot een planeet samengeklonterd?','Door de nabijheid van Jupiter. De sterke zwaartekracht van Jupiter verstoorde de banen van de planetoïden, waardoor ze nooit konden samentrekken tot één planeet.',['Jupiter ligt er vlakbij','Zijn zwaartekracht verstoort de planetoïden','Daardoor konden ze niet samenklonteren'],'De totale massa van de gordel is bovendien heel klein (ca. 1500× kleiner dan die van de aarde).');
tf('sz','De planetoïdengordel is zo dicht met rotsen gevuld dat ruimtesondes er nauwelijks doorheen kunnen.',false,'Onjuist: de gemiddelde afstand tussen twee planetoïden is ca. 965 000 km, en de totale massa is ca. 1500× kleiner dan die van de aarde. Sondes vliegen er zonder problemen door. Films overdrijven dit sterk.');
fill('sz','Welke planeet zorgde ervoor dat de planetoïdengordel nooit een planeet werd?',['jupiter'],'Jupiter, de zwaarste planeet, ligt net buiten de gordel.','Jupiter');
mc('sz','Waaruit bestaat het buitenzonnestelsel (van Jupiter op ca. 5 AE tot Neptunus op ca. 30 AE)?','Gas- en ijsreuzen',['Rotsachtige planeten','Alleen dwergplaneten','Kometen in een bolvormige wolk'],'Het ligt voorbij de frost line, dus vluchtige stoffen konden condenseren en kristalliseren.',['Die liggen in het binnenzonnestelsel.','Dwergplaneten zitten vooral in de Kuipergordel.','Dat is de Oortwolk.']);
mc('sz','Welke vorm heeft de Kuipergordel?','Een donutvorm',['Een bolvorm','Een rechte lijn','Een spiraal'],'De Kuipergordel ligt rond het buitenzonnestelsel van ca. 30 tot 50 AE.',['Bolvormig is het buitenste deel van de Oortwolk.','Het is geen lijn.','Spiraalvormig is de Melkweg.']);
multi('sz','Wat vind je in de Kuipergordel? Kies alle juiste.',['Dwergplaneten zoals Pluto en Eris','Honderdduizenden planetoïden','Miljarden kometen'],['De gasreus Saturnus','De zon'],'Materie die niet kon samenklonteren tot planeten, met veel vluchtige stoffen.',['Saturnus hoort bij het buitenzonnestelsel.','De zon staat in het centrum.']);
mc('sz','Waarom noemen we de Oortwolk "theoretisch"?','Ze is nooit rechtstreeks waargenomen',['Ze is ondertussen verdwenen','Ze bestaat uit donkere materie','Ze ligt buiten het zonnestelsel'],'De objecten zijn te klein en te ver om te zien. Haar bestaan verklaart wel waarom er nog altijd kometen zijn.',['Volgens de modellen bestaat ze nog steeds.','Ze bestaat uit ijs- en rotsobjecten.','Ze hoort nog bij ons zonnestelsel.']);
open('sz','Welk verschijnsel verklaart de Oortwolk, en waarom is daar een verklaring voor nodig?','Ze verklaart de blijvende aanwezigheid van kometen. Kometen verliezen bij elke passage langs de zon materiaal en zijn na een tijd "op". Dat er na 4,6 miljard jaar nog altijd nieuwe kometen opduiken, betekent dat er een grote voorraad ver weg moet zijn: de Oortwolk.',['Ze verklaart waarom er nog altijd kometen zijn','Kometen verliezen materiaal en verdwijnen','Er moet dus een voorraad ver weg zijn'],'Langperiodieke kometen komen uit de Oortwolk.');
multi('sz','Waarmee is de Oortwolk gevuld? Kies alle juiste.',['Restanten van de protoplanetaire schijf, weggeslingerd door Jupiter en Saturnus','Gevangen objecten uit de schijven van andere sterren'],['Gasreuzen','Dwergsterren','Zonnewind'],'Grote planeten slingerden kleine objecten naar buiten; ook objecten van andere sterren werden gevangen.',['Gasreuzen liggen in het buitenzonnestelsel.','Er zitten geen sterren in.','Zonnewind is een stroom deeltjes, geen inhoud van de wolk.']);
match('sz','Koppel elke zone aan de juiste afstand of vorm.',[['Planetoïdengordel','Tot ca. 3,3 AE'],['Buitenzonnestelsel','Ca. 5 tot 30 AE'],['Kuipergordel','Ca. 30 tot 50 AE, donutvorm'],['Oortwolk','Tot ca. 100 000 AE, buitenste deel bolvorm']],'Let op de orde van grootte: de Oortwolk is duizenden keren verder dan Neptunus.');

/* --- 3.2 De zon --- */
mc('zo','Uit welk element bestaat de zon voor het grootste deel?','Waterstof',['Helium','Zuurstof','IJzer'],'Ca. 73% van de massa (92% van de atomen) is waterstof; helium is ca. 25% van de massa.',['Helium is de tweede, ca. 25% van de massa.','Zuurstof is minder dan 1%.','IJzer is maar een fractie van een procent.']);
mc('zo','Hoeveel keer groter is de diameter van de zon dan die van de aarde?','Ca. 109 keer',['Ca. 10 keer','Ca. 1 000 keer','Ca. 333 000 keer'],'De diameter is ca. 1,39 miljoen km = 109 × die van de aarde. 333 000 is de massa-verhouding.',['Veel te weinig.','Te veel.','Dat is hoeveel keer zwaarder de zon is, niet groter.']);
match('zo','Koppel de temperaturen aan de juiste plaats in de zon.',[['Kern','Ca. 15 000 000 K'],['Fotosfeer (oppervlak)','Ca. 5 800 K'],['Corona','Tot ca. 3 000 000 K'],['Zonnevlek','Ca. 4 500 K']],'Opvallend: de corona is veel heter dan het oppervlak. Zonnevlekken zijn koeler dan de rest van de fotosfeer.');
tf('zo','De zon heeft een kleinere gemiddelde dichtheid dan de aarde.',true,'Juist: de zon is ca. 1,4 × 10³ kg/m³, de aarde 5,4 × 10³ kg/m³. De zon is een bol van gas/plasma, de aarde bestaat uit gesteente en metaal.');
mc('zo','Wat is de differentiële rotatie van de zon?','Evenaar sneller rond (25 d) dan de polen (35 d)',['Polen sneller rond (25 d) dan de evenaar (35 d)','De kern draait niet, alleen het oppervlak','De draairichting wisselt om de 11 jaar'],'Dat kan omdat de zon geen vast lichaam is. Gevolg: verstrengelde magnetische veldlijnen → zonnevlekken en flares.',['Omgekeerd: de evenaar draait sneller.','Ook de kern draait. Het gaat om evenaar versus polen.','Om de 11 jaar polt het magnetisch veld om, niet de draairichting.']);
mc('zo','Wat is het gevolg van de differentiële rotatie?','Verstrengelde veldlijnen: zonnevlekken en flares',['De zon wordt aan de evenaar sterk afgeplat','De zonnewind waait alleen vanuit de polen','De kern draait trager en koelt daardoor af'],'Doordat de evenaar sneller draait, worden veldlijnen opgewonden en verdraaid.',['Dat is niet het gevolg uit de cursus. Het gaat om de magnetische veldlijnen.','De zonnewind komt uit de hele corona.','De rotatie bepaalt de temperatuur van de kern niet; de kernfusie doet dat.']);
mc('zo','Wat is de juiste volgorde van de lagen van de zon, van binnen naar buiten?','Kern – stralingszone – convectiezone – fotosfeer – chromosfeer – corona',['Kern – convectiezone – stralingszone – fotosfeer – corona – chromosfeer','Kern – fotosfeer – stralingszone – convectiezone – chromosfeer – corona','Corona – chromosfeer – fotosfeer – convectiezone – stralingszone – kern'],'Ezelsbruggetje: eerst straling, dan convectie (binnen); dan foto-, chromo-, corona (atmosfeer).',['Straling komt vóór convectie, en de corona is de buitenste laag.','De fotosfeer is het oppervlak, dus ligt buiten de stralings- en convectiezone.','Dat is van buiten naar binnen.']);
mc('zo','Waar gebeurt de kernfusie in de zon?','In de kern',['In de fotosfeer','In de corona','In de convectiezone'],'Alleen in de kern zijn temperatuur (ca. 15 miljoen K) en druk hoog genoeg.',['De fotosfeer is maar ca. 5 800 K.','De corona is heet maar veel te ijl.','Daar wordt energie alleen getransporteerd.']);
match('zo','Koppel de zone aan de manier waarop de energie er getransporteerd wordt.',[['Stralingszone','Via gammastraling (ca. 171 000 jaar onderweg)'],['Convectiezone','Via convectie (stromingen van heet plasma)']],'In de convectiezone (lagere T, ca. 2 miljoen K) zitten elektronen bij de atomen en houden die de straling tegen, dus neemt convectie het over.');
open('zo','Waarom gebeurt het energietransport in de buitenste zone onder het oppervlak via convectie en niet meer via straling?','In de convectiezone is de temperatuur lager. Daardoor blijven elektronen bij de atomen, en die atomen houden de straling tegen (absorberen ze). Straling geraakt er niet meer goed door, dus wordt de energie getransporteerd doordat heet plasma opstijgt en koeler plasma zakt: convectie.',['Lagere temperatuur','Elektronen bij atomen blokkeren de straling','Energie gaat via stroming van plasma (convectie)'],'Je ziet de bovenkant van die convectiecellen als granulatie op de fotosfeer.');
mc('zo','Welke laag van de zon zien we als het "oppervlak"?','De fotosfeer',['De corona','De chromosfeer','De convectiezone'],'De fotosfeer is dun (ca. 400 km), ca. 5 800 K en toont granulatie.',['De corona is enkel zichtbaar bij een zonsverduistering.','De chromosfeer is ijl en vooral rood; je ziet ze normaal niet.','Die ligt onder het oppervlak.']);
fill('zo','Hoe heet het korrelige patroon op de fotosfeer, veroorzaakt door de convectiecellen eronder?',['granulatie','granulen','granulatiepatroon'],'Granulatie: de bovenkant van opstijgende (licht) en zakkende (donker) plasmacellen.','granulatie');
mc('zo','Wanneer kun je de corona met het blote oog zien?','Bij een totale zonsverduistering',['Elke dag bij zonsondergang','Alleen \'s nachts','Bij poollicht'],'De corona is zeer ijl en wordt normaal overstraald door de fotosfeer.',['Dan zie je de fotosfeer, die laag staat.','\'s Nachts staat de zon onder de horizon.','Poollicht is een verschijnsel in onze atmosfeer.']);
mc('zo','Welke laag van de zon geeft vooral rood licht en heeft spiculen (straalvormige uitstoten)?','De chromosfeer',['De fotosfeer','De corona','De kern'],'Chromos = kleur. Spiculen zijn tot ca. 10 000 km hoog en leven ca. 15 minuten.',['De fotosfeer geeft het "gewone" witte licht.','De corona is wit-parelachtig en enkel zichtbaar bij verduistering.','De kern zien we niet.']);
mc('zo','Waarom lijken zonnevlekken donker?','Ze zijn koeler door een sterk magnetisch veld',['Er gebeurt daar geen kernfusie','Ze zijn heter en stralen vooral UV','Er hangt koel gas voor de fotosfeer'],'Een zonnevlek straalt nog steeds fel, maar minder dan de omgeving (ca. 5 800 K), dus lijkt ze donker.',['Kernfusie gebeurt alleen in de kern, nergens aan het oppervlak.','Ze zijn juist koeler (ca. 4 500 K).','Het is de fotosfeer zelf die daar koeler is.']);
match('zo','Koppel elk zonneverschijnsel aan de beschrijving.',[['Solar flare','Explosie van elektromagnetische straling bij verstrengelde veldlijnen'],['Protuberans','Lus van plasma die magnetische veldlijnen volgt'],['CME','Grote bel plasma die uit de corona weggeslingerd wordt'],['Zonnewind','Continue stroom geladen deeltjes uit de corona']],'Flare = straling (licht, röntgen…). CME = materie (plasma). Zonnewind = continu, CME = uitbarsting.');
open('zo','Waarom ontsnapt er continu plasma uit de corona (zonnewind)?','De corona is zeer heet, dus de deeltjes hebben een hoge kinetische energie (bewegen zeer snel). Bovendien liggen ze ver van de kern, dus is de aantrekkingskracht van de zon er kleiner. Samen zorgt dat ervoor dat deeltjes continu aan de zwaartekracht van de zon ontsnappen.',['Hoge temperatuur → hoge kinetische energie','Ver van de kern → kleinere aantrekkingskracht','Daardoor ontsnappen geladen deeltjes continu'],'De zonnewind bestaat uit elektronen, protonen en heliumkernen.');
multi('zo','Uit welke deeltjes bestaat de zonnewind? Kies alle juiste.',['Elektronen','Protonen','Heliumkernen'],['Neutronen','Watermoleculen'],'Het zijn geladen deeltjes; daarom is de zonnewind magnetisch en reageert hij met het magnetisch veld van de aarde.',['Neutronen zijn niet geladen.','Water komt niet uit de corona.']);
fill('zo','Om de hoeveel jaar polt de zon om (zonnecyclus)?',['11','11jaar','elf'],'Elke 11 jaar. Na ca. 5,5 jaar is er een zonnemaximum.','11 jaar');
mc('zo','Wat merk je bij een zonnemaximum?','Veel zonnevlekken, solar flares en CME\'s',['De zon is dan het dichtst bij de aarde','De zon is dan koeler en zwakker','Er zijn dan geen zonnevlekken'],'Bij een zonnemaximum is de zon het actiefst, dus zie je ook vaker poollicht.',['Dat is het perihelium en heeft niets met de zonnecyclus te maken.','Het gaat om activiteit, niet om temperatuur.','Dat is eerder bij een zonneminimum.']);
open('zo','Leg uit hoe poollicht ontstaat, en waarom we het vooral bij de polen zien.','Het magnetisch plasma van de zon (zonnewind, CME) botst met het magnetisch veld van de aarde en wordt langs de veldlijnen naar de polen afgevoerd. Daar exciteren de deeltjes de atomen in de atmosfeer (brengen ze in een hogere energietoestand). Als die terugvallen naar hun grondtoestand, zenden ze licht uit.',['Zonnewind/CME wordt door het magnetisch veld naar de polen geleid','Deeltjes exciteren atomen in de atmosfeer','Bij terugvallen naar de grondtoestand zenden ze licht uit'],'Noorderlicht = aurora borealis, zuiderlicht = aurora australis.');
match('zo','Koppel het gas in de atmosfeer aan de kleur van het poollicht.',[['Zuurstof (O)','Groen of rood'],['Stikstof (N)','Blauw']],'Elk element zendt zijn eigen golflengten uit.');

/* --- H4 Melkweg --- */
multi('mw','Wat bevat een sterrenstelsel? Kies alle juiste.',['Tot miljarden sterren','Een centraal zwart gat','Nevels en stof','Donkere materie'],['Eén enkele ster met planeten','Alleen gas'],'Alles samengehouden door de zwaartekracht.',['Dat is een planetenstelsel.','Een sterrenstelsel bevat ook sterren, stof en meer.']);
match('mw','Koppel het type uit de classificatie van Hubble aan de beschrijving.',[['Elliptisch stelsel','Ellipsoïde; cijfer = mate van afplatting'],['Spiraalstelsel','Bolvormige kern met armen; letter = afstand armen tot kern'],['Balkspiraalstelsel','Kern is een balk, met armen'],['Onregelmatig stelsel','Chaotische structuur, veel variatie']],'Hubble deelde stelsels in volgens hun vorm.');
mc('mw','Wat geeft het cijfer aan bij een elliptisch stelsel (bv. E0, E7)?','De mate van afplatting',['Het aantal armen','De leeftijd in miljard jaar','De afstand tot de Melkweg'],'E0 is bijna rond, E7 sterk afgeplat.',['Elliptische stelsels hebben geen armen.','De leeftijd zit niet in de code.','De afstand zit niet in de code.']);
mc('mw','Wat geeft de letter aan bij een spiraalstelsel (bv. Sa, Sb, Sc)?','Hoe ver de armen van de kern staan',['Het aantal spiraalarmen van het stelsel','De mate van afplatting van de kern','Of de kern al dan niet een balk is'],'Zelfde idee bij balkspiraalstelsels (SBa, SBb…).',['Het aantal armen zit niet in de code.','Afplatting is het cijfer bij elliptische stelsels.','Dat zie je aan S of SB, niet aan de letter erna.']);
fill('mw','Tot welk type uit de classificatie van Hubble behoort de Melkweg?',['balkspiraalstelsel','balkspiraal','balkspiraalsterrenstelsel','sb','gebarreerdspiraalstelsel'],'De Melkweg is een balkspiraalstelsel met 4 armen.','balkspiraalstelsel');
open('mw','We zitten in de Melkweg, dus we kunnen haar niet van buitenaf fotograferen. Hoe weten we dan toch dat het een (balk)spiraalstelsel is en geen elliptisch stelsel?','De Melkweg verschijnt als een band aan de hemel: dat wijst op een platte structuur, dus geen ellipsoïde. Daarnaast tonen de snelheden en bewegingsrichtingen van sterren dat ze in een spiraalbeweging rond het centrum draaien.',['Band aan de hemel → platte structuur → geen ellipsoïde','Snelheden en bewegingsrichtingen van sterren','→ spiraalbeweging'],'Een elliptisch stelsel zou er van binnenuit in alle richtingen ongeveer gelijk uitzien.');
mc('mw','Hoe groot is de diameter van de Melkweg ongeveer?','Ca. 100 000 lichtjaar',['Ca. 100 AE','Ca. 1 000 lichtjaar','Ca. 100 miljoen lichtjaar'],'Licht doet er 100 000 jaar over om de Melkweg over te steken.',['Dat is zelfs nog binnen ons zonnestelsel.','Dat is de dikte bij de armen.','Dat is groter dan onze hele cluster.']);
mc('mw','Waar ligt de zon in de Melkweg?','In de Orionarm, ca. 27 000 lj van de kern',['In het centrum, bij het zwarte gat','Helemaal aan de rand, buiten de armen','In de galactische halo, boven de schijf'],'We zitten ongeveer halverwege tussen het centrum en de rand, in een spiraalarm.',['Het centrum is 27 000 lj van ons.','We zitten in een arm, niet aan de uiterste rand.','We zitten in de schijf.']);
fill('mw','In welke spiraalarm van de Melkweg ligt de zon?',['orionarm','orion','orionarmen','deorionarm'],'De Orionarm.','Orionarm');
tf('mw','Alle sterren in de Melkweg doen even lang over één omloop rond het centrum.',false,'Onjuist: de Melkweg heeft een differentiële rotatie. De zon doet ca. 225 miljoen jaar over één omloop.');
mc('mw','Hoe oud is de Melkweg ongeveer?','Ca. 13,5 miljard jaar',['Ca. 4,6 miljard jaar','Ca. 225 miljoen jaar','Ca. 1 miljoen jaar'],'De Melkweg is bijna zo oud als het heelal (ca. 13,8 miljard jaar).',['Dat is de leeftijd van het zonnestelsel.','Dat is de omlooptijd van de zon rond het centrum.','Veel te jong.']);
match('mw','Koppel het type sterrenhoop aan de kenmerken.',[['Bolvormige sterrenhoop','Rond de schijf, oude sterren, deel van de halo'],['Open sterrenhoop','In de schijf, jonge sterren die nog uit elkaar bewegen']],'Bolvormige hopen zijn tot ca. 12 miljard jaar oud; open hopen zijn sterren die samen ontstaan zijn.');
fill('mw','Hoe heet het bolvormige gebied rond de schijf van de Melkweg, gevormd door bolvormige sterrenhopen en losse oude sterren?',['halo','galactischehalo','degalactischehalo'],'De galactische halo.','galactische halo');
mc('mw','Wat zijn de Magelhaense Wolken?','Satellietstelsels van de Melkweg',['Nevels in de Orionarm','Delen van de Oortwolk','Bolvormige sterrenhopen in de halo'],'Kleine sterrenstelsels die rond de Melkweg draaien, zichtbaar vanaf het zuidelijk halfrond.',['Het zijn volwaardige (kleine) sterrenstelsels.','Ze liggen ver buiten het zonnestelsel.','Bolvormige sterrenhopen horen bij de Melkweg zelf; dit zijn aparte stelsels.']);
mc('mw','Waarom kunnen we donkere materie niet rechtstreeks zien?','Ze heeft geen interactie met straling',['Ze ligt achter de kern van de Melkweg','Ze straalt alleen infrarood uit','Ze bestaat uit te kleine deeltjes'],'We weten dat ze er (wellicht) is door haar zwaartekrachtseffecten.',['Ze ligt diffuus overal verspreid.','Infrarood kunnen we wel waarnemen. Donkere materie straalt helemaal niets uit.','Grootte is niet het probleem: ze zendt geen straling uit en weerkaatst niets.']);
open('mw','Waarom nemen wetenschappers aan dat donkere materie bestaat, hoewel niemand ze ooit gezien heeft?','Omdat er zwaartekrachtseffecten zijn die we niet kunnen verklaren met alleen de zichtbare materie. Zo draaien sterren aan de buitenkant van sterrenstelsels te snel: met alleen de zichtbare massa zouden ze weggeslingerd worden. Er moet dus extra, onzichtbare massa zijn.',['Zichtbare materie verklaart de zwaartekracht niet','bv. sterren aan de rand draaien te snel','→ er moet extra onzichtbare massa zijn'],'Volgens de huidige modellen is ca. 85% van alle materie donkere materie.');
fill('mw','Hoeveel procent van alle materie in het heelal zou donkere materie zijn?',['85','85%','85procent'],'Ca. 85%. Gewone materie is dus maar een kleine minderheid.','ca. 85%');

/* --- H5 Oerknal --- */
mc('ok','Wat betekent het dat het licht van verre sterrenstelsels roodverschoven is?','Ze bewegen van ons weg',['Ze komen naar ons toe','Ze zijn erg koud','Ze bestaan uit rood gas'],'Door het dopplereffect worden golflengten langer (roder) als de bron weg beweegt.',['Dan zou het licht blauwverschoven zijn.','Het gaat om een verschuiving van de spectraallijnen, niet om de kleur door temperatuur.','Het gaat om een verschuiving van het hele spectrum.']);
mc('ok','Welke redenering maakte Georges Lemaître?','Alles begon in één punt: het oeratoom',['Het heelal is eeuwig en even groot','Het heelal krimpt al sinds het begin','Stelsels ontstaan steeds uit het niets'],'Lemaître draaide de uitdijing terug: stelsels gaan uit elkaar → het heelal was vroeger kleiner → alles samen in een oeratoom dat "ontplofte".',['Dat strookt niet met stelsels die uit elkaar bewegen.','Het heelal dijt uit, het krimpt niet.','Dat was niet zijn redenering.']);
mc('ok','Wat ontdekte Edwin Hubble over sterrenstelsels?','Hoe verder weg, hoe sneller ze weg bewegen',['Hoe dichterbij, hoe sneller ze weg bewegen','Ze bewegen allemaal even snel weg','Hoe verder weg, hoe sneller ze naderen'],'Dat lineaire verband tussen afstand en snelheid is een bewijs voor de oerknal: tijd terugdraaien brengt alles in één punt.',['Het is omgekeerd: verder = sneller.','De snelheid hangt af van de afstand.','Verre stelsels zijn roodverschoven, dus ze bewegen weg.']);
open('ok','Waarom is de wet van Hubble (verder = sneller weg) een bewijs voor de oerknal?','Als alle stelsels uit elkaar bewegen en de snelheid evenredig is met de afstand, dan betekent dat: als je de tijd terugdraait, komen alle stelsels op hetzelfde moment samen in één punt. Het heelal is dus ooit begonnen vanuit een heel klein, dicht begin en dijt sindsdien uit.',['Alle stelsels bewegen uit elkaar','Lineair verband afstand-snelheid','Terugdraaien in de tijd → alles komt samen in één punt'],'Dat is precies wat het oerknalmodel voorspelt.');
mc('ok','Wat is het bewijs van de nucleosynthese voor de oerknal?','De voorspelde verhouding lichte kernen klopt',['Er is veel goud en uranium in het heelal','Alle sterren bevatten evenveel ijzer','Lichte kernen ontstaan alleen in sterren'],'Het model voorspelt een bepaalde verhouding van ²H, ³He, ⁴He en ⁷Li. Die meten we in verre (oude) stelsels en in stelsels met weinig latere kernfusie.',['Zware elementen ontstaan in sterren en supernova\'s, niet bij de oerknal.','Dat is niet zo, en het zou ook geen bewijs zijn.','Een deel van ²H, ³He, ⁴He en ⁷Li ontstond bij de oerknal; dat is net het bewijs.']);
multi('ok','Welke drie bewijzen voor de oerknal zag je? Kies alle juiste.',['De roodverschuiving / wet van Hubble','De nucleosynthese (verhouding lichte kernen)','De kosmische achtergrondstraling (CMB)'],['Het bestaan van zwarte gaten','De precessie van de aardas'],'Drie onafhankelijke bewijzen die allemaal kloppen met het model.',['Zwarte gaten bewijzen de oerknal niet.','Precessie gaat over de aarde, niet over het heelal.']);
open('ok','Waarom was het heelal de eerste 380 000 jaar ondoorzichtig, en wat veranderde daarna?','In het begin waren protonen, neutronen en elektronen nog los van elkaar. Straling botste voortdurend tegen die losse (geladen) deeltjes en kon niet ontsnappen: het heelal was ondoorzichtig (opaak). Toen het genoeg afgekoeld was, vormden zich atomen. Vanaf dan kon de straling vrij bewegen en ontsnappen: het heelal werd doorzichtig.',['Losse protonen, neutronen en elektronen','Straling kon niet ontsnappen → ondoorzichtig','Atomen gevormd → straling ontsnapt → doorzichtig'],'Die eerste ontsnapte straling zien we vandaag nog als CMB.');
fill('ok','Wat ontstond er ca. 380 000 jaar na de oerknal, waardoor de eerste straling kon ontsnappen?',['atomen','atoom','de eerste atomen','eerste atomen','neutrale atomen'],'De eerste atomen. Zolang protonen, neutronen en elektronen los waren, kon straling niet ontsnappen. Met de vorming van atomen werd het heelal doorzichtig.','atomen');
mc('ok','Waarom zien we de eerste straling van het heelal vandaag als microgolven, en niet als zichtbaar licht?','De uitdijing heeft de golflengte uitgerekt',['Stof heeft het licht deels geabsorbeerd','De straling komt van koude sterren','Het vroege heelal was al ijskoud'],'Ze komt nu overeen met straling van een bron van ca. 3 K (−270 °C).',['Het gaat om uitrekking door de uitdijing, niet om absorptie.','De straling is ouder dan de eerste sterren.','Het vroege heelal was juist heet; de straling is later uitgerekt.']);
fill('ok','In welk jaar werd de kosmische achtergrondstraling (CMB) voor het eerst waargenomen?',['1965'],'In 1965. Sindsdien is de oerknaltheorie algemeen aanvaard.');
mc('ok','Wat is de CMB (kosmische achtergrondstraling)?','De eerste ontsnapte straling, nu microgolven',['Licht van de eerste sterren, nu zichtbaar','Röntgenstraling van zwarte gaten','Zonlicht dat op stof weerkaatst'],'CMB = Cosmic Microwave Background: de straling die ca. 380 000 jaar na de oerknal kon ontsnappen, nu uitgerekt tot microgolven (ca. 3 K). Waargenomen in 1965.',['De eerste sterren ontstonden pas later; de CMB is ouder.','Ze komt gelijkmatig uit alle richtingen, niet van zwarte gaten.','Ze komt uit alle richtingen, niet van de zon.']);

mc('wn','Wat is de culminatie van de zon?','Het hoogste punt van haar dagboog',['Het moment van zonsopgang','De langste dag van het jaar','Het punt recht boven de waarnemer'],'Bij ons (noordelijk halfrond) staat de zon bij culminatie precies in het zuiden, rond de middag.',['Bij zonsopgang staat de zon het laagst, in het oosten.','Dat is de zomerzonnewende.','Dat is het zenit. In België komt de zon nooit in het zenit.']);
mc('wn','In welke richting staat de zon bij culminatie, gezien vanuit België?','In het zuiden',['In het noorden','In het oosten','Recht in het zenit'],'België ligt ten noorden van de kreeftskeerkring, dus de zon staat op haar hoogste punt altijd in het zuiden.',['Vanuit België staat de zon nooit in het noorden.','In het oosten komt ze op.','In het zenit kan ze enkel tussen de keerkringen staan.']);

mc('wn','Waarom lijken alle sterren rond de Poolster te draaien?','De aarde draait om een as die naar Polaris wijst',['Polaris trekt de andere sterren naar zich toe','Polaris staat in het centrum van de Melkweg','De sterren draaien echt rond Polaris heen'],'Het is een schijnbare beweging: wij draaien, niet de sterren.',['De Poolster is veel te ver van de andere sterren.','Het centrum van de Melkweg ligt in een andere richting.','De beweging is schijnbaar, door de aardrotatie.']);
mc('wn','In welke zin lijken de sterren rond de Poolster te draaien?','Tegenwijzerzin',['Wijzerzin','Ze staan stil','Afwisselend'],'Omdat de aarde van west naar oost draait, lijkt de hemel in tegenwijzerzin rond Polaris te draaien.',['Dat zou zo zijn als de aarde in de andere richting draaide.','Door de aardrotatie bewegen ze wel.','De richting is altijd dezelfde.']);
mc('wn','Bij welk sterrenbeeld hoort de Poolster (Polaris)?','De Kleine Beer',['De Grote Beer','Orion','Het Zuiderkruis'],'Polaris is de laatste ster van de staart van de Kleine Beer. Je vindt hem via de Grote Beer.',['De Grote Beer helpt je de Poolster te vinden, maar Polaris hoort er niet bij.','Orion ligt niet bij de pool.','Het Zuiderkruis zie je alleen op het zuidelijk halfrond.']);
tf('wn','Sterren hebben een vaste plaats aan de hemelkoepel, zelfs over duizenden jaren.',false,'Onjuist: op een tijdschaal van enkele jaren lijken ze vast, maar over millennia verschuiven ze (o.a. door precessie en hun eigen beweging).');
mc('wn','Hoe onderscheid je een planeet van een ster aan de nachthemel, als je meerdere nachten kijkt?','Een planeet verplaatst zich t.o.v. de sterren',['Een planeet twinkelt veel meer','Een planeet staat altijd in het noorden','Een planeet is altijd rood'],'"Planeet" betekent zwerver. Planeten blijven daarbij dicht bij de ecliptica.',['Planeten twinkelen juist minder dan sterren.','Bij ons zie je de planeten in het zuiden, langs de ecliptica.','Alleen Mars is roodachtig.']);
open('wn','Waarom zie je de planeten van ons zonnestelsel en de maan altijd ongeveer langs dezelfde band aan de hemel (de ecliptica)?','Omdat de planeten (en de maan) ongeveer in hetzelfde vlak rond de zon draaien als de aarde: het eclipticavlak. Ze ontstonden allemaal uit dezelfde platte protoplanetaire schijf. Van op aarde zie je dat vlak als een band aan de hemel.',['Planeten draaien ongeveer in het eclipticavlak','Ze ontstonden uit dezelfde platte schijf','Dat vlak zie je als een band (de ecliptica)'],'In België zie je die band in het zuiden, met daarin de sterrenbeelden van de zodiak.');
fill('wn','Noem één van de vier grote manen van Jupiter die je al met een verrekijker kunt zien.',['io','europa','ganymedes','callisto','ganymede','kallisto'],'Io, Europa, Ganymedes en Callisto: de Galileïsche manen, ontdekt door Galileo Galilei in 1610.','Io, Europa, Ganymedes of Callisto');

match('wn','Koppel het kleinere object aan de beschrijving.',[['Meteoor','Lichtspoor van een brokje dat verbrandt in de atmosfeer'],['Komeet','Brok ijs en stof die een staart krijgt bij de zon'],['Planetoïde','Rotsachtig object dat rond de zon draait, kleiner dan een planeet']],'Een "vallende ster" is geen ster maar een meteoor.');

mc('wn','Wat is de Krabnevel (M1)?','Het restant van een supernova',['Een sterrenstelsel naast de Melkweg','Een komeet','Een gebied waar sterren geboren worden'],'Een uitdijende wolk gas van een ster die in het jaar 1054 ontplofte; in het midden zit een neutronenster.',['Dat is bv. M31, Andromeda.','Een komeet hoort bij ons zonnestelsel.','Dat is M42, de Orionnevel.']);
fill('wn','Hoe heet het bekende sterrenbeeld dat je alleen op het zuidelijk halfrond ziet en dat zeelui gebruikten om het zuiden te vinden?',['zuiderkruis','hetzuiderkruis'],'Het Zuiderkruis.','Zuiderkruis');

multi('mw','Wat bevat een sterrenstelsel? Kies alle juiste.',['Tot miljarden sterren','Een centraal zwart gat','Nevels en stof','Donkere materie'],['Eén enkele ster met planeten','Alleen gas'],'Alles samengehouden door de zwaartekracht.',['Dat is een planetenstelsel.','Een sterrenstelsel bevat ook sterren, stof en meer.']);
match('mw','Koppel het type uit de classificatie van Hubble aan de beschrijving.',[['Elliptisch stelsel','Ellipsoïde; cijfer = mate van afplatting'],['Spiraalstelsel','Bolvormige kern met armen; letter = afstand armen tot kern'],['Balkspiraalstelsel','Kern is een balk, met armen'],['Onregelmatig stelsel','Chaotische structuur, veel variatie']],'Hubble deelde stelsels in volgens hun vorm.');
mc('mw','Wat geeft het cijfer aan bij een elliptisch stelsel (bv. E0, E7)?','De mate van afplatting',['Het aantal armen','De leeftijd in miljard jaar','De afstand tot de Melkweg'],'E0 is bijna rond, E7 sterk afgeplat.',['Elliptische stelsels hebben geen armen.','De leeftijd zit niet in de code.','De afstand zit niet in de code.']);
mc('mw','Wat geeft de letter aan bij een spiraalstelsel (bv. Sa, Sb, Sc)?','Hoe ver de armen van de kern staan (hoe open de armen zijn)',['Het aantal sterren','De kleur van het stelsel','Het aantal zwarte gaten'],'Zelfde idee bij balkspiraalstelsels (SBa, SBb…).',['Het aantal sterren zit niet in de code.','De kleur zit niet in de code.','Dat zit niet in de code.']);
fill('mw','Tot welk type uit de classificatie van Hubble behoort de Melkweg?',['balkspiraalstelsel','balkspiraal','balkspiraalsterrenstelsel','sb','gebarreerdspiraalstelsel'],'De Melkweg is een balkspiraalstelsel met 4 armen.','balkspiraalstelsel');
open('mw','We zitten in de Melkweg, dus we kunnen haar niet van buitenaf fotograferen. Hoe weten we dan toch dat het een (balk)spiraalstelsel is en geen elliptisch stelsel?','De Melkweg verschijnt als een band aan de hemel: dat wijst op een platte structuur, dus geen ellipsoïde. Daarnaast tonen de snelheden en bewegingsrichtingen van sterren dat ze in een spiraalbeweging rond het centrum draaien.',['Band aan de hemel → platte structuur → geen ellipsoïde','Snelheden en bewegingsrichtingen van sterren','→ spiraalbeweging'],'Een elliptisch stelsel zou er van binnenuit in alle richtingen ongeveer gelijk uitzien.');
mc('mw','Hoe groot is de diameter van de Melkweg ongeveer?','Ca. 100 000 lichtjaar',['Ca. 100 AE','Ca. 1 000 lichtjaar','Ca. 100 miljoen lichtjaar'],'Licht doet er 100 000 jaar over om de Melkweg over te steken.',['Dat is zelfs nog binnen ons zonnestelsel.','Dat is de dikte bij de armen.','Dat is groter dan onze hele cluster.']);
mc('mw','Waar ligt de zon in de Melkweg?','In de Orionarm, ca. 27 000 lj van de kern',['In het centrum, bij het zwarte gat','Helemaal aan de rand, buiten de armen','In de galactische halo, boven de schijf'],'We zitten ongeveer halverwege tussen het centrum en de rand, in een spiraalarm.',['Het centrum is 27 000 lj van ons.','We zitten in een arm, niet aan de uiterste rand.','We zitten in de schijf.']);
fill('mw','In welke spiraalarm van de Melkweg ligt de zon?',['orionarm','orion','orionarmen','deorionarm'],'De Orionarm.','Orionarm');
tf('mw','Alle sterren in de Melkweg doen even lang over één omloop rond het centrum.',false,'Onjuist: de Melkweg heeft een differentiële rotatie. De zon doet ca. 225 miljoen jaar over één omloop.');
mc('mw','Hoe oud is de Melkweg ongeveer?','Ca. 13,5 miljard jaar',['Ca. 4,6 miljard jaar','Ca. 225 miljoen jaar','Ca. 1 miljoen jaar'],'De Melkweg is bijna zo oud als het heelal (ca. 13,8 miljard jaar).',['Dat is de leeftijd van het zonnestelsel.','Dat is de omlooptijd van de zon rond het centrum.','Veel te jong.']);
match('mw','Koppel het type sterrenhoop aan de kenmerken.',[['Bolvormige sterrenhoop','Rond de schijf, oude sterren, deel van de halo'],['Open sterrenhoop','In de schijf, jonge sterren die nog uit elkaar bewegen']],'Bolvormige hopen zijn tot ca. 12 miljard jaar oud; open hopen zijn sterren die samen ontstaan zijn.');
fill('mw','Hoe heet het bolvormige gebied rond de schijf van de Melkweg, gevormd door bolvormige sterrenhopen en losse oude sterren?',['halo','galactischehalo','degalactischehalo'],'De galactische halo.','galactische halo');
mc('mw','Wat zijn de Magelhaense Wolken?','Satellietsterrenstelsels die rond de Melkweg draaien',['Nevels in de Orionarm','Gaswolken in ons zonnestelsel','Andere namen voor de Oortwolk'],'Kleine sterrenstelsels, zichtbaar vanaf het zuidelijk halfrond.',['Het zijn volwaardige (kleine) sterrenstelsels.','Ze liggen ver buiten het zonnestelsel.','De Oortwolk hoort bij ons zonnestelsel.']);
mc('mw','Waarom kunnen we donkere materie niet rechtstreeks zien?','Ze heeft geen interactie met elektromagnetische straling (ze zendt geen licht uit en weerkaatst het niet)',['Ze ligt achter het centrale zwarte gat','Ze is te klein voor onze telescopen','Ze bestaat alleen in de kern van sterren'],'We weten dat ze er (wellicht) is door haar zwaartekrachtseffecten.',['Ze ligt diffuus overal verspreid.','Grootte is niet het probleem: ze geeft geen straling.','Ze zit verspreid in en rond stelsels.']);
open('mw','Waarom nemen wetenschappers aan dat donkere materie bestaat, hoewel niemand ze ooit gezien heeft?','Omdat er zwaartekrachtseffecten zijn die we niet kunnen verklaren met alleen de zichtbare materie. Zo draaien sterren aan de buitenkant van sterrenstelsels te snel: met alleen de zichtbare massa zouden ze weggeslingerd worden. Er moet dus extra, onzichtbare massa zijn.',['Zichtbare materie verklaart de zwaartekracht niet','bv. sterren aan de rand draaien te snel','→ er moet extra onzichtbare massa zijn'],'Volgens de huidige modellen is ca. 85% van alle materie donkere materie.');
fill('mw','Hoeveel procent van alle materie in het heelal zou donkere materie zijn?',['85','85%','85procent'],'Ca. 85%. Gewone materie is dus maar een kleine minderheid.','ca. 85%');

/* --- H5 Oerknal --- */
mc('ok','Wat betekent het dat het licht van verre sterrenstelsels roodverschoven is?','Ze bewegen van ons weg',['Ze komen naar ons toe','Ze zijn erg koud','Ze bestaan uit rood gas'],'Door het dopplereffect worden golflengten langer (roder) als de bron weg beweegt.',['Dan zou het licht blauwverschoven zijn.','Het gaat om een verschuiving van de spectraallijnen, niet om de kleur door temperatuur.','Het gaat om een verschuiving van het hele spectrum.']);
mc('ok','Welke redenering maakte Georges Lemaître?','Als stelsels uit elkaar gaan, was het heelal vroeger kleiner, dus begon alles in één punt (oeratoom)',['Het heelal is altijd even groot geweest','Het heelal draait rond de aarde','Sterrenstelsels ontstaan uit zwarte gaten'],'Lemaître draaide de uitdijing terug in de tijd: alles samen in een oeratoom, dat "ontplofte".',['Dat strookt niet met de roodverschuiving.','Dat is het oude geocentrische wereldbeeld.','Dat was niet zijn redenering.']);
mc('ok','Wat ontdekte Edwin Hubble over sterrenstelsels?','Hoe verder een stelsel staat, hoe sneller het van ons weg beweegt (lineair verband)',['Alle stelsels bewegen even snel','Hoe dichter, hoe sneller','Stelsels staan stil'],'Dat lineaire verband tussen afstand en snelheid is een bewijs voor de oerknal: tijd terugdraaien brengt alles in één punt.',['De snelheid hangt af van de afstand.','Het is omgekeerd: verder = sneller.','Ze bewegen wel: ze zijn roodverschoven.']);
open('ok','Waarom is de wet van Hubble (verder = sneller weg) een bewijs voor de oerknal?','Als alle stelsels uit elkaar bewegen en de snelheid evenredig is met de afstand, dan betekent dat: als je de tijd terugdraait, komen alle stelsels op hetzelfde moment samen in één punt. Het heelal is dus ooit begonnen vanuit een heel klein, dicht begin en dijt sindsdien uit.',['Alle stelsels bewegen uit elkaar','Lineair verband afstand-snelheid','Terugdraaien in de tijd → alles komt samen in één punt'],'Dat is precies wat het oerknalmodel voorspelt.');
mc('ok','Wat is het bewijs van de nucleosynthese voor de oerknal?','Het model voorspelt een bepaalde verhouding van lichte kernen (²H, ³He, ⁴He, ⁷Li), en die verhouding wordt ook echt waargenomen',['Er zijn veel zware elementen zoals goud in het heelal','Alle sterren bevatten evenveel ijzer','Er is geen helium in het heelal'],'Die verhouding meten we in verre (oude) stelsels en in stelsels waar sinds de oerknal weinig kernfusie gebeurde.',['Zware elementen ontstaan in sterren en supernova\'s, niet bij de oerknal.','Dat is niet zo, en het is geen bewijs.','Er is veel helium, juist een deel uit de oerknal.']);
multi('ok','Welke drie bewijzen voor de oerknal zag je? Kies alle juiste.',['De roodverschuiving / wet van Hubble','De nucleosynthese (verhouding lichte kernen)','De kosmische achtergrondstraling (CMB)'],['Het bestaan van zwarte gaten','De precessie van de aardas'],'Drie onafhankelijke bewijzen die allemaal kloppen met het model.',['Zwarte gaten bewijzen de oerknal niet.','Precessie gaat over de aarde, niet over het heelal.']);
open('ok','Waarom was het heelal de eerste 380 000 jaar ondoorzichtig, en wat veranderde daarna?','In het begin waren protonen, neutronen en elektronen nog los van elkaar. Straling botste voortdurend tegen die losse (geladen) deeltjes en kon niet ontsnappen: het heelal was ondoorzichtig (opaak). Toen het genoeg afgekoeld was, vormden zich atomen. Vanaf dan kon de straling vrij bewegen en ontsnappen: het heelal werd doorzichtig.',['Losse protonen, neutronen en elektronen','Straling kon niet ontsnappen → ondoorzichtig','Atomen gevormd → straling ontsnapt → doorzichtig'],'Die eerste ontsnapte straling zien we vandaag nog als CMB.');
fill('ok','Hoeveel jaar na de oerknal kon de eerste straling ontsnappen? (het getal is 380 000)',['380000','380000jaar'],'Na ca. 380 000 jaar: toen vormden zich de eerste atomen.','380 000 jaar');
mc('ok','Waarom zien we de eerste straling van het heelal vandaag als microgolven, en niet als zichtbaar licht?','Door de uitdijing van het heelal is de straling uitgerekt tot langere golflengten',['Omdat de straling door stof geabsorbeerd werd','Omdat de straling van de zon komt','Omdat het heelal toen al heel koud was'],'Ze komt nu overeen met straling van een bron van ca. 3 K (−270 °C).',['Het gaat om uitrekking door uitdijing, niet om absorptie.','Ze komt uit alle richtingen, niet van de zon.','Het heelal was toen juist heet; de straling is later uitgerekt.']);
fill('ok','In welk jaar werd de kosmische achtergrondstraling (CMB) voor het eerst waargenomen?',['1965'],'In 1965. Sindsdien is de oerknaltheorie algemeen aanvaard.');

mc('wn','Waarom lijken alle sterren rond de Poolster te draaien?','Omdat de aarde om haar as draait en de as bijna naar de Poolster wijst',['Omdat de Poolster de andere sterren aantrekt','Omdat de Poolster in het centrum van de Melkweg staat','Omdat de sterren echt rond de Poolster draaien'],'Het is een schijnbare beweging: wij draaien, niet de sterren.',['De Poolster is daarvoor veel te ver van de andere sterren.','Het centrum van de Melkweg ligt in de richting van Boogschutter.','De beweging is schijnbaar, door de aardrotatie.']);

mc('wn','Hoe onderscheid je een planeet van een ster aan de nachthemel, als je meerdere nachten kijkt?','Een planeet verplaatst zich t.o.v. de sterren',['Een planeet twinkelt veel meer','Een planeet staat altijd in het noorden','Een planeet is altijd rood'],'"Planeet" betekent zwerver. Planeten blijven daarbij dicht bij de ecliptica.',['Planeten twinkelen juist minder dan sterren.','Bij ons zie je de planeten in het zuiden, langs de ecliptica.','Alleen Mars is roodachtig.']);
open('wn','Waarom zie je de planeten van ons zonnestelsel en de maan altijd ongeveer langs dezelfde band aan de hemel (de ecliptica)?','Omdat de planeten (en de maan) ongeveer in hetzelfde vlak rond de zon draaien als de aarde: het eclipticavlak. Ze ontstonden allemaal uit dezelfde platte protoplanetaire schijf. Van op aarde zie je dat vlak als een band aan de hemel.',['Planeten draaien ongeveer in het eclipticavlak','Ze ontstonden uit dezelfde platte schijf','Dat vlak zie je als een band (de ecliptica)'],'In België zie je die band in het zuiden, met daarin de sterrenbeelden van de zodiak.');

mc('pb','Wat is de breedtegraad van een plaats?','De hoek tussen het evenaarsvlak en de normaal (loodlijn) in die plaats, gemeten in het meridiaanvlak',['De hoek tussen de nulmeridiaan en de plaatselijke meridiaan','De afstand tot de noordpool in km','De hoogte boven de zeespiegel'],'Breedte: 0° aan de evenaar, 90° aan de polen (N of Z).',['Dat is de lengtegraad.','Het is een hoek, geen afstand.','Dat is de hoogte, geen coördinaat.']);
mc('pb','Wat is de lengtegraad van een plaats?','De hoek tussen het vlak van de nulmeridiaan en de plaatselijke meridiaan',['De hoek tussen het evenaarsvlak en de normaal in die plaats','De hoek tussen de horizon en de Poolster','De afstand tot de evenaar'],'Lengte: van 0° (Greenwich) tot 180° oost of west.',['Dat is de breedtegraad.','Dat geeft je de breedtegraad.','Het is een hoek, geen afstand.']);
mc('pb','Een zeeman meet dat de Poolster 51° boven de horizon staat. Wat weet hij nu?','Hij bevindt zich op ongeveer 51° noorderbreedte',['Hij bevindt zich op 51° oosterlengte','Het is 51 minuten na middernacht','Hij is 51 km van de kust'],'De hoogte van de Poolster boven de horizon = je breedtegraad. 51° NB is ongeveer België.',['De Poolster geeft je breedte, niet je lengte.','De Poolster staat de hele nacht ongeveer op dezelfde hoogte, dus geeft geen tijd.','Het is een hoek, geen afstand.']);
open('pb','Waarom is de hoogte van de Poolster boven de horizon gelijk aan je breedtegraad? Gebruik de noordpool en de evenaar als voorbeelden.','De Poolster staat (bijna) in het verlengde van de aardas. Op de noordpool (90° NB) wijst de as recht omhoog, dus staat de Poolster in het zenit (90°). Op de evenaar (0°) staat de as evenwijdig met de horizon, dus staat de Poolster op de horizon (0°). Daartussen neemt de hoogte evenredig toe met je breedte.',['Poolster ligt in het verlengde van de aardas','Noordpool 90° NB → Poolster in het zenit (90°)','Evenaar 0° → Poolster op de horizon (0°)'],'Daarom kun je op het zuidelijk halfrond de Poolster niet zien.');
fill('pb','Met welk instrument nam men vroeger "poolshoogte" op zee?',['sextant','desextant','eensextant'],'Een sextant meet de hoek tussen de horizon en een hemellichaam.','sextant');
match('pb','Koppel het GNSS-systeem aan het land of de regio.',[['GPS','Verenigde Staten'],['Galileo','Europese Unie'],['GLONASS','Rusland'],['Beidou','China']],'GNSS = Global Navigation Satellite Systems. Moderne ontvangers gebruiken vaak meerdere systemen.');
mc('pb','Wat zendt een GNSS-satelliet uit?','Haar status, haar positie en baan en het exacte tijdstip van uitzenden',['Een foto van jouw locatie','Alleen haar naam','Het weerbericht'],'De ontvanger vergelijkt het verzendtijdstip met het ontvangsttijdstip.',['De satelliet "ziet" jou niet.','Alleen de naam is niet genoeg om een afstand te berekenen.','Dat doen weersatellieten.']);
mc('pb','Hoe bepaalt de ontvanger de afstand tot een GNSS-satelliet?','Uit het tijdsverschil tussen verzenden en ontvangen van het signaal',['Uit de sterkte van het signaal','Door een laser terug te sturen','Uit de kleur van het signaal'],'Afstand = lichtsnelheid × tijdsverschil. Daarom zijn heel nauwkeurige klokken nodig (atoomklok in de satelliet).',['Signaalsterkte is te onnauwkeurig.','De ontvanger stuurt niets terug.','Radiosignalen hebben geen kleur.']);
open('pb','Je hebt in theorie maar 3 satellieten nodig om een positie te bepalen. Waarom heb je er in de praktijk minstens 4 nodig?','Elke satelliet heeft een zeer nauwkeurige atoomklok, maar de ontvanger (bv. je gsm) heeft maar een kwartsklok, die een klein beetje fout loopt. Omdat licht zo snel gaat, geeft een kleine tijdsfout al een grote afstandsfout. Met een 4e satelliet kan de ontvanger zijn eigen klokfout berekenen en wegwerken. Dus 3 + 1.',['3 satellieten voor de positie (driedimensionaal)','Ontvanger heeft een minder nauwkeurige kwartsklok','De 4e satelliet corrigeert die klokfout'],'Een tijdsfout van 1 microseconde geeft al 300 m afstandsfout.');
mc('pb','In welk type klok werkt een GNSS-satelliet?','Een atoomklok',['Een kwartsklok','Een zonnewijzer','Een slingeruurwerk'],'Atoomklokken zijn uiterst nauwkeurig. De ontvanger heeft meestal een kwartsklok.',['De kwartsklok zit in de ontvanger.','Werkt niet in de ruimte.','Werkt niet in gewichtloosheid.']);
match('pb','Koppel de horizontale coördinaat aan de betekenis.',[['Azimut','De richting langs de horizon (bv. gemeten vanaf het noorden)'],['Hoogte','De hoek tussen de horizon en het hemellichaam']],'Samen geven ze aan waar je moet kijken om een hemellichaam te zien.');
mc('pb','Wat is het nadeel van horizontale coördinaten (azimut en hoogte)?','Ze hangen af van de plaats en het tijdstip van de waarnemer',['Ze zijn alleen bruikbaar voor de zon','Je hebt er een GPS voor nodig','Ze werken niet op het noordelijk halfrond'],'Door de aardrotatie veranderen ze voortdurend, en iemand anders op aarde meet andere waarden.',['Ze werken voor elk hemellichaam.','Een kompas en hoekmeter volstaan.','Ze werken overal.']);

mc('sr','Waarom kijken astronomen met telescopen in verschillende spectraalbanden (radio, infrarood, zichtbaar, röntgen…)?','Elke soort straling geeft andere informatie over een hemellichaam',['Omdat zichtbaar licht niet bestaat in de ruimte','Omdat het mooiere foto\'s geeft','Omdat elke telescoop maar één ster kan bekijken'],'Bv. infrarood ziet door stofwolken heen, röntgen toont zeer hete gebieden.',['Zichtbaar licht bestaat wel.','Het gaat om informatie, niet om esthetiek.','Dat is niet de reden.']);
mc('sr','Waarom ziet de aarde er vanuit de ruimte vooral blauw uit?','Ze is voor ca. 70% bedekt met water, dat vooral blauw licht weerkaatst',['Omdat de aarde heet is','Omdat de aarde naar ons toe beweegt','Omdat de aarde van stikstof gemaakt is'],'Welke golflengten een object weerkaatst, zegt iets over de samenstelling.',['Blauw door temperatuur geldt voor sterren die zelf licht uitstralen.','Dat zou blauwverschuiving zijn, geen blauwe kleur.','Stikstof is niet de reden.']);
mc('sr','Wat zijn Fraunhoferlijnen?','Donkere absorptielijnen in het spectrum, die tonen welke elementen aanwezig zijn',['Lijnen op de foto door een defecte camera','De banen van planeten','Grenzen tussen sterrenbeelden'],'Elk element absorbeert zijn eigen specifieke golflengten. Zo kennen we de samenstelling van sterren zonder er naartoe te gaan.',['Het zijn echte lijnen in het spectrum.','Niets met banen te maken.','Niets met sterrenbeelden te maken.']);
open('sr','Hoe kunnen we weten dat er ijzer en calcium in de zon zitten, zonder er ooit geweest te zijn?','Door het spectrum van het zonlicht te bekijken. Daarin zitten donkere lijnen (Fraunhoferlijnen) op vaste golflengten. Elk element absorbeert zijn eigen specifieke golflengten, een soort vingerafdruk. Als we het patroon van ijzer en calcium terugvinden in het zonnespectrum, weten we dat die elementen in de zon aanwezig zijn.',['Spectrum van het zonlicht','Donkere absorptielijnen (Fraunhoferlijnen)','Elk element heeft zijn eigen patroon (vingerafdruk)'],'Zo werd helium zelfs eerst in de zon ontdekt (helios = zon) voor men het op aarde vond.');
mc('sr','Wat vertelt de kleur van een ster over de ster?','De oppervlaktetemperatuur: blauw is heet, rood is koel',['De afstand: blauw is dichtbij, rood is ver','De leeftijd: blauw is oud, rood is jong','De grootte: blauw is groot, rood is klein'],'Hoe heter een object, hoe korter de golflengte waarbij het het meest straalt.',['Kleur zegt niets rechtstreeks over afstand.','Geen direct verband met de leeftijd.','Rode reuzen zijn enorm groot, dus kleur ≠ grootte.']);
match('sr','Koppel de waarneming in het spectrum aan wat ze betekent.',[['Lijnen verschoven naar rood','Object beweegt van ons weg'],['Lijnen verschoven naar blauw','Object beweegt naar ons toe'],['Grote verschuiving','Hoge snelheid'],['Patroon van donkere lijnen','Chemische samenstelling']],'Dopplereffect: de richting van de verschuiving geeft de bewegingsrichting, de grootte geeft de snelheid.');
mc('sr','Wat is het dopplereffect bij licht?','De verschuiving van de golflengte door de beweging van de bron t.o.v. de waarnemer',['Het buigen van licht rond een zwart gat','Het weerkaatsen van licht op water','Het ontstaan van licht bij kernfusie'],'Hetzelfde effect hoor je bij een sirene die voorbijrijdt (hoger als ze nadert, lager als ze weggaat).',['Dat is zwaartekrachtlenzing.','Dat is reflectie.','Dat is energieproductie, geen dopplereffect.']);
tf('sr','Hoe groter de verschuiving van de spectraallijnen, hoe sneller het object beweegt.',true,'Juist: de grootte van de verschuiving is een maat voor de snelheid, de richting (rood of blauw) geeft de bewegingsrichting.');
open('sr','Hoe wordt van straling die we niet kunnen zien (bv. radiostraling) toch een kleurenbeeld gemaakt?','Een detector met een CCD-chip, opgebouwd uit pixels, meet per pixel hoeveel straling er binnenkomt. Dat geeft een grijswaarde, die omgezet wordt in een getal. Die getallen worden dan met een kleurcode omgezet naar kleuren, zodat er een (valse) kleurenafbeelding ontstaat.',['CCD-chip met pixels meet de straling','Grijswaarden → getallen','Getallen → kleuren via een kleurcode (valse kleuren)'],'De kleuren op zo\'n beeld zijn dus gekozen, niet "echt".');
tf('sr','De kleuren op een radio- of infraroodbeeld van een sterrenstelsel zijn de kleuren die je met je ogen zou zien als je er dichtbij was.',false,'Onjuist: het zijn valse kleuren. Getallen uit de meting worden met een gekozen kleurcode omgezet naar kleuren.');

const LS='aar-kosmografie-quiz-v1';
const ROUND=12;
let P={};
try{P=JSON.parse(localStorage.getItem(LS)||'{}')||{}}catch(e){P={}}
function save(){try{localStorage.setItem(LS,JSON.stringify(P))}catch(e){}}
const TB={};TOPICS.forEach(t=>TB[t.id]=t);

Qs.forEach(q=>{cnt[q.t]=(cnt[q.t]||0)+1;q.id=q.t+'-'+cnt[q.t];QB[q.id]=q;});
const app=document.getElementById('app');
const TYPE={mc:'Meerkeuze',tf:'Juist of onjuist',multi:'Meerdere antwoorden juist',fill:'Invullen',match:'Koppelen',open:'Open vraag',order:'Rangschikken',num:'Rekenen',cloze:'Invultekst'};
const MCT=['mc','tf','multi'];
const KIND={nomc:q=>!MCT.includes(q.type),open:q=>q.type==='open',mc:q=>MCT.includes(q.type)};

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function h(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!==undefined)e.innerHTML=html;return e}
const SUB={'₀':'0','₁':'1','₂':'2','₃':'3','₄':'4','₅':'5','₆':'6','₇':'7','₈':'8','₉':'9','⁻':'','⁺':''};
function norm(s){return String(s).toLowerCase().replace(/[₀-₉⁻⁺]/g,c=>SUB[c]).normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9αβ]/g,'')}
function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let p=[];for(let j=0;j<=n;j++)p[j]=j;for(let i=1;i<=m;i++){let c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
function stat(ids){let m=0;ids.forEach(id=>{if(P[id]&&P[id].mastered)m++});return {m,n:ids.length}}
const idsOf=(t,k)=>Qs.filter(q=>(!t||q.t===t)&&(!k||KIND[k](q))).map(q=>q.id);
function weakIds(){return Qs.filter(q=>P[q.id]&&P[q.id].wrong>0&&!P[q.id].mastered).map(q=>q.id)}

function correctHTML(q){
  if(q.type==='mc')return esc(q.opts[0]);
  if(q.type==='tf')return q.val?'Juist':'Onjuist';
  if(q.type==='fill')return esc(q.show);
  if(q.type==='open')return esc(q.model)+'<ul>'+q.points.map(p=>'<li>'+esc(p)+'</li>').join('')+'</ul>';
  if(q.type==='order')return '<ol>'+q.items.map(t=>'<li>'+esc(t)+'</li>').join('')+'</ol>';
  if(q.type==='num')return fmtNum(q.ans)+(q.unit?' '+esc(q.unit):'');
  if(q.type==='cloze')return clozeParts(q.text).map(p=>typeof p==='string'?esc(p):'<b>'+esc(p.show)+'</b>').join('');
  if(q.type==='multi')return '<ul>'+q.good.map(g=>'<li>'+esc(g)+'</li>').join('')+'</ul>';
  return '<ul>'+q.pairs.map(p=>'<li>'+esc(p[0])+' → '+esc(p[1])+'</li>').join('')+'</ul>';
}

/* ---- widgets ---- */
function wChoice(q,ctx){
  const opts=q.type==='tf'?[{text:'Juist',ok:q.val===true},{text:'Onjuist',ok:q.val===false}]:shuffle(q.opts.map((t,i)=>({text:t,ok:i===0,i})));
  const root=h('div','opts');let sel=null,locked=false;const btns=[];
  opts.forEach((o,i)=>{
    const b=h('button','opt','<span class="key">'+(i+1)+'</span><span class="txt">'+esc(o.text)+'</span>');b.type='button';
    b.onclick=()=>{if(locked)return;sel=o;btns.forEach(x=>x.classList.remove('sel'));b.classList.add('sel');if(!ctx.exam)ctx.submit(api.getRes());else ctx.changed()};
    btns.push(b);root.appendChild(b)});
  const api={root,confirm:ctx.exam,ready:()=>sel!==null,
    getRes:()=>({ok:sel.ok,user:sel.text,why:sel.ok?[]:[q.type==='tf'?'Je koos "'+sel.text+'", maar de stelling is '+(q.val?'juist':'onjuist')+'.':((q.why||[])[sel.i-1]||'Dit antwoord klopt niet.')]}),
    reveal(res){locked=true;btns.forEach((b,i)=>{b.disabled=true;b.classList.remove('sel');if(opts[i].ok)b.classList.add('good');else if(opts[i]===sel)b.classList.add('bad')})},
    key(n){if(btns[n-1])btns[n-1].click()},focus(){}};
  return api;
}
function wMulti(q,ctx){
  const opts=shuffle([...q.good.map(t=>({text:t,ok:true})),...q.bad.map((t,bi)=>({text:t,ok:false,bi}))]);
  const root=h('div','opts');const hint=h('div','hintline','Er zijn '+q.good.length+' juiste antwoorden.');root.appendChild(hint);
  let locked=false;const btns=[];
  opts.forEach((o,i)=>{const b=h('button','opt','<span class="key">'+(i+1)+'</span><span class="txt">'+esc(o.text)+'</span>');b.type='button';o.on=false;
    b.setAttribute('aria-pressed','false');
    b.onclick=()=>{if(locked)return;o.on=!o.on;b.classList.toggle('sel',o.on);b.setAttribute('aria-pressed',o.on);ctx.changed()};
    btns.push(b);root.appendChild(b)});
  return {root,confirm:true,ready:()=>opts.some(o=>o.on),
    getRes:()=>({ok:opts.every(o=>o.on===o.ok),user:opts.filter(o=>o.on).map(o=>o.text).join(', ')||'(niets)',why:[...opts.filter(o=>o.on&&!o.ok).map(o=>'Je koos "'+o.text+'": '+((q.why||[])[o.bi]||'dit hoort er niet bij.')),...opts.filter(o=>!o.on&&o.ok).map(o=>'Je miste "'+o.text+'", dat hoort er wel bij.')]}),
    reveal(){locked=true;btns.forEach((b,i)=>{b.disabled=true;b.classList.remove('sel');const o=opts[i];if(o.ok&&o.on)b.classList.add('good');else if(o.ok&&!o.on)b.classList.add('missed');else if(!o.ok&&o.on)b.classList.add('bad')})},
    key(n){if(btns[n-1])btns[n-1].click()},focus(){}};
}
function wFill(q,ctx){
  const root=h('div','fillrow');const inp=h('input');inp.type='text';inp.id='fill-in';inp.autocomplete='off';inp.autocapitalize='off';inp.spellcheck=false;inp.placeholder='Typ je antwoord';
  inp.setAttribute('aria-label','Antwoord');root.appendChild(inp);
  inp.addEventListener('input',()=>ctx.changed());
  inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();ctx.confirmNow()}});
  return {root,confirm:true,ready:()=>inp.value.trim()!=='',
    getRes(){const u=norm(inp.value);let ok=false,note='';
      const acc=q.acc.map(norm);
      if(acc.includes(u))ok=true;
      else if(u.length>=6&&acc.some(a=>a.length>=6&&lev(u,a)<=1)){ok=true;note='Bijna perfect geschreven. Juiste spelling: '+q.show+'.'}
      return {ok,user:inp.value.trim(),note,why:ok?[]:['Je typte "'+inp.value.trim()+'". Dat is niet het gevraagde begrip, of het is te ver van de juiste spelling verwijderd.']}},
    reveal(res){inp.disabled=true;inp.classList.add(res.ok?'good':'bad')},
    key(){},focus(){inp.focus()}};
}
function wMatch(q,ctx){
  const rights=shuffle(q.pairs.map(p=>p[1]));
  const root=h('div','matchrows');const sels=[];
  q.pairs.forEach((p,i)=>{
    const row=h('div','mrow');const l=h('div','l',esc(p[0]));
    const s=h('select');s.id='m-'+i;s.setAttribute('aria-label',p[0]);
    s.innerHTML='<option value="">Kies...</option>'+rights.map(r=>'<option value="'+esc(r)+'">'+esc(r)+'</option>').join('');
    s.onchange=()=>ctx.changed();sels.push(s);row.appendChild(l);row.appendChild(s);root.appendChild(row)});
  return {root,confirm:true,ready:()=>sels.every(s=>s.value!==''),

    key(){},focus(){}};

function fmtNum(x){const s=String(x).split('.');if(Math.abs(x)>=10000)s[0]=s[0].replace(/\B(?=(\d{3})+(?!\d))/g,' ');return s.join(',')}
function clozeParts(text){return text.split(/\[([^\]]+)\]/).map((p,i)=>i%2?{acc:p.split('/'),show:p.split('/')[0]}:p)}
function accepts(user,acc){const u=norm(user);const a=acc.map(norm);if(a.includes(u))return {ok:true};

function wOpen(q,ctx){

function wOrder(q,ctx){
  let cur=shuffle(q.items.map((t,i)=>({t,i})));
  if(cur.every((o,k)=>o.i===k))cur.reverse();
  const root=h('div','order');root.appendChild(h('div','hintline','Zet in de juiste volgorde met de pijltjes (1 = eerst).'));
  const list=h('ol','olist');root.appendChild(list);let locked=false;
  function draw(focusI,dir){list.innerHTML='';cur.forEach((o,k)=>{
    const li=h('li','oitem'+(locked?(o.i===k?' good':' bad'):''));
    li.innerHTML='<span class="key">'+(k+1)+'</span><span class="txt">'+esc(o.t)+(locked&&o.i!==k?'<span class="fixpos">Hoort op plaats '+(o.i+1)+'</span>':'')+'</span>';
    if(!locked){
      const up=h('button','btn small mv','↑');up.type='button';up.disabled=k===0;up.setAttribute('aria-label','Omhoog: '+o.t);
      const dn=h('button','btn small mv','↓');dn.type='button';dn.disabled=k===cur.length-1;dn.setAttribute('aria-label','Omlaag: '+o.t);
      up.onclick=()=>{[cur[k-1],cur[k]]=[cur[k],cur[k-1]];draw(o.i,'up')};
      dn.onclick=()=>{[cur[k+1],cur[k]]=[cur[k],cur[k+1]];draw(o.i,'dn')};
      li.append(up,dn);

    }

    getRes:()=>{const ok=cur.every((o,k)=>o.i===k);return {ok,user:cur.map(o=>o.t).join(' → '),why:ok?[]:cur.map((o,k)=>o.i!==k?'"'+o.t+'" stond op plaats '+(k+1)+', maar hoort op plaats '+(o.i+1)+'.':null).filter(Boolean)}},
    reveal(){locked=true;draw()},key(){},focus(){}};
}
function wNum(q,ctx){
  const root=h('div','fillrow numrow');const inp=h('input');inp.type='text';inp.inputMode='decimal';inp.autocomplete='off';inp.id='num-in';inp.placeholder='Getal';

  inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();ctx.confirmNow()}});
  const val=()=>parseFloat(inp.value.replace(/\s/g,'').replace(',','.'));
  return {root,confirm:true,ready:()=>!isNaN(val()),
    getRes(){const v=val();const ok=Math.abs(v-q.ans)<=q.tol+1e-9;
      return {ok,user:inp.value.trim()+(q.unit?' '+q.unit:''),why:ok?[]:['Je antwoord '+fmtNum(v)+' ligt te ver van '+fmtNum(q.ans)+(q.tol?' (we aanvaarden ±'+fmtNum(q.tol)+')':'')+'. Kijk hieronder hoe je het berekent.']}},
    reveal(res){inp.disabled=true;inp.classList.add(res.ok?'good':'bad')},key(){},focus(){inp.focus()}};
}
function wCloze(q,ctx){
  const parts=clozeParts(q.text);const root=h('p','cloze');const inps=[];
  parts.forEach(p=>{if(typeof p==='string'){root.appendChild(document.createTextNode(p));return}
    const i=h('input');i.type='text';i.autocomplete='off';i.autocapitalize='off';i.spellcheck=false;i.setAttribute('aria-label','Invulvak '+(inps.length+1));
    i.style.width=Math.max(7,Math.min(18,p.show.length+3))+'ch';
    i.addEventListener('input',()=>ctx.changed());
    i.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();const k=inps.indexOf(i);if(k<inps.length-1)inps[k+1].focus();else ctx.confirmNow()}});
    inps.push(i);i._p=p;root.appendChild(i)});
  let res=[];
  return {root,confirm:true,ready:()=>inps.every(i=>i.value.trim()!==''),
    getRes(){res=inps.map(i=>accepts(i.value,i._p.acc));const ok=res.every(r=>r.ok);
      return {ok,user:inps.map(i=>i.value.trim()).join(' / '),
        note:ok&&res.some(r=>r.close)?'Bijna perfect geschreven. Kijk de spelling na in het juiste antwoord.':'',
        why:ok?[]:inps.map((i,k)=>res[k].ok?null:'Invulvak '+(k+1)+': je typte "'+i.value.trim()+'", juist is "'+i._p.show+'".').filter(Boolean)}},
    reveal(){inps.forEach((i,k)=>{i.disabled=true;i.classList.add(res[k].ok?'good':'bad')})},key(){},focus(){if(inps[0])inps[0].focus()}};
}
function makeWidget(q,ctx){

  const F={fill:wFill,match:wMatch,multi:wMulti,open:wOpen,order:wOrder,num:wNum,cloze:wCloze};return (F[q.type]||wChoice)(q,ctx)}

let S=null,CUR=null;
function startLearn(ids,label){
  const rank=id=>{const p=P[id]||{};return p.mastered?3:(p.wrong>0?0:(p.streak>0?1:2))};
  let pool=shuffle(ids);
  const open=pool.filter(id=>!(P[id]&&P[id].mastered));
  let pick;
  if(open.length){pick=open.sort((a,b)=>rank(a)-rank(b)).slice(0,ROUND)}
  else pick=pool.slice(0,ROUND);
  const items=shuffle(pick).map(id=>{const p=P[id]||{};return {id,need:p.mastered?1:Math.max(1,2-(p.streak||0))}});
  S={mode:'learn',label,scope:ids,queue:items,total:items.length,done:0,first:{},log:[]};
  showQ();
}
function startExam(ids,n,label){
  const pick=shuffle(ids).slice(0,n);
  S={mode:'exam',label,scope:ids,queue:pick.map(id=>({id,need:1})),total:pick.length,done:0,first:{},log:[]};
  showQ();
}
function showQ(){
  if(!S.queue.length){return finish()}
  const item=S.queue[0],q=QB[item.id];window.scrollTo(0,0);
  app.innerHTML='';
  const exam=S.mode==='exam';
  const top=h('div','topbar');
  const stop=h('button','btn small','Stoppen');stop.type='button';stop.onclick=()=>{S.mode==='exam'&&S.log.length?finish(true):home()};
  const bar=h('div','bar','<i style="width:'+Math.round(S.done/S.total*100)+'%"></i>');
  const n=h('div','n',(exam?(S.done+1)+' / '+S.total:S.done+' / '+S.total+' klaar'));
  top.append(stop,bar,n);
  const card=h('div','panel qcard');
  const meta=h('div','meta','<span class="chip a">'+esc(TB[q.t].title)+'</span><span class="chip">'+TYPE[q.type]+'</span>'+(exam?'<span class="chip">Toets</span>':''));
  const qt=h('h2','qtext',esc(q.q));
  const fbBox=h('div');
  const actions=h('div','actions-row');
  let locked=false;
  const ctx={exam,
    changed:()=>{if(conf)conf.disabled=!w.ready()},
    submit:res=>{if(locked)return;locked=true;handle(res)},
    confirmNow:()=>{if(conf&&!conf.disabled)conf.click()}};
  const w=makeWidget(q,ctx);
  let conf=null;
  if(w.confirm){conf=h('button','btn primary',w.label||(exam?'Bevestig':'Controleer'));conf.type='button';conf.disabled=!w.ready();
    conf.onclick=()=>{if(locked||!w.ready())return;if(w.step){conf.remove();conf=null;w.step();return}locked=true;handle(w.getRes())};actions.appendChild(conf)}
  card.append(meta,qt,w.root,fbBox,actions);
  app.append(top,card);
  CUR={w,q,item};
  if(w.focus)w.focus();
  function handle(res){
    if(conf)conf.disabled=true;
    const p=P[item.id]||(P[item.id]={streak:0,mastered:false,wrong:0,seen:0});
    p.seen++;if(S.first[item.id]===undefined)S.first[item.id]=res.ok;
    S.log.push({id:item.id,ok:res.ok,user:res.user,why:res.why||[]});
    if(res.ok){p.streak++;if(p.streak>=2)p.mastered=true;item.need--}
    else{p.streak=0;p.mastered=false;p.wrong++;item.need=2}

      (!res.ok&&res.why&&res.why.length?'<div class="why"><b>Waarom je fout zat:</b><ul>'+res.why.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul></div>':'')+
      (res.note?'<div>'+esc(res.note)+'</div>':'')+
      '<div class="ex">'+(res.ok?'':'<b>Uitleg:</b> ')+esc(q.ex)+'</div>'+
      (res.ok&&item.need>0?'<div class="muted">Nog één keer goed (later in deze ronde) om deze vraag te beheersen.</div>':'')+
      (!res.ok?'<div class="muted">Deze vraag komt zo terug.</div>':'')+
      (res.ok&&item.need<=0?'<div class="muted">Beheerst.</div>':'');

    actions.appendChild(nx);nx.focus();
  }
}

    const ids=idsOf(t.id);const s=stat(ids);
    const c=h('div','panel topic'+(s.m===s.n?' done':''));
    c.innerHTML='<div><div class="tag">'+esc(t.tag)+'</div><h3>'+esc(t.title)+'</h3></div><div><div class="count"><span>'+s.m+' / '+s.n+' beheerst</span><span>'+Math.round(s.m/s.n*100)+'%</span></div><div class="bar thin"><i style="width:'+Math.round(s.m/s.n*100)+'%"></i></div></div>';
    const ac=h('div','actions');
    const b1=h('button','btn small','Theorie');b1.onclick=()=>theory(t.id);
    const b2=h('button','btn small primary',s.m===s.n?'Herhalen':'Oefenen');b2.onclick=()=>startLearn(ids,t.title);
    ac.append(b1,b2);c.appendChild(ac);tg.appendChild(c);
  });
  app.appendChild(tg);
}
home();
</script>
</body>
</html>

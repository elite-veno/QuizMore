<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QuizMore</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F5F7; --surface:#FFFFFF; --surface2:#E7EDF1; --ink:#14232D; --muted:#566873; --line:#D3DDE3;
  --accent:#0B7A75; --accent-ink:#FFFFFF; --accent-soft:#D9EFEC;
  --font-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --font-body:'IBM Plex Sans','Segoe UI',system-ui,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1A21; --surface:#16252E; --surface2:#1D303B; --ink:#E6EEF2; --muted:#93A7B2; --line:#2A404D;
    --accent:#3CC3BB; --accent-ink:#072320; --accent-soft:#12383A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1A21; --surface:#16252E; --surface2:#1D303B; --ink:#E6EEF2; --muted:#93A7B2; --line:#2A404D;
  --accent:#3CC3BB; --accent-ink:#072320; --accent-soft:#12383A;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.5;padding:24px 16px 56px}
.wrap{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:20px;min-width:0}
h1,h2,h3{font-family:var(--font-display);font-weight:700;line-height:1.15;margin:0;letter-spacing:-.01em;text-wrap:balance}
h1{font-size:clamp(32px,6vw,46px)}
h2{font-size:clamp(22px,4vw,28px)}
h3{font-size:18px}
p{margin:0}
.eyebrow{font-family:var(--font-mono);font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--accent)}
.muted{color:var(--muted)}
a{color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.hero{display:flex;flex-direction:column;gap:10px}
.hero p{max-width:60ch;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:14px}
.card{display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:20px;text-decoration:none;min-width:0;transition:border-color .15s,transform .15s}
a.card:hover{border-color:var(--accent);transform:translateY(-2px)}
.card .icon{width:44px;height:44px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-family:var(--font-mono);font-weight:500;font-size:15px}
.card .count{font-size:14px;color:var(--muted)}
.card.empty{opacity:.55}
.card.empty .icon{background:var(--surface2);color:var(--muted)}
.back{align-self:flex-start;font-size:14px;font-weight:600;color:var(--accent);text-decoration:none;background:none;border:0;padding:0;cursor:pointer;font-family:inherit}
.back:hover{text-decoration:underline}
.list{display:flex;flex-direction:column;gap:12px}
.quiz{flex-direction:row;align-items:center;gap:16px}
.quiz .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.quiz .go{font-weight:600;color:var(--accent);white-space:nowrap}
.tag{font-family:var(--font-mono);font-size:12px;color:var(--muted);letter-spacing:.05em}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
/* Vakken en hun quizzen. Nieuwe quiz: zet het bestand in de map van het vak en voeg het hier toe. */
const VAKKEN=[
  {id:'biologie',naam:'Biologie',kort:'BIO',quizzen:[
    {titel:'BIO5 Chemische samenstelling',tag:'Thema 1 · Hoofdstuk 2',
     uitleg:'Elementen, water, O₂ en CO₂, sachariden, lipiden, eiwitten, enzymen en nucleïnezuren.',
     href:'biologie/bio5-chemische-samenstelling.html'}
  ]},
  {id:'chemie',naam:'Chemie',kort:'CHE',quizzen:[]},
  {id:'fysica',naam:'Fysica',kort:'FYS',quizzen:[
    {titel:'Elektrostatica Studielab',tag:'Hoofdstuk 1 en 2',
     uitleg:'Ladingen en de wet van Coulomb: lessen met simulaties, 12 oefeningen, een theorietoets en een spiekbrief.',
     href:'fysica/elektrostatica-studielab.html'}
  ]},
  {id:'wiskunde',naam:'Wiskunde',kort:'WIS',quizzen:[]},
  {id:'aardrijkskunde',naam:'Aardrijkskunde',kort:'AAR',quizzen:[
    {titel:'Kosmografie: heelal en zonnestelsel',tag:'Hoofdstuk 1 tot 6',
     uitleg:'Bewegingen van de aarde, afstanden, sterren, zonnestelsel, de zon, Melkweg, oerknal, waarnemen en plaatsbepaling. Open vragen, rekenen, rangschikken, schema’s en meerkeuze.',
     href:'aardrijkskunde/kosmografie.html'}
  ]},
  {id:'geschiedenis',naam:'Geschiedenis',kort:'GES',quizzen:[]}
];

const app=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const aantal=n=>n===0?'Nog geen quizzen':n===1?'1 quiz':n+' quizzen';

function menu(){
  document.title='QuizMore';
  app.innerHTML='<div class="hero"><div class="eyebrow">QuizMore</div><h1>Kies een vak</h1><p>Oefen per vak met quizzen die bijhouden wat je al beheerst. Klik op een vak om de quizzen te zien.</p></div>'+
    '<div class="grid">'+VAKKEN.map(v=>{
      const inner='<div class="icon">'+esc(v.kort)+'</div><h3>'+esc(v.naam)+'</h3><div class="count">'+aantal(v.quizzen.length)+'</div>';
      return v.quizzen.length?'<a class="card" href="#'+v.id+'">'+inner+'</a>':'<div class="card empty" aria-disabled="true">'+inner+'</div>';
    }).join('')+'</div>';
}

function vak(v){
  document.title=v.naam+' · QuizMore';
  app.innerHTML='<a class="back" href="#">← Alle vakken</a>'+
    '<div class="hero"><div class="eyebrow">'+esc(v.kort)+'</div><h2>'+esc(v.naam)+'</h2><p>'+aantal(v.quizzen.length)+'. Kies een quiz om te starten.</p></div>'+
    '<div class="list">'+v.quizzen.map(q=>
      '<a class="card quiz" href="'+esc(q.href)+'"><div class="txt"><div class="tag">'+esc(q.tag)+'</div><h3>'+esc(q.titel)+'</h3><p class="muted">'+esc(q.uitleg)+'</p></div><span class="go">Start →</span></a>'
    ).join('')+'</div>';
}

function route(){
  const v=VAKKEN.find(x=>x.id===location.hash.slice(1));
  if(v&&v.quizzen.length)vak(v);else menu();
  window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);
route();
</script>
</body>
</html>
